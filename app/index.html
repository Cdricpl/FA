   ========================================================================= */

function vueEnfants(){
  const tout = DB.enfants.map(e => ({ enfant:e, st:statutNotif(e) }));
  const nb = c => tout.filter(o => o.st.code === c).length;

  const q = etat.recherche.trim().toLowerCase();
  const filtre = etat.filtreNotif;
  const GARDE = { recues:"vert", bientot:"orange", attente:"rouge", sansdate:"gris" };

  let liste = tout.filter(o =>
    (!q || (nomComplet(o.enfant) + " " + (o.enfant.service||"")).toLowerCase().includes(q)) &&
    (filtre === "tout" || o.st.code === GARDE[filtre]));

  liste.sort((a,b) => etat.tri === "nom"
    ? parNom(a.enfant, b.enfant)
    : ORDRE_STATUT[a.st.code] - ORDRE_STATUT[b.st.code] ||
      String(a.enfant.notifFin||"9").localeCompare(String(b.enfant.notifFin||"9")));

  // la date seule ; elle ne prend de couleur que si elle approche ou est passée
  const cel = (d, seuil) => {
    const st = statutEcheance(d, seuil);
    return st.code === "orange" || st.code === "rouge"
      ? '<span class="et ' + st.code + '">' + ech(fmtFR(d)) + "</span>" : ech(fmtFR(d));
  };

  /* La notification tient sur deux lignes : son état, puis sa date. Les gestes
     sont regroupés au bout de la ligne, pour que toutes les lignes du tableau
     gardent la même hauteur. */
  const celNotif = (e, st) => {
    const relances = e.relances || [];
    const derniere = relances.length
      ? " · " + pluriel(relances.length,"relance") + " le " + fmtFR(relances[relances.length-1]) : "";
    const detail = st.detail + derniere;
    return '<span class="notif-etat deux-lignes ' + st.code + '">' + ech(st.titre) + "</span>" +
      '<span class="deux-lignes pt doux" title="' + ech(detail) + '">' + ech(detail) + "</span>";
  };

  /* Un seul bouton plein par ligne — celui qu'on cherche neuf fois sur dix —
     et le reste sous « ⋯ ». Avant, la ligne la plus urgente en portait trois,
     tous du même poids : rien ne disait par quoi commencer. */
  const celActions = (e, st) => {
    const principal = st.code === "vert" ? ""
      : '<button class="b mini primaire" data-action="notif-recue" data-id="' + e.id +
        '">Reçue</button>';
    const secondaires =
      (st.code === "vert"
        ? '<button class="b mini" data-action="notif-attente" data-id="' + e.id +
          '">Pas arrivée</button>' : "") +
      (st.code === "vert" || st.code === "gris" ? "" :
        '<button class="b mini" data-action="relance" data-id="' + e.id + '">Relance notée</button>' +
        '<button class="b mini" data-action="tache-notif" data-id="' + e.id +
        '">+ Tâche de relance</button>') +
      '<button class="b mini" data-action="enfant-modifier" data-id="' + e.id +
      '">Modifier la fiche</button>' +
      '<button class="b mini danger" data-action="enfant-supprimer" data-id="' + e.id +
      '">Supprimer</button>';
    return '<div class="actions">' + principal +
      '<details class="plus"><summary aria-label="Autres actions pour ' + ech(nomComplet(e)) +
      '" title="Autres actions">⋯</summary><div class="menu">' + secondaires +
      "</div></details></div>";
  };

  const lignes = liste.map(({enfant:e, st}) => `<tr class="ligne-${st.code}">
      <td class="col-enfant"><span class="nom-enfant deux-lignes" title="${ech(nomComplet(e))}">${
          ech(nomComplet(e))}</span>
        <span class="doux pt deux-lignes">${ech(ageTexte(e))}</span></td>
      <td>${e.service ? ech(e.service) : '<span class="doux">à préciser</span>'}</td>
      <td class="col-notif">${celNotif(e, st)}</td>
      <td class="num pt">${cel(echeanceRapport(e,"semestriel"), DB.parametres.seuilRapportJours)}</td>
      <td class="num pt">${cel(echeanceRapport(e,"annuel"), DB.parametres.seuilRapportJours)}</td>
      <td class="col-actions">${celActions(e, st)}</td>
    </tr>`).join("");

  const incomplets = DB.enfants.filter(e => !estISO(e.notifFin) || !e.service || !estISO(e.naissance));
  /* Tout ce qui agit sur le tableau se tient au-dessus de lui, dans le même
     panneau : le filtre d'état, la recherche, le tri. Les quatre tuiles d'avant,
     en haut de page, filtraient un tableau qu'elles ne touchaient pas. */
  return `<div class="carte">
    <div class="barre">
      ${selecteur("filtre-notif", filtre, [
        ["tout", "Tous", tout.length],
        ["attente", "À réclamer", nb("rouge")],
        ["bientot", "À renouveler", nb("orange")],
        ["recues", "En ordre", nb("vert")],
        ["sansdate", "Sans date", nb("gris")]])}
      <input type="search" id="recherche" placeholder="Rechercher un nom…" class="champ-recherche"
             value="${ech(etat.recherche)}">
      <label class="nowrap pt doux">Trier par
        <select id="tri" class="tri-court">
          <option value="date"${etat.tri==="date"?" selected":""}>urgence</option>
          <option value="nom"${etat.tri==="nom"?" selected":""}>nom</option>
        </select></label>
      <button class="b pousse" onclick="window.print()">Imprimer</button>
      <button class="b primaire" data-action="enfant-nouveau">Nouvel enfant</button>
    </div>
    ${incomplets.length ? '<div class="encadre attention"><div class="titre">' +
      pluriel(incomplets.length,"fiche") + ' incomplète(s)</div><span class="pt">' +
      incomplets.slice(0,8).map(e => ech(nomComplet(e))).join(", ") +
      (incomplets.length > 8 ? " et " + (incomplets.length-8) + " autre(s)" : "") +
      " — il manque la date de naissance, l'autorité ou la date de notification.</span></div>" : ""}
    <div class="tableau-enveloppe">
      <table class="tab-dossiers">
        <thead><tr>
          <th class="col-enfant">Enfant</th><th class="col-autorite">Autorité</th>
          <th class="col-notif">Notification de prise en charge</th>
          <th class="num col-echeance" title="Rapport d'évolution semestriel">Semestriel</th>
          <th class="num col-echeance" title="Formalisation — rapport annuel">Annuel</th>
          <th class="col-actions"><span class="hors-ecran">Actions</span></th>
        </tr></thead>
        <tbody>${lignes || '<tr><td colspan="6" class="vide">' +
          (q || filtre !== "tout" ? "Aucun dossier dans cette sélection."
                                  : "Aucun enfant encodé.") + "</td></tr>"}</tbody>
      </table>
    </div>
    <p class="aide">Dates de rapport en <span class="et orange">orange</span> : dans moins de
      ${DB.parametres.seuilRapportJours} jours ; en <span class="et rouge">rouge</span> : dépassées.</p>
  </div>`;
}

/* =========================================================================
   11. VUE — Rapports (calendrier mois par mois)
   ========================================================================= */

/* Une année civile, de janvier à décembre. Avant, le calendrier partait du
   mois en cours sur douze mois glissants : les rapports déjà envoyés cette
   année sortaient de l'écran à mesure que l'année avançait, et on ne voyait
   plus ce qui avait été fait. */
function rapportsDeLAnnee(an){
  const debut = an + "-01-01", fin = an + "-12-31";
  const l = [];
  DB.enfants.forEach(e => ["annuel","semestriel"].forEach(type => {
    const dates = new Set(occurrencesRapport(e, type, debut, fin));
    // Un rapport coché reste à sa place même si le calcul ne retombe plus sur
    // sa date (notification renouvelée à un autre jour depuis) : ce qui a été
    // envoyé ne doit jamais disparaître de l'année.
    (e.rapports||[]).forEach(r => {
      if(r.type === type && estISO(r.echeance) && r.echeance >= debut && r.echeance <= fin)
        dates.add(r.echeance);
    });
    dates.forEach(date => l.push({ enfant:e, type, date }));
  }));
  const auj = aujourdHui();
  l.forEach(o => {
    const envoi = (o.enfant.rapports||[]).find(r =>
      r.type === o.type && r.echeance === o.date && estISO(r.envoyeLe));
    if(envoi){
      o.etat = "envoye";
      o.texte = "envoyé le " + (envoi.envoyeLe.slice(0,4) === String(an)
        ? fmtFR(envoi.envoyeLe).slice(0,5) : fmtFR(envoi.envoyeLe));
    }else if(o.date < auj){
      // avant le début du suivi dans le programme : ni en retard, ni à faire
      if(o.date >= debutSuivi(o.enfant, o.type)){ o.etat = "retard"; o.texte = "en retard"; }
      else{ o.etat = "avant"; o.texte = ""; }
    }else{
      const st = statutEcheance(o.date, DB.parametres.seuilRapportJours);
      o.etat = "avenir";
      o.texte = st.code === "orange" ? st.label.toLowerCase() : "";
      o.proche = st.code === "orange";
    }
  });
  return l.sort((x,y) => x.date.localeCompare(y.date) || parNom(x.enfant, y.enfant));
}

function vueRapports(){
  const auj = aujourdHui();
  const an = new Date().getFullYear() + etat.anneeRapports;
  const liste = rapportsDeLAnnee(an);
  const nb = c => liste.filter(o => o.etat === c).length;

  const ligne = o => {
    const cls = o.etat === "envoye" ? "fait" : o.etat === "avant" ? "avant" : "";
    const statut = o.etat === "envoye" ? '<span class="et vert">' + ech(o.texte) + "</span>"
                 : o.etat === "retard" ? '<span class="et rouge">en retard</span>'
                 : o.proche ? '<span class="et orange">' + ech(o.texte) + "</span>" : "";
    return `<tr class="${cls}">
      <td class="case"><input type="checkbox" data-action="rapport-envoye" data-id="${o.enfant.id}"
        data-type="${o.type}" data-date="${o.date}"${o.etat === "envoye" ? " checked" : ""}
        aria-label="${ech(nomRapport(o.type) + " de " + nomComplet(o.enfant) + " envoyé")}"></td>
      <td class="num">${ech(fmtFR(o.date).slice(0,5))}</td>
      <td class="nom-rapport" title="${ech(o.enfant.service || "")}">${ech(nomComplet(o.enfant))}</td>
      <td class="doux">${o.type}</td>
      <td class="statut">${statut}</td>
    </tr>`;
  };

  const moisCourant = new Date().getFullYear() === an ? new Date().getMonth() : -1;
  const semestre = (de, a) => `<table class="tab-annee">
    <thead><tr><th class="case"><span class="hors-ecran">Envoyé</span></th>
      <th class="num">Date</th><th>Enfant</th><th>Rapport</th><th>État</th></tr></thead>
    ${[...Array(a - de + 1).keys()].map(i => de + i).map(m => {
      const duMois = liste.filter(o => parseISO(o.date).getMonth() === m);
      const nom = MOIS[m].charAt(0).toUpperCase() + MOIS[m].slice(1);
      return `<tbody><tr class="mois-tete${m === moisCourant ? " courant" : ""}">
          <th colspan="5">${ech(nom)}${duMois.length ? '<span class="doux"> · ' + duMois.length + "</span>" : ""}</th></tr>
        ${duMois.length ? duMois.map(ligne).join("")
          : '<tr class="mois-vide"><td colspan="5">Aucun rapport</td></tr>'}</tbody>`;
    }).join("")}
  </table>`;

  /* Les retards de l'année affichée sont déjà en rouge dans le tableau. Ce
     panneau ne montre que ceux d'une autre année, qu'on ne verrait pas sinon. */
  const retards = rapportsEnRetard().filter(o => o.date.slice(0,4) !== String(an));
  const bandeau = retards.length ? `
    <div class="carte">
      <div class="tete"><h2>En retard, hors ${an}</h2><span class="doux">${retards.length}</span></div>
      <ul class="liste">${retards.map(ligneRapport).join("")}</ul>
    </div>` : "";

  const avant = nb("avant");
  const sansDate = DB.enfants.filter(e => !baseRapport(e));

  return bandeau + `
  <div class="carte">
    <div class="barre">
      <div class="filtres" role="group" aria-label="Année">
        <button data-action="annee" data-delta="-1">‹ ${an - 1}</button>
        <button class="actif" data-action="annee" data-delta="0" title="Revenir à l'année en cours">${an}</button>
        <button data-action="annee" data-delta="1">${an + 1} ›</button>
      </div>
      <span class="bilan"><b>${pluriel(liste.length, "rapport")}</b> en ${an} :
        <span class="et vert">${nb("envoye")} envoyé${nb("envoye") > 1 ? "s" : ""}</span>
        · ${nb("retard") ? '<span class="et rouge">' + nb("retard") + " en retard</span>" : "0 en retard"}
        · ${nb("avenir")} à venir${avant ? ' · <span class="doux">' + avant +
          " d'avant le début du suivi</span>" : ""}</span>
      <button class="b pousse" onclick="window.print()">Imprimer</button>
    </div>
    <div class="annee">
      ${semestre(0, 5)}
      ${semestre(6, 11)}
    </div>
    <p class="aide">Cochez la case quand un rapport est envoyé.${avant ? " En gris : les échéances d'avant " +
      "le début du suivi dans le programme, qui ne sont pas réclamées." : ""}</p>
    ${sansDate.length ? '<div class="encadre attention haut-marge"><div class="titre">' +
      pluriel(sansDate.length,"enfant") + " sans date de notification</div><span class=\"pt\">" +
      "Impossible de calculer leurs rapports : " +
      sansDate.map(e => ech(nomComplet(e))).join(", ") + ".</span></div>" : ""}
  </div>`;
}

/* =========================================================================
   12. VUE — Droits de visite
   ========================================================================= */

/* --- Catégorie de l'intervenant : donne sa couleur et son pictogramme --- */
const CATEGORIES = {
  papa:    { label:"Papa",    icone:"personne", classe:"papa"    },
  maman:   { label:"Maman",   icone:"personne", classe:"maman"   },
  fratrie: { label:"Fratrie", icone:"enfants",  classe:"fratrie" },
  autre:   { label:"Autre",   icone:"personne", classe:"autre"   }
};
function categorieParent(v){
  const t = (v.parent || "").toLowerCase();
  if(/papa|p[eè]re/.test(t))                return "papa";
  if(/maman|m[eè]re/.test(t))               return "maman";
  if(/fratrie|fr[eè]re|s(oe|œ)ur/.test(t))  return "fratrie";
  return "autre";
}

/* Un dossier est « à jour » quand l'agenda est couvert au-delà de ce délai. */
const SEUIL_DV_PROCHE = 30;

/** État du dossier de visite d'un enfant : jusqu'à quand son agenda est couvert.
    C'est la rencontre la plus lointaine qui compte — elle dit quand il faudra
    rappeler la famille pour programmer la suite. */
function derniereProgrammee(enf){
  const droits = visitesDe(enf);
  let d = "";
  droits.forEach(({v}) => (v.rencontres||[]).forEach(r => {
    if(estISO(r.date) && r.date > d) d = r.date;
  }));
  const auj = aujourdHui();

  if(d >= auj){
    const n = joursEntre(auj, d);
    return { date:d, jours:n, code: n > SEUIL_DV_PROCHE ? "vert" : "orange",
             texte: n > SEUIL_DV_PROCHE ? "Programmé jusqu'au " + fmtFR(d)
                                        : "Échéance proche — " + fmtFR(d),
             court: n === 0 ? "Aujourd'hui" : n === 1 ? "Demain" : "Dans " + n + " jours" };
  }
  // rien à organiser quand toutes les rencontres se passent sans encadrement
  if(droits.length && droits.every(({v}) => v.sansEncadrement))
    return { date:d, jours:null, code:"vert", texte:"Sans encadrement", court:"Sans encadrement" };
  return { date:d, jours:null, code:"rouge",
           texte: d ? "Aucun DV futur — dernier le " + fmtFR(d) : "Aucun DV programmé",
           court:"Aucun DV futur" };
}

/** Les enfants couverts par un droit de visite : le titulaire et ceux
    avec qui il est regroupé (fratrie placée dans la même famille d'accueil). */
function enfantsDuDroit(e, v){
  const l = [e];
  (v.partageAvec||[]).forEach(id => { const x = enfantParId(id); if(x) l.push(x); });
  return l;
}
/** « THEISMANN Célia + Lucas » quand le nom de famille est commun. */
function libelleDroit(e, v){
  const l = enfantsDuDroit(e, v);
  if(l.length === 1) return nomComplet(e);
  const memeNom = l.every(x => (x.nom||"") === (e.nom||""));
  return memeNom ? (e.nom + " " + l.map(x => x.prenom).join(" + "))
                 : l.map(nomComplet).join(" + ");
}
/** Droits qui concernent un enfant : les siens et ceux qui l'incluent. */
function visitesDe(enf){
  const l = (enf.visites||[]).map(v => ({ e:enf, v }));
  DB.enfants.forEach(e => {
    if(e.id === enf.id) return;
    (e.visites||[]).forEach(v => { if((v.partageAvec||[]).includes(enf.id)) l.push({ e, v }); });
  });
  return l;
}

/* Deux vues, au choix en haut de l'écran : « Par enfant » (la liste et le
   dossier de l'enfant choisi) et « Schéma de récurrence » (les quatre semaines
   du mois, tous enfants confondus). Avant, les deux s'empilaient sur une même
   longue page, avec l'export Word au bout : on passait du dossier d'un enfant
   au planning de tous sans s'en rendre compte. */
function vueVisites(){
  const auj = aujourdHui();
  const q = etat.recherche.trim().toLowerCase();
  const vue = etat.vueDV === "schema" ? "schema" : "enfant";

  const droits = [];
  DB.enfants.slice().sort(parNom).forEach(e => (e.visites||[]).forEach(v => droits.push({ e, v })));
  const avecDroit = DB.enfants.slice().sort(parNom).filter(e => visitesDe(e).length);

  const outils = `<div class="barre">
      ${selecteur("vue-dv", vue, [["enfant","Par enfant"],["schema","Schéma de récurrence"]])}
      <button class="b pousse" data-action="word">Exporter les notes</button>
      <button class="b" onclick="window.print()">Imprimer</button>
      <button class="b primaire" data-action="visite-nouvelle">Nouveau droit de visite</button>
    </div>`;
  if(vue === "schema") return outils + vueSchema(droits);

  /* ------------------------------------------- 1. l'état de chaque dossier */
  const etats = new Map(avecDroit.map(e => [e.id, derniereProgrammee(e)]));
  const nbEtat = c => avecDroit.filter(e => etats.get(e.id).code === c).length;
  const CODES = { rouge:"sans", orange:"proche", vert:"ajour" };
  const fd = etat.filtreDossier;

  /* Compte à part : une rencontre passée dont on n'a pas encore dit si le
     parent est venu. Un dossier peut être à jour côté agenda et avoir malgré
     tout des comptes rendus en attente. */
  const aRemplirDe = e => visitesDe(e).reduce((n, {v}) =>
    n + (v.rencontres||[]).filter(r => aCompleter(r)).length, 0);
  const nbAremplir = avecDroit.filter(e => aRemplirDe(e) > 0).length;

  // les raccourcis d'état, juste au-dessus de la liste qu'ils filtrent
  const filtresDossiers = `<div class="barre">
      ${selecteur("filtre-dossier", fd, [
        ["tout", "Tous", avecDroit.length],
        ["sans", "Sans DV futur", nbEtat("rouge")],
        ["proche", "Échéance proche", nbEtat("orange")],
        ["ajour", "À jour", nbEtat("vert")],
        ["aremplir", "À compléter", nbAremplir]])}
      <input type="search" id="recherche" placeholder="Rechercher un enfant…"
             class="champ-recherche" value="${ech(etat.recherche)}">
    </div>`;

  /* ------------------------------------------- 2. la liste : choisir un enfant */
  const visibles = avecDroit.filter(e =>
    (!q || nomComplet(e).toLowerCase().includes(q)) &&
    (fd === "tout" || (fd === "aremplir" ? aRemplirDe(e) > 0
                                         : CODES[etats.get(e.id).code] === fd)));
  // pas d'écriture dans « etat » ici : une recherche qui masque l'enfant choisi
  // en montre un autre, et le retrouve dès que la recherche est effacée.
  const choisi = visibles.find(e => e.id === etat.enfantVisite) || visibles[0] || null;

  const ligneEnfant = e => {
    const p = etats.get(e.id);
    const freq = visitesDe(e).map(({v}) => v.frequence).filter(Boolean).join(" · ");
    const n = aRemplirDe(e);
    const date = p.code === "rouge" ? '<span class="et rouge">Aucun DV futur</span>'
               : !p.date ? ech(p.court)
               : p.code === "orange" ? '<span class="et orange">' + ech(fmtFR(p.date)) + "</span>"
               : ech(fmtFR(p.date));
    const dessous = n ? '<span class="et orange">' + n + " à compléter</span>"
                  : p.code === "rouge" ? (p.date ? "dernier le " + ech(fmtFR(p.date)) : "")
                  : p.jours != null ? ech(p.court.toLowerCase()) : "";
    return `<tr class="le${choisi && e.id === choisi.id ? " actif" : ""}"
        data-action="choisir-enfant" data-id="${e.id}" tabindex="0">
      <td><span class="nom-enfant deux-lignes">${ech(nomComplet(e))}</span>
        <span class="pt doux deux-lignes" title="${ech(freq)}">${ech(freq || "fréquence à préciser")}</span></td>
      <td class="num"><span class="deux-lignes">${date}</span>
        <span class="pt doux deux-lignes">${dessous}</span></td>
    </tr>`;
  };

  const carteListe = `
    <div class="carte dv-liste">
      ${visibles.length ? `<table class="tab-enfants">
          <thead><tr><th>Enfant</th><th class="num">Programmé jusqu'au</th></tr></thead>
          <tbody>${visibles.map(ligneEnfant).join("")}</tbody></table>`
        : '<p class="rien">' + (q || fd !== "tout" ? "Aucun enfant dans cette sélection."
                                                   : "Aucun droit de visite encodé.") + "</p>"}
    </div>`;

  /* ------------------------------------------------------ 3. le dossier choisi */
  const delai = iso => {
    const n = joursEntre(auj, iso);
    return n <= 0 ? "aujourd'hui" : n === 1 ? "demain" : "dans " + n + " jours";
  };

  const f = etat.filtreVisite;
  const garde = r =>
    (f !== "avenir"    || (estISO(r.date) && r.date >= auj)) &&
    (f !== "completer" || aCompleter(r)) &&
    (f !== "venu"      || r.presence === "venu") &&
    (f !== "absent"    || r.presence === "absent");

  let carteDetail;
  if(!choisi){
    carteDetail = '<div class="carte"><p class="vide">Choisissez un enfant dans la liste.</p></div>';
  }else{
    const e = choisi;
    const p = derniereProgrammee(e);
    const mesDroits = visitesDe(e);

    const rencontres = [];
    mesDroits.forEach(({e:o, v}) => (v.rencontres||[]).forEach(r => rencontres.push({ o, v, r })));
    const prochaine = rencontres
      .filter(x => estISO(x.r.date) && x.r.date >= auj)
      .sort((a,b) => a.r.date.localeCompare(b.r.date) ||
                     String(a.r.debut||"").localeCompare(String(b.r.debut||"")))[0];

    const freq = mesDroits.map(({v}) => v.frequence).filter(Boolean).join(" · ");
    const avecQui = [...new Set(mesDroits.map(({v}) => libelleParent(v)))].join(" / ");
    const dernierRealise = rencontres
      .filter(x => x.r.presence === "venu" && estISO(x.r.date) && x.r.date <= auj)
      .map(x => x.r.date).sort().pop();

    /* Le bandeau de faits : ce qu'on veut savoir sans avoir à chercher. */
    const fait = (l, v, s) =>
      '<div class="fait"><span class="l">' + ech(l) + '</span><span class="v">' + v + "</span>" +
      (s ? '<span class="s">' + s + "</span>" : "") + "</div>";
    const bandeauFaits = '<div class="faits">' +
      fait("Avec qui", ech(avecQui || "à préciser")) +
      fait("Fréquence", ech(freq || "à préciser")) +
      fait("Dernier DV réalisé", dernierRealise ? ech(fmtFR(dernierRealise)) : '<span class="doux">aucun</span>') +
      fait("Prochain DV", prochaine ? ech(fmtFR(prochaine.r.date)) : '<span class="et rouge">aucun</span>',
           prochaine ? ech(delai(prochaine.r.date)) : "") +
      fait("Programmé jusqu'au",
           p.code === "rouge" ? '<span class="et rouge">rien de programmé</span>'
           : p.code === "orange" ? '<span class="et orange">' + ech(fmtFR(p.date)) + "</span>"
           : ech(p.date ? fmtFR(p.date) : p.court),
           p.code === "orange" ? "échéance proche" : "") +
      "</div>";

    /* Chaque droit de visite : intervenant, fréquence, créneaux du mois. */
    const menuDroit = (o, v) => '<details class="plus"><summary aria-label="Actions sur ce droit de visite" ' +
      'title="Autres actions">⋯</summary><div class="menu">' +
      '<button class="b mini" data-action="visite-modifier" data-id="' + o.id + '" data-vid="' + v.id +
      '">Modifier ce droit de visite</button>' +
      '<button class="b mini danger" data-action="visite-supprimer" data-id="' + o.id + '" data-vid="' + v.id +
      '">Supprimer ce droit de visite</button></div></details>';
    const lignesDroits = '<table class="tab-droits"><tbody>' + mesDroits.map(({e:o, v}) => {
      const cat = categorieParent(v);
      const cr = (v.creneaux||[]).map(c =>
        "semaine " + c.semaine + ", " + (c.debut || "?") + "–" + (c.fin || "?")).join(" ; ");
      const notes = [v.sansEncadrement ? "sans encadrement" : "",
        (v.partageAvec||[]).length ? "regroupé : " + libelleDroit(o, v) : ""].filter(Boolean).join(" · ");
      return `<tr>
        <td class="nowrap"><span class="puce ${CATEGORIES[cat].classe}"></span>${ech(libelleParent(v))}</td>
        <td>${ech(v.frequence || "fréquence à préciser")}</td>
        <td class="doux">${ech(cr || "aucun créneau encodé")}${notes ? "<br>" + ech(notes) : ""}</td>
        <td class="droite">${menuDroit(o, v)}</td>
      </tr>`;
    }).join("") + "</tbody></table>";

    /* --- les rencontres : une ligne du temps, de la plus lointaine à venir à
       la plus ancienne, coupée par un repère « Aujourd'hui ». Avant, les
       rencontres à venir étaient rangées dans l'autre sens au-dessus des
       passées : on lisait 14/11, 14/12, 14/01 puis 14/10, 14/09, sans savoir
       où l'on était. */
    const compte = {
      tout:      rencontres.length,
      avenir:    rencontres.filter(x => estISO(x.r.date) && x.r.date >= auj).length,
      completer: rencontres.filter(x => aCompleter(x.r)).length,
      venu:      rencontres.filter(x => x.r.presence === "venu").length,
      absent:    rencontres.filter(x => x.r.presence === "absent").length
    };
    const desc = (a,b) => String(b.r.date||"").localeCompare(String(a.r.date||"")) ||
                          String(b.r.debut||"").localeCompare(String(a.r.debut||""));
    const choisies = rencontres.filter(x => garde(x.r));
    const apres  = choisies.filter(x => estISO(x.r.date) && x.r.date > auj).sort(desc);
    const avant  = choisies.filter(x => !(estISO(x.r.date) && x.r.date > auj)).sort(desc);
    // tout ce qui est à venir reste affiché ; du passé, les dix plus récentes
    const deplie = !!etat.ouvertes[e.id];
    const avantVues = deplie ? avant : avant.slice(0, 10);

    const menuRencontre = x => '<details class="plus"><summary aria-label="Actions sur la rencontre du ' +
      ech(fmtFR(x.r.date)) + '" title="Autres actions">⋯</summary><div class="menu">' +
      '<button class="b mini" data-action="rencontre-modifier" data-id="' + x.o.id + '" data-vid="' +
      x.v.id + '" data-rid="' + x.r.id + '">Modifier la rencontre</button>' +
      '<button class="b mini danger" data-action="rencontre-supprimer" data-id="' + x.o.id +
      '" data-vid="' + x.v.id + '" data-rid="' + x.r.id + '">Supprimer la rencontre</button></div></details>';

    const ligne = x => {
      const futur = estISO(x.r.date) && x.r.date > auj;
      const sous = futur ? '<span class="doux">' + ech(delai(x.r.date)) + "</span>"
                 : aCompleter(x.r) ? '<span class="et orange">à compléter</span>' : "";
      // une rencontre à venir n'a pas encore de présence à noter
      const presence = futur ? '<span class="doux">prévue</span>' : `<div class="bascule">
          <button class="oui ${x.r.presence === "venu" ? "actif" : ""}" data-action="presence" data-p="venu"
                  data-id="${x.o.id}" data-vid="${x.v.id}" data-rid="${x.r.id}"
                  aria-pressed="${x.r.presence === "venu"}">Présent</button>
          <button class="non ${x.r.presence === "absent" ? "actif" : ""}" data-action="presence" data-p="absent"
                  data-id="${x.o.id}" data-vid="${x.v.id}" data-rid="${x.r.id}"
                  aria-pressed="${x.r.presence === "absent"}">Absent</button></div>`;
      return `<tr class="${futur ? "a-venir" : ""}">
        <td class="num nowrap">${ech(fmtFR(x.r.date))}${sous ? "<br>" + sous : ""}</td>
        <td>${ech(libelleParent(x.v))}${(x.v.partageAvec||[]).length
          ? '<br><span class="doux pt">avec ' + ech(libelleDroit(x.o, x.v)) + "</span>" : ""}</td>
        <td class="num nowrap">${ech(heuresDe(x.r) || "—")}</td>
        <td class="centre">${presence}</td>
        <td class="col-note"><div class="note-vive" data-note="1"
            data-id="${x.o.id}" data-vid="${x.v.id}" data-rid="${x.r.id}" tabindex="0"
            title="Cliquez ou tabulez pour écrire">${x.r.note ? ech(x.r.note)
              : futur ? "" : '<span class="doux">Note de synthèse…</span>'}</div></td>
        <td class="droite">${menuRencontre(x)}</td>
      </tr>`;
    };

    // le repère du jour, dans la liste complète ; il dit aussi quand rien
    // n'est programmé après aujourd'hui
    const repere = f === "tout" || f === "avenir"
      ? `<tr class="repere-jour"><td colspan="6">Aujourd'hui, ${ech(fmtLong(auj).replace(/^./, c => c.toLowerCase()))}${
          !apres.length ? ' — <span class="et rouge">aucune rencontre programmée après aujourd\'hui</span>' : ""}</td></tr>`
      : "";

    const suivi = choisies.length || repere ? `<div class="tableau-enveloppe"><table class="tab-suivi">
        <thead><tr><th class="num">Date</th><th>Avec</th><th class="num">Horaire</th>
          <th class="centre">Présence</th><th class="col-note">Note de synthèse</th>
          <th><span class="hors-ecran">Actions</span></th></tr></thead>
        <tbody>${apres.map(ligne).join("")}${repere}${avantVues.map(ligne).join("")}</tbody></table></div>
        ${avant.length > 10 ? '<button class="b haut-marge" data-action="deplier" data-id="' + e.id + '">' +
          (deplie ? "Ne montrer que les dix dernières" : "Afficher les " + (avant.length - 10) +
          " rencontres plus anciennes") + "</button>" : ""}`
      : '<p class="rien">Aucune rencontre' + (f === "tout" ? " encodée pour cet enfant." : " pour ce filtre.") + "</p>";

    carteDetail = `
      <div class="carte">
        <div class="tete dv-tete">
          <h2>${ech(nomComplet(e))}</h2>
          <span class="doux">${ech([e.service, age(e.naissance) != null ? ageTexte(e) : ""].filter(Boolean).join(" · "))}</span>
          <button class="b mini pousse" data-action="rencontre-enfant" data-id="${e.id}">Nouvelle rencontre</button>
          <button class="b mini" data-action="rencontres-enfant" data-id="${e.id}">Plusieurs dates</button>
          <details class="plus"><summary aria-label="Autres actions pour ${ech(nomComplet(e))}"
            title="Autres actions">⋯</summary><div class="menu">
            <button class="b mini" data-action="enfant-modifier" data-id="${e.id}">Modifier la fiche</button>
            <button class="b mini" data-action="visite-nouvelle" data-id="${e.id}">Ajouter un droit de visite</button>
          </div></details>
        </div>
        ${bandeauFaits}
        <h3 class="titre-section">Droits de visite</h3>
        ${lignesDroits}
        <div class="tete-section"><h3 class="titre-section">Rencontres</h3>
          ${selecteur("filtre-visite", f, [
            ["tout", "Toutes", compte.tout], ["avenir", "À venir", compte.avenir],
            ["completer", "À compléter", compte.completer],
            ["venu", "Honorées", compte.venu], ["absent", "Manquées", compte.absent]])}
        </div>
        ${suivi}
      </div>`;
  }

  return outils + filtresDossiers + `
  <div class="grille dv">
    ${carteListe}
    ${carteDetail}
  </div>`;
}

/* Les quatre semaines du mois côte à côte, tous enfants confondus, et une
   cinquième colonne pour les droits dont les créneaux ne sont pas encodés.
   Un nom ouvre le dossier de l'enfant. */
function vueSchema(droits){
  const semaines = [1,2,3,4].map(n => {
    const items = [];
    droits.forEach(({e,v}) => (v.creneaux||[]).forEach(c => {
      if(c.semaine === n) items.push({ e, v, c });
    }));
    items.sort((a,b) => String(a.c.debut||"").localeCompare(String(b.c.debut||"")));
    return { n, items };
  });
  const sansSchema = droits.filter(({v}) => !(v.creneaux||[]).length);

  const entree = ({e, v, c}) => {
    const cat = categorieParent(v);
    return `<li>
      <span class="sch-h">${ech((c.debut || "?") + "–" + (c.fin || "?"))}</span>
      <button class="lien-nom" data-action="choisir-enfant" data-id="${e.id}">${ech(libelleDroit(e, v))}</button>
      <span class="pt doux"><span class="puce ${CATEGORIES[cat].classe}"></span>${ech(libelleParent(v))}</span>
    </li>`;
  };
  const colonnes = semaines.map(({n, items}) => `<section class="sem">
      <h3>Semaine ${n}</h3>
      ${items.length ? '<ul class="sch">' + items.map(entree).join("") + "</ul>"
                     : '<p class="rien">—</p>'}
    </section>`).join("") +
    `<section class="sem hors">
      <h3>Hors semaine</h3>
      ${sansSchema.length ? '<ul class="sch">' + sansSchema.map(({e,v}) =>
          '<li><button class="lien-nom" data-action="choisir-enfant" data-id="' + e.id + '">' +
          ech(libelleDroit(e, v)) + "</button></li>").join("") + "</ul>" +
          '<p class="aide">Selon un calendrier spécifique : les créneaux ne sont pas encodés.</p>'
        : '<p class="rien">—</p>'}
    </section>`;

  return `<div class="carte">
    <div class="schema">${colonnes}</div>
    <p class="aide">${["papa","maman","fratrie","autre"].map(k =>

/** Programmer plusieurs rencontres d'un coup, à la main ou par répétition. */
function formRencontresMultiples(e, v){
  const heures = (v && (v.creneaux || [])[0]) || { debut:"", fin:"" };

  const ligne = i => `<tr>
      <td style="padding:4px 8px 4px 0;color:var(--doux);font-size:12.5px">${i+1}.</td>
      <td style="padding:4px 6px 4px 0"><input type="date" name="dt${i}"></td>
      <td style="padding:4px 6px"><input type="time" name="db${i}" value="${ech(heures.debut)}"></td>
      <td style="padding:4px 0"><input type="time" name="fn${i}" value="${ech(heures.fin)}"></td>
    </tr>`;

  const choix = (e && v) ? '<p class="pt doux" style="margin-top:0">' + ech(nomComplet(e)) +
      " — rencontres avec <b>" + ech(libelleParent(v)) + "</b></p>"
    : `<label class="champ"><span>Droit de visite concerné</span>
        <select name="cible"><option value="">— choisir —</option>${
          DB.enfants.slice().sort(parNom).map(x => (x.visites||[]).map(w =>
            '<option value="' + x.id + "|" + w.id + '">' + ech(libelleDroit(x, w)) + " — " +
            ech(libelleParent(w)) + "</option>").join("")).join("")}</select></label>`;

  const corps = choix + `
    <div class="encadre">
      <div class="titre">Remplissage rapide</div>
      <div class="ligne c3" style="margin-top:8px">
        <label class="champ" style="margin:0"><span>Première rencontre</span>
          <input type="date" name="depart" value="${ech(aujourdHui())}"></label>
        <label class="champ" style="margin:0"><span>Puis</span>
          <select name="rythme">
            <option value="7">toutes les semaines</option>
            <option value="14">toutes les 2 semaines</option>
            <option value="mois" selected>tous les mois</option>
            <option value="0">même jour, à ajuster</option>
          </select></label>
        <label class="champ" style="margin:0"><span>Combien</span>
          <select name="combien">${[2,3,4,5,6,8,10,12].map(n =>
            '<option value="' + n + '"' + (n === 6 ? " selected" : "") + ">" + n +
            " rencontres</option>").join("")}</select></label>
      </div>
      <button type="button" class="b" id="btn-remplir" style="margin-top:10px">Remplir le tableau</button>
      <p class="aide">Les dates proposées sont modifiables une par une juste en dessous.</p>
    </div>

    <label class="champ"><span>Dates des rencontres</span>
      <table style="width:100%"><thead><tr>
        <th></th><th style="font-size:11px">Date</th><th style="font-size:11px">Début</th>
        <th style="font-size:11px">Fin</th></tr></thead>
        <tbody id="corps-dates">${[0,1,2,3,4,5].map(ligne).join("")}</tbody></table>
      <button type="button" class="b mini" id="btn-lignes" style="margin-top:8px">+ 3 lignes</button>
      <p class="aide">Les lignes laissées vides sont ignorées. Toutes les rencontres sont créées
        en « prévue » : vous cocherez Présent ou Absent après coup.</p></label>`;

  ouvrirModale("Programmer plusieurs rencontres", corps, f => {
    let cibleE = e, cibleV = v;
    if(!cibleE || !cibleV){
      const [ie, iv] = String(val(f,"cible")).split("|");
      cibleE = enfantParId(ie);
      cibleV = cibleE && (cibleE.visites||[]).find(x => x.id === iv);
      if(!cibleV){ alert("Choisissez le droit de visite concerné."); return false; }
    }
    const liste = enfantParId(cibleE.id).visites.find(x => x.id === cibleV.id);
    let n = 0;
    for(let i = 0; f.elements["dt"+i]; i++){
      const d = val(f,"dt"+i);
      if(!estISO(d)) continue;
      liste.rencontres.push({ id:uid(), date:d, debut:val(f,"db"+i), fin:val(f,"fn"+i),
                              presence:"prevue", note:"" });
      n++;
    }
    if(!n){ alert("Aucune date encodée."); return false; }
    maj();
    alert(n === 1 ? "1 rencontre programmée." : n + " rencontres programmées.");
  }, 640);

  /* --- ajout de lignes sans perdre la saisie déjà faite --- */
  const form = document.getElementById("form-modale");

  /* Dans le bloc de remplissage rapide, Entrée remplit le tableau : c'est ce
     qu'on attend après avoir tapé la date de départ. */
  // en capture : passe avant la navigation champ à champ de la modale
  form.addEventListener("keydown", ev => {
    if(ev.key === "Enter" && ev.target.closest && ev.target.closest(".encadre")){
      ev.preventDefault();
      document.getElementById("btn-remplir").click();
    }
  }, true);
  document.getElementById("btn-lignes").addEventListener("click", () => {
    const tb = document.getElementById("corps-dates");
    for(let k = 0; k < 3; k++) tb.insertAdjacentHTML("beforeend", ligne(tb.children.length));
  });

  /* --- remplissage automatique du tableau --- */
  document.getElementById("btn-remplir").addEventListener("click", () => {
    const depart = val(form,"depart");
    if(!estISO(depart)){ alert("Indiquez la date de la première rencontre."); return; }
    const rythme = val(form,"rythme");
    const combien = Number(val(form,"combien")) || 6;
    const tb = document.getElementById("corps-dates");
    while(tb.children.length < combien) tb.insertAdjacentHTML("beforeend", ligne(tb.children.length));
    // Chaque date est comptée depuis la première, pas depuis la précédente :
    // une série mensuelle partie du 31 retombait au 28 après février, et y
    // restait (31/01, 28/02, 28/03, 28/04…).
    for(let i = 0; i < combien; i++){
      form.elements["dt"+i].value =
        rythme === "mois" ? decalerMois(depart, i) :
        rythme === "0"    ? depart : decalerJours(depart, i * Number(rythme));
    }
  });
}

let soumission = null, annulation = null;

function ouvrirModale(titre, corps, onValider, largeur, onAnnuler){
  soumission = onValider;
  annulation = onAnnuler || null;
  document.getElementById("zone-modale").innerHTML = `
    <div class="voile" data-fermer="1">
      <form class="modale" id="form-modale" ${largeur ? 'style="max-width:'+largeur+'px"' : ""}>
        <header><h2>${ech(titre)}</h2></header>
        <div class="corps">${corps}</div>
        <div class="pied">
          <button type="button" class="b" data-fermer="1">Annuler</button>
          <button type="submit" class="b primaire">Enregistrer</button>
        </div>
      </form>
    </div>`;
  const f = document.getElementById("form-modale");
  f.addEventListener("submit", ev => {
    ev.preventDefault();
    if(!datesValides(f)) return;
    if(soumission && soumission(f) !== false){ annulation = null; fermerModale(); }
  });
  clavierLineaire(f);
  datesSaines(f);
  const prem = f.querySelector("input,select,textarea");
  if(prem) prem.focus();
}

/** Année tapée sur deux chiffres. Dans un champ date, « 26 » donne l'année
    0026 : la date s'affichait 15/10/0026, mais les calculs la lisaient comme
    1926 — une notification « dépassée depuis 36 525 jours ». On complète en
    2026 quand on quitte le champ, et pas pendant la frappe : le « 2 » de
    « 2026 » vaut déjà 0002 à ce moment-là. */
const anneeComplete = v => /^00\d{2}-\d{2}-\d{2}$/.test(v) ? "20" + v.slice(2) : v;
function datesSaines(form){
  // un message d'erreur posé à l'enregistrement s'efface dès qu'on corrige,
  // sinon le navigateur bloquerait l'envoi suivant avant même de revérifier
  form.addEventListener("input", ev => {
    if(ev.target.type === "date") ev.target.setCustomValidity("");
  });
  form.addEventListener("focusout", ev => {
    const c = ev.target;
    if(c.type !== "date" || !c.value) return;
    const v = anneeComplete(c.value);
    if(v !== c.value) c.value = v;
  });
}
/** Au moment d'enregistrer : une année hors de 1900–2099 ne peut être
    qu'une faute de frappe (« 202 » pour 2026). On le dit sur le champ
    plutôt que d'enregistrer une date absurde. */
function datesValides(form){
  for(const c of form.querySelectorAll('input[type="date"]')){
    c.value = anneeComplete(c.value);
    const a = c.value ? Number(c.value.slice(0, 4)) : 0;
    c.setCustomValidity(c.value && (a < 1900 || a > 2099)
      ? "L'année " + a + " semble être une faute de frappe : vérifiez la date." : "");
    if(!c.checkValidity()){ c.focus(); c.reportValidity(); return false; }
  }
  return true;
}

/** Une tabulation = un champ.
    Les champs « date » et « heure » sont découpés en segments — jour, mois,
    année, heures, minutes — et chaque segment avale une tabulation : en
    saisie enchaînée, on a l'impression que la touche ne répond pas. Entrée,
    de son côté, validait le formulaire au beau milieu de la saisie.
    Les deux touches passent maintenant au champ suivant ; les segments
    restent accessibles aux flèches, comme d'habitude. */
function clavierLineaire(form){
  form.addEventListener("keydown", ev => {
    if(ev.defaultPrevented) return;
    if(ev.key !== "Tab" && ev.key !== "Enter") return;
    const c = ev.target;
    if(!c || !/^(INPUT|SELECT|TEXTAREA)$/.test(c.tagName)) return;
    if(c.tagName === "TEXTAREA" && ev.key === "Enter") return;      // saut de ligne
    if(c.type === "radio" || c.type === "checkbox") return;         // flèches / espace

    const champs = [...form.querySelectorAll("input, select, textarea")]
      .filter(n => !n.disabled && n.type !== "hidden" && n.type !== "radio");
    const i = champs.indexOf(c);
    if(i < 0) return;
    const suivant = champs[i + (ev.shiftKey ? -1 : 1)];
    if(!suivant) return;   // dernier champ : on laisse le navigateur faire
    ev.preventDefault();
    suivant.focus();
    if(/^(text|search|number)$/.test(suivant.type)) suivant.select();
  });
}
function fermerModale(){
  const retour = annulation;
  soumission = null; annulation = null;
  document.getElementById("zone-modale").innerHTML = "";
  if(retour) retour();
}

const coche = (f,n) => { const e = f.elements[n]; return !!(e && e.checked); };

   ========================================================================= */

const TABLE_CRC = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < u8.length; i++) c = TABLE_CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
/** Archive ZIP sans compression — suffisant et lisible par Word. */
function zipCreer(entrees){
  const enc = new TextEncoder();
  const morceaux = [], central = [];
  let position = 0;
  entrees.forEach(e => {
    const nom = enc.encode(e.nom);
    const data = e.contenu;
    const crc = crc32(data);
    const entete = new Uint8Array(30 + nom.length);
    const v = new DataView(entete.buffer);
    v.setUint32(0, 0x04034b50, true); v.setUint16(4, 20, true); v.setUint16(6, 0, true);
    v.setUint16(8, 0, true); v.setUint16(10, 0, true); v.setUint16(12, 0x21, true);
    v.setUint32(14, crc, true); v.setUint32(18, data.length, true); v.setUint32(22, data.length, true);
    v.setUint16(26, nom.length, true); v.setUint16(28, 0, true);
    entete.set(nom, 30);

    const fiche = new Uint8Array(46 + nom.length);
    const c = new DataView(fiche.buffer);
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true);
    c.setUint16(8, 0, true); c.setUint16(10, 0, true); c.setUint16(12, 0, true); c.setUint16(14, 0x21, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
    c.setUint16(28, nom.length, true); c.setUint32(42, position, true);
    fiche.set(nom, 46);

    morceaux.push(entete, data); central.push(fiche);
    position += entete.length + data.length;
  });
  const tailleCentral = central.reduce((s,x) => s + x.length, 0);
  const fin = new Uint8Array(22);
  const f = new DataView(fin.buffer);
  f.setUint32(0, 0x06054b50, true);
  f.setUint16(8, entrees.length, true); f.setUint16(10, entrees.length, true);
  f.setUint32(12, tailleCentral, true); f.setUint32(16, position, true);

  const total = morceaux.concat(central, [fin]);
  const taille = total.reduce((s,x) => s + x.length, 0);
  const sortie = new Uint8Array(taille);
  let o = 0;
  total.forEach(x => { sortie.set(x, o); o += x.length; });
  return sortie;
}

const xml = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&apos;")
  .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");   // caractères de contrôle interdits en XML

/** Un paragraphe Word ; le texte est coupé aux retours à la ligne. */
function par(texte, opts){
  const o = opts || {};
  const taille = o.taille || 22;                       // demi-points
  const rpr = "<w:rPr>" + (o.gras ? "<w:b/>" : "") + (o.italique ? "<w:i/>" : "") +
              '<w:sz w:val="' + taille + '"/><w:szCs w:val="' + taille + '"/>' +
              (o.couleur ? '<w:color w:val="' + o.couleur + '"/>' : "") + "</w:rPr>";
  const lignes = String(texte == null ? "" : texte).split(/\r?\n/);
  const runs = lignes.map((l,i) =>
    "<w:r>" + rpr + (i ? "<w:br/>" : "") + '<w:t xml:space="preserve">' + xml(l) + "</w:t></w:r>").join("");
  const ppr = "<w:pPr>" +
    '<w:spacing w:before="' + (o.avant || 0) + '" w:after="' + (o.apres == null ? 100 : o.apres) + '"/>' +
    (o.bordure ? '<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="2" w:color="AAAAAA"/></w:pBdr>' : "") +
    (o.retrait ? '<w:ind w:left="' + o.retrait + '"/>' : "") + "</w:pPr>";
  return "<w:p>" + ppr + runs + "</w:p>";
}

function docxCreer(corpsXml, titre){

/** Construit le document des notes de visite. */
function docxVisites(enfants, du, au, toutInclure){
  const dans = d => (!du || d >= du) && (!au || d <= au);
  if(!toutInclure){
    enfants = enfants.filter(e =>
      visitesDe(e).some(({v}) => (v.rencontres||[]).some(r => dans(r.date))));
  }
  let corps = "";
  corps += par("Notes de visites", { gras:true, taille:34, apres:40 });
  corps += par("Document généré le " + fmtLong(aujourdHui()) +
               (du || au ? " — période du " + (du ? fmtFR(du) : "début") + " au " + (au ? fmtFR(au) : "aujourd'hui") : ""),
               { italique:true, taille:18, couleur:"666666", apres:220, bordure:true });

  let total = 0;
  enfants.slice().sort(parNom).forEach(e => {
    const visites = visitesDe(e).map(x => x.v)
      .filter(v => (v.rencontres||[]).some(r => dans(r.date)));
    corps += par(nomComplet(e) + (e.service ? "  —  " + e.service : ""),
                 { gras:true, taille:28, avant:240, apres:60, bordure:true });
    if(!visites.length){
      corps += par("Aucune rencontre encodée sur la période.", { italique:true, taille:20, couleur:"666666" });
      return;
    }
    visites.forEach(v => {
      const renc = (v.rencontres||[]).filter(r => dans(r.date))
        .sort((a,b) => String(a.date).localeCompare(String(b.date)));
      const venus = renc.filter(r => r.presence === "venu").length;
      const absents = renc.filter(r => r.presence === "absent").length;
      const annulees = renc.filter(r => r.presence === "annulee").length;
      corps += par("Rencontres avec " + libelleParent(v) +
                   (v.frequence ? "  (" + v.frequence + ")" : ""),
                   { gras:true, taille:24, avant:160, apres:40 });
      corps += par(pluriel(renc.length,"rencontre") + " : " + venus + " honorée(s), " +
                   absents + " manquée(s)" + (annulees ? ", " + annulees + " annulée(s)" : "") +
                   "",
                   { italique:true, taille:19, couleur:"666666", apres:80 });
      renc.forEach(r => {
        total++;
        corps += par(fmtLong(r.date) + "  —  " + presenceDe(r).label,
                     { gras:true, taille:20, avant:80, apres:20 });
        corps += par(r.note || "(pas de note)", { taille:21, retrait:283, apres:60 });
      });
    });
  });
  if(!total) corps += par("Aucune rencontre ne correspond à la période choisie.",
                          { italique:true, couleur:"666666" });
  return docxCreer(corps, "Notes de visites" +
    (enfants.length === 1 ? " — " + nomComplet(enfants[0]) : ""));
}

function telecharger(nom, contenu, type, description){
  if(NATIF){
    window.programme.enregistrerSous(nom, contenu, description).then(r => {
      if(r && r.erreur) alert("Enregistrement impossible : " + r.erreur);
    });
    return;
  }
  const blob = new Blob([contenu], { type: type || "application/json;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/** Applique une sauvegarde relue depuis un fichier. */
function appliquerImport(texte){
  try{
    const d = JSON.parse(texte);
    if(!d || !Array.isArray(d.enfants)) throw new Error("fichier non reconnu");
    if(!confirm("Remplacer toutes les données actuelles par celles du fichier ?")) return;
    DB = normaliser(d);
    maj();
    alert("Sauvegarde restaurée." + (FS.dossier ? " Le fichier de travail a été mis à jour." : ""));
  }catch(e){ alert("Fichier illisible : " + e.message); }
}
function importerSauvegarde(){
  if(NATIF){
    window.programme.choisirFichier().then(r => { if(r && r.ok) appliquerImport(r.contenu); });
    return;
  }
  document.getElementById("fichier-import").click();
}
function csv(lignes){
  const e = v => '"' + String(v == null ? "" : v).replace(/"/g,'""') + '"';
  // ﻿ = marque d'ordre d'octets : Excel reconnait alors l'UTF-8 (accents corrects)
  return "﻿" + lignes.map(l => l.map(e).join(";")).join("\r\n");
}
const dt = s => estISO(s) ? fmtFR(s) : "";

function exportCsvEnfants(){
  const l = [["Prénom","Nom","Autorité","Naissance","Formalisation","Statut notification","Relances",
              "Rapport semestriel","Rapport annuel","Droits de visite","Notes"]];
  DB.enfants.slice().sort(parNom).forEach(e => l.push([
    e.prenom, e.nom, e.service, dt(e.naissance), dt(e.notifFin), statutNotif(e).titre,
    (e.relances||[]).map(fmtFR).join(" / "),
    dt(echeanceRapport(e,"semestriel")), dt(echeanceRapport(e,"annuel")),
    visitesDe(e).map(({v}) => libelleParent(v) + (v.frequence ? " : " + v.frequence : "")).join(" / "),
    e.notes]));
  telecharger("dossiers-" + aujourdHui() + ".csv", csv(l), "text/csv;charset=utf-8", "Tableur CSV");
}

/* --- Note de rencontre : le texte devient une zone de saisie au clic, et
       redevient du texte une fois quittée. Cela évite de créer des centaines
       de zones de saisie en même temps, qui ralentissaient beaucoup l'écran. --- */
function ouvrirNote(zone){
  const d = zone.dataset;
  const e = enfantParId(d.id);
  const v = e && (e.visites||[]).find(x => x.id === d.vid);
  const r = v && (v.rencontres||[]).find(x => x.id === d.rid);
  if(!r) return;

  const champ = document.createElement("textarea");
  champ.className = "note-vive";
  champ.value = r.note || "";
  champ.rows = 3;
  champ.placeholder = "Note de synthèse…";
  zone.replaceWith(champ);
  champ.focus();

  const terminer = () => {
    champ.removeEventListener("blur", terminer);
    const change = (r.note || "") !== champ.value;
    if(change){ r.note = champ.value; DB.initial = false; sauver(); }
    zone.innerHTML = r.note ? ech(r.note) : '<span class="doux">Note de synthèse…</span>';
    champ.replaceWith(zone);
    if(change) rendreBientot();
  };
  champ.addEventListener("blur", terminer);
  champ.addEventListener("keydown", ev => {
    if(ev.key === "Escape"){ ev.stopPropagation(); champ.value = r.note || ""; champ.blur(); }
  });
}

function actionner(b){
  const id = b.dataset.id, vid = b.dataset.vid, rid = b.dataset.rid;
  const e = id ? enfantParId(id) : null;
  const v = (e && vid) ? (e.visites||[]).find(x => x.id === vid) : null;

  switch(b.dataset.action){
    /* --- enfants --- */
    case "enfant-nouveau":  formEnfant(null); break;
    case "enfant-modifier": formEnfant(e); break;
    case "enfant-supprimer":
      if(confirm("Supprimer définitivement le dossier de " + nomComplet(e) +
                 ", ses rencontres et ses notes ?")){
        DB.enfants = DB.enfants.filter(x => x.id !== id);
        DB.enfants.forEach(x => (x.visites||[]).forEach(v => {
          v.partageAvec = (v.partageAvec||[]).filter(i => i !== id);
        }));
        DB.taches.forEach(t => { if(t.enfantId === id) t.enfantId = ""; });
        maj();
      }
      break;

    /* --- notification --- */
    case "notif-recue":   formNotifRecue(e); break;
    case "notif-attente": e.notifRecue = false; maj(); break;
    case "relance": {
      const auj = aujourdHui();
      e.relances = e.relances || [];
      if(e.relances.includes(auj)){ alert("Une relance est déjà notée pour aujourd'hui."); break; }
      e.relances.push(auj); e.relances.sort();
      maj();
      break;
    }
    case "filtre-notif":
      etat.filtreNotif = (etat.filtreNotif === b.dataset.f) ? "tout" : b.dataset.f;
      rendre();
      break;
    case "tache-notif":
      ajouterTache("Réclamer la notification de prise en charge — " + nomComplet(e), id);
      etat.tachesToutes = true;
      allerA("accueil");
      break;

    /* --- rapports --- */
    case "rapport-envoye": {
      const type = b.dataset.type, date = b.dataset.date;
      e.rapports = e.rapports || [];
      const existe = e.rapports.find(r => r.type === type && r.echeance === date);
      if(existe) e.rapports = e.rapports.filter(r => r !== existe);
      else e.rapports.push({ id:uid(), type, echeance:date, envoyeLe:aujourdHui() });
      maj();
      break;
    }
    case "annee":
      etat.anneeRapports = b.dataset.delta === "0" ? 0 : etat.anneeRapports + Number(b.dataset.delta);
      rendre();
      break;

    /* --- droits de visite --- */
    case "visite-nouvelle":  formVisite(e, null); break;
    case "visite-modifier":  formVisite(e, v); break;
    case "visite-supprimer":
      if(confirm("Supprimer le droit de visite « " + libelleParent(v) + " » de " + nomComplet(e) +
                 " et ses " + pluriel((v.rencontres||[]).length,"rencontre") + " ?")){
        e.visites = e.visites.filter(x => x.id !== vid);
        maj();
      }
      break;
    case "presence": {
      const r = (v.rencontres||[]).find(x => x.id === rid);
      if(!r) break;
      // un second clic sur le même choix remet la rencontre en « prévue »
      r.presence = (r.presence === b.dataset.p) ? "prevue" : b.dataset.p;
      DB.initial = false;
      sauver();
      // retour visuel immédiat ; le reste de l'écran suit juste après
      const groupe = b.parentElement;
      groupe.querySelector(".oui").classList.toggle("actif", r.presence === "venu");
      groupe.querySelector(".non").classList.toggle("actif", r.presence === "absent");
      rendreBientot();
      break;
    }
    case "rencontre-enfant": {
      const vs = visitesDe(e);
      if(!vs.length){ alert("Ajoutez d'abord un droit de visite pour " + nomComplet(e) + "."); break; }
      if(vs.length === 1) formRencontre(vs[0].e, vs[0].v, null);
      else formRencontre(null, null, null);
      break;
    }
    case "deplier":
      etat.ouvertes[id] = !etat.ouvertes[id];
      rendre();
      break;
    case "filtre-visite":
      etat.filtreVisite = b.dataset.f; rendre(); break;
    case "filtre-dossier":
      // un second clic sur la tuile active revient à la liste complète
      etat.filtreDossier = (etat.filtreDossier === b.dataset.f) ? "tout" : b.dataset.f;
      rendre();
      break;
    case "vue-dv":
      etat.vueDV = b.dataset.f; remonterEnHaut = true; rendre(); break;
    case "choisir-enfant":
      etat.enfantVisite = id;
      etat.vueDV = "enfant";   // depuis le schéma, un nom ouvre le dossier
      if(onglet !== "visites"){ allerA("visites"); break; }
      rendre();
      break;

    /* --- rencontres --- */
    case "rencontres-enfant": {
      const vs = visitesDe(e);
      if(!vs.length){ alert("Ajoutez d'abord un droit de visite pour " + nomComplet(e) + "."); break; }
      if(vs.length === 1) formRencontresMultiples(vs[0].e, vs[0].v);
      else formRencontresMultiples(null, null);
      break;
    }
    case "rencontre-modifier": formRencontre(e, v, (v.rencontres||[]).find(x => x.id === rid)); break;
    case "rencontre-supprimer":
      if(confirm("Supprimer cette rencontre et sa note ?")){
        v.rencontres = v.rencontres.filter(x => x.id !== rid);
        maj();
      }
      break;
    case "word": formExportWord(); break;

    /* --- tâches --- */
    case "tache-nouvelle": formTache(null); break;
    case "tache-modifier": formTache(DB.taches.find(t => t.id === id)); break;
    case "tache-supprimer": DB.taches = DB.taches.filter(t => t.id !== id); maj(); break;
    case "tache-bascule": {
      const t = DB.taches.find(x => x.id === id);
      t.fait = !t.fait; t.faitLe = t.fait ? aujourdHui() : "";
      maj();
      break;
    }
    case "taches-toutes":
      etat.tachesToutes = !etat.tachesToutes;
      if(onglet !== "accueil"){ allerA("accueil"); break; }
      remonterEnHaut = true;
      rendre();
      break;
    case "taches-basculer": etat.tachesFaites = !etat.tachesFaites; rendre(); break;
    case "taches-purger":
      if(confirm("Supprimer toutes les tâches terminées ?")){
        DB.taches = DB.taches.filter(t => !t.fait); maj();
      }
      break;

    /* --- enregistrement --- */
    case "fs-choisir":
      fermerModale();
      (NATIF ? natifChangerDossier() : fsChoisir().then(rendre));
      break;
    case "fs-ouvrir":      window.programme.ouvrirDossier(); break;
    /* --- reprise après un fichier illisible --- */
    case "reprise":        reprendre(b.dataset.source, b.dataset.nom); break;
    case "reprise-relire":
      (NATIF ? natifRelire() : fsLire().then(rendre)); break;
    case "fs-reconnecter": fsReconnecter(false).then(rendre); break;
    case "fs-maintenant":
      fsEcrire().then(() => fsSauvegardeDuJour(JSON.stringify(DB,null,2), true)).then(rendre);
      break;
    case "fs-oublier":
      fermerModale();
      if(confirm("Ne plus enregistrer dans ce dossier ? Le fichier existant n'est pas supprimé.")){
        FS.dossier = null; FS.enAttente = null; FS.nom = ""; FS.dernier = null; FS.erreur = "";
        idbEffacer("dossier").then(rendre);
      }
      break;
    case "fs-relire":
      fermerModale();
      if(confirm("Recharger les données depuis le fichier du disque ? Les modifications non " +
                 "encore enregistrées seront perdues.")){
        if(NATIF){ natifRelire(); } else { DB.initial = true; fsLire().then(rendre); }
      }
      break;

    /* --- sauvegardes --- */
    case "export-json":
      telecharger("sauvegarde-dossiers-" + aujourdHui() + ".json", JSON.stringify(DB,null,2),
                  null, "Sauvegarde");
      break;
    case "import-json": importerSauvegarde(); break;
    case "export-csv-enfants": exportCsvEnfants(); break;
    case "tout-effacer":
      if(confirm("Effacer TOUTES les données ? Exportez d'abord une sauvegarde si nécessaire.") &&
         confirm("Confirmez-vous définitivement l'effacement ?")){
        DB = baseVide(); fermerModale(); allerA("accueil"); maj();
      }
      break;
    case "recharger-exemple":
      if(confirm("Remplacer les données actuelles par les données de départ (vos tableaux Excel) ?")){
        DB = donneesInitiales(); fermerModale(); allerA("accueil"); maj();
      }
      break;
  }
}
/* Les lignes du tableau et les notes sont atteignables au clavier :
   Entrée et Espace doivent y faire la même chose qu'un clic. */
document.getElementById("vue").addEventListener("keydown", ev => {
  if(ev.key !== "Enter" && ev.key !== " ") return;
  if(ev.target.matches("tr[data-action]")){ ev.preventDefault(); actionner(ev.target); }
});

/* La note s'ouvre dès que la case reçoit le focus — au clic comme à la
   tabulation. L'attendre au « click », c'est-à-dire au relâchement du bouton,
   laissait la case focalisée mais encore inerte : tout ce qui était tapé entre
   l'appui et le relâchement partait dans le vide, et il ne restait que la fin
   de la phrase. */
document.getElementById("vue").addEventListener("focusin", ev => {
  if(ev.target.matches && ev.target.matches("[data-note]")) ouvrirNote(ev.target);
});

document.getElementById("vue").addEventListener("click", ev => {
  const b = ev.target.closest("[data-action]");
  if(b){ actionner(b); return; }
  const o = ev.target.closest("[data-onglet]");
  if(o) allerA(o.dataset.onglet);
});
document.getElementById("zone-modale").addEventListener("click", ev => {
  const b = ev.target.closest("[data-action]");
  if(b) actionner(b);
});
