<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion de mes dossiers</title>
<style>
:root{
  --fond:#f4f6f8; --carte:#ffffff; --texte:#1b2733; --doux:#617080; --bord:#dfe5ec;
  --accent:#2f6fb0; --accent-doux:#e8f0f9;
  --vert:#1f8a4c; --vert-f:#e3f5e9;
  --orange:#b46b00; --orange-f:#fdf0da;
  --rouge:#c02b2b; --rouge-f:#fbe4e4;
  --gris:#6b7785; --gris-f:#eef1f5;
  --violet:#6b4ea8; --violet-f:#efe9fa;
  --ombre:0 1px 2px rgba(16,24,40,.06),0 4px 12px rgba(16,24,40,.05);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --fond:#141a21; --carte:#1c242e; --texte:#e8edf3; --doux:#9aa8b8; --bord:#2c3743;
    --accent:#6aa6e0; --accent-doux:#22303f;
    --vert:#5fcf8e; --vert-f:#1b3327;
    --orange:#e8b055; --orange-f:#3a2e17;
    --rouge:#f08a8a; --rouge-f:#3a1f1f;
    --gris:#9aa8b8; --gris-f:#232c36;
    --violet:#b39ae8; --violet-f:#2a2340;
    --ombre:none;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--texte);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1,h2,h3{margin:0 0 .4em;line-height:1.25}
h1{font-size:20px}
h2{font-size:17px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--doux);margin-top:0}

/* ---------- En-tête ---------- */
header{background:var(--carte);border-bottom:1px solid var(--bord);position:sticky;top:0;z-index:40}
.bandeau{max-width:1280px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:700;font-size:17px;white-space:nowrap}
.logo span{color:var(--accent)}
.droite{margin-left:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.info-jour{font-size:13px;color:var(--doux);text-align:right}
.info-jour b{color:var(--texte)}
.stockage{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--doux);
  padding:5px 11px;border:1px solid var(--bord);border-radius:20px;background:var(--fond)}
.stockage b{color:var(--texte);font-weight:600}
nav{max-width:1280px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;
  font:inherit;font-size:14px;color:var(--doux);cursor:pointer;white-space:nowrap;border-radius:6px 6px 0 0}
nav button:hover{color:var(--texte);background:var(--accent-doux)}
nav button.actif{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
nav .pastille{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;
  background:var(--rouge);color:#fff;font-size:11px;font-weight:700;text-align:center;line-height:18px}
@media (prefers-color-scheme: dark){nav .pastille{color:#1c242e}}

main{max-width:1280px;margin:0 auto;padding:18px}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:var(--r);
  box-shadow:var(--ombre);padding:16px;margin-bottom:16px}
.carte>h2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grille{display:grid;gap:16px}
@media(min-width:900px){.g2{grid-template-columns:1fr 1fr}}

/* ---------- Indicateurs ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--carte);border:1px solid var(--bord);border-radius:var(--r);padding:13px 15px;box-shadow:var(--ombre)}
.kpi .n{font-size:26px;font-weight:700;line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--doux);margin-top:2px}
.kpi.rouge .n{color:var(--rouge)} .kpi.orange .n{color:var(--orange)}
.kpi.vert .n{color:var(--vert)} .kpi.accent .n{color:var(--accent)}

/* ---------- Tableaux ---------- */
.tableau-enveloppe{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--doux);
  padding:8px 10px;border-bottom:1px solid var(--bord);white-space:nowrap;background:var(--carte)}
td{padding:8px 10px;border-bottom:1px solid var(--bord);vertical-align:top}
tbody tr:hover{background:var(--accent-doux)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.vide{padding:26px 10px;text-align:center;color:var(--doux);font-style:italic}
.cliquable{cursor:pointer}
.cliquable b{color:var(--accent)}

/* ---------- Étiquettes ---------- */
.et{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.et.vert{background:var(--vert-f);color:var(--vert)}
.et.orange{background:var(--orange-f);color:var(--orange)}
.et.rouge{background:var(--rouge-f);color:var(--rouge)}
.et.gris{background:var(--gris-f);color:var(--gris)}
.et.suspendu{background:var(--violet-f);color:var(--violet)}
.et.info{background:var(--accent-doux);color:var(--accent)}
tr.l-rouge td:first-child{box-shadow:inset 3px 0 var(--rouge)}
tr.l-orange td:first-child{box-shadow:inset 3px 0 var(--orange)}
tr.l-vert td:first-child{box-shadow:inset 3px 0 var(--vert)}
tr.l-gris td:first-child{box-shadow:inset 3px 0 var(--gris)}
tr.l-suspendu td:first-child{box-shadow:inset 3px 0 var(--violet)}
.puce{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.puce.vert{background:var(--vert)} .puce.orange{background:var(--orange)}
.puce.rouge{background:var(--rouge)} .puce.gris{background:var(--gris)} .puce.suspendu{background:var(--violet)}

/* ---------- Boutons ---------- */
button.b,a.b{display:inline-flex;align-items:center;gap:6px;background:var(--carte);color:var(--texte);
  border:1px solid var(--bord);border-radius:8px;padding:6px 12px;font:inherit;font-size:13.5px;
  cursor:pointer;text-decoration:none}
button.b:hover,a.b:hover{background:var(--accent-doux);border-color:var(--accent)}
button.b.primaire{background:var(--accent);border-color:var(--accent);color:#fff}
button.b.primaire:hover{filter:brightness(1.08)}
button.b.danger{color:var(--rouge)}
button.b.danger:hover{background:var(--rouge-f);border-color:var(--rouge)}
button.b.mini{padding:3px 8px;font-size:12.5px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.barre-outils{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.barre-outils .pousse{margin-left:auto}

/* ---------- Formulaires ---------- */
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{
  font:inherit;font-size:14px;padding:7px 9px;border:1px solid var(--bord);border-radius:8px;
  background:var(--carte);color:var(--texte);width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
label.champ{display:block;margin-bottom:11px}
label.champ>span{display:block;font-size:12.5px;color:var(--doux);margin-bottom:4px}
.ligne{display:grid;gap:11px}
@media(min-width:560px){.ligne.c2{grid-template-columns:1fr 1fr}.ligne.c3{grid-template-columns:1fr 1fr 1fr}}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:6px;border:1px solid var(--bord);border-radius:8px;
  padding:7px 12px;cursor:pointer;font-size:13.5px}
.radios input{width:auto;margin:0}
.aide{font-size:12.5px;color:var(--doux);margin:4px 0 0}

/* ---------- Modale ---------- */
.voile{position:fixed;inset:0;background:rgba(10,16,24,.5);display:flex;align-items:flex-start;
  justify-content:center;padding:24px 14px;overflow:auto;z-index:100}
.modale{background:var(--carte);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.3);
  width:100%;max-width:640px;border:1px solid var(--bord)}
.modale header{position:static;background:none;border:0;padding:16px 18px 0}
.modale .corps{padding:14px 18px}
.modale .pied{padding:14px 18px;border-top:1px solid var(--bord);display:flex;gap:8px;justify-content:flex-end}

/* ---------- Fiche enfant ---------- */
.entete-fiche{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.entete-fiche .nom{font-size:22px;font-weight:700}
.bloc{border:1px solid var(--bord);border-radius:var(--r);padding:13px 15px;margin-bottom:11px;background:var(--fond)}
.bloc .chapeau{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.bloc .chapeau .t{font-weight:700}
.rencontre{display:flex;gap:11px;padding:9px 0;border-top:1px solid var(--bord);align-items:flex-start}
.rencontre .d{min-width:104px;font-variant-numeric:tabular-nums;font-size:13px;font-weight:600;white-space:nowrap}
.rencontre .n{flex:1;white-space:pre-wrap}
.deux-col{display:grid;gap:11px}
@media(min-width:780px){.deux-col{grid-template-columns:1fr 1fr}}

/* ---------- Calendrier des rapports ---------- */
.mois-grille{display:grid;gap:11px}
@media(min-width:700px){.mois-grille{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1050px){.mois-grille{grid-template-columns:repeat(3,1fr)}}
.mois{border:1px solid var(--bord);border-radius:var(--r);background:var(--carte);overflow:hidden}
.mois>.tete{padding:7px 12px;background:var(--gris-f);font-weight:700;font-size:13.5px;
  display:flex;justify-content:space-between;align-items:baseline}
.mois>.tete.courant{background:var(--accent-doux);color:var(--accent)}
.mois .part{padding:8px 12px;border-top:1px solid var(--bord)}
.mois .part .lib{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--doux);margin-bottom:3px}
.mois .part .item{font-size:13px;padding:1px 0}
.mois .rien{padding:9px 12px;color:var(--doux);font-size:12.5px;font-style:italic}

/* ---------- Divers ---------- */
.doux{color:var(--doux)}
.pt{font-size:12.5px}
.nowrap{white-space:nowrap}
ul.liste{list-style:none;margin:0;padding:0}
ul.liste li{padding:8px 0;border-bottom:1px solid var(--bord);display:flex;gap:10px;align-items:flex-start}
ul.liste li:last-child{border-bottom:0}
.tache-faite{text-decoration:line-through;color:var(--doux)}
.legende{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--doux);margin-top:10px}
.encadre{border:1px solid var(--bord);border-radius:var(--r);padding:12px 14px;background:var(--fond);margin-bottom:12px}
.encadre.ok{border-color:var(--vert);background:var(--vert-f)}
.encadre.attention{border-color:var(--orange);background:var(--orange-f)}
.encadre.souci{border-color:var(--rouge);background:var(--rouge-f)}
.encadre .titre{font-weight:600;margin-bottom:3px}
code{background:var(--gris-f);padding:1px 5px;border-radius:4px;font-size:12.5px}
footer{max-width:1280px;margin:0 auto;padding:6px 18px 34px;font-size:12.5px;color:var(--doux)}

@media print{
  header,nav,.barre-outils,footer,.actions,button{display:none !important}
  body{background:#fff}
  main{max-width:none;padding:0}
  .carte,.mois,.bloc{break-inside:avoid;box-shadow:none;border-color:#bbb;margin-bottom:10px}
  .et{border:1px solid #999}
}
</style>
</head>
<body>

<header>
  <div class="bandeau">
    <div class="logo">Gestion de mes <span>dossiers</span></div>
    <div class="droite">
      <div class="stockage" id="etat-stockage"></div>
      <div class="info-jour" id="info-jour"></div>
    </div>
  </div>
  <nav id="nav"></nav>
</header>

<main id="vue"></main>
<footer id="pied"></footer>

<div id="zone-modale"></div>
<input type="file" id="fichier-import" accept="application/json,.json" hidden>

<script>
"use strict";

/* =========================================================================
   1. OUTILS GÉNÉRAUX
   ========================================================================= */

const JOURS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const MOIS  = ["janvier","février","mars","avril","mai","juin","juillet","août",
               "septembre","octobre","novembre","décembre"];

const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);

function ech(v){
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* --- Dates : chaînes ISO "AAAA-MM-JJ", calculs en heure locale --- */
function dISO(d){
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function parseISO(s){
  const [a,m,j] = String(s).split("-").map(Number);
  return new Date(a, m-1, j);
}
const aujourdHui = () => dISO(new Date());
const estISO = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ""));

function fmtFR(s){
  if(!estISO(s)) return "—";
  const [a,m,j] = s.split("-");
  return j + "/" + m + "/" + a;
}
function fmtLong(s){
  if(!estISO(s)) return "—";
  const d = parseISO(s);
  return JOURS[(d.getDay()+6)%7] + " " + d.getDate() + " " + MOIS[d.getMonth()] + " " + d.getFullYear();
}
function fmtMoisAnnee(s){
  const d = parseISO(s);
  return MOIS[d.getMonth()] + " " + d.getFullYear();
}
function joursEntre(a,b){ return Math.round((parseISO(b) - parseISO(a)) / 86400000); }

/** Décale une date de n mois, en ramenant au dernier jour du mois si besoin. */
function decalerMois(iso, n){
  const d = parseISO(iso);
  const jour = d.getDate();
  const cible = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const dernier = new Date(cible.getFullYear(), cible.getMonth()+1, 0).getDate();
  cible.setDate(Math.min(jour, dernier));
  return dISO(cible);
}
const decalerAns = (iso, n) => decalerMois(iso, 12*n);
function decalerJours(iso, n){ const d = parseISO(iso); d.setDate(d.getDate()+n); return dISO(d); }
function pluriel(n, mot, plur){ return n + " " + (Math.abs(n) > 1 ? (plur || mot+"s") : mot); }

/* =========================================================================
   2. DONNÉES
   ========================================================================= */

const CLE = "fa-dossiers-v2";
let DB = null;
let onglet = "tableau";
let etat = { recherche:"", tri:"date", ficheId:null, tachesFaites:false, anneeRapports:0 };

function baseVide(){
  return {
    version: 2,
    parametres: { seuilAlerteJours:30, seuilRapportJours:45 },
    enfants: [], taches: []
  };
}
function normaliser(d){
  const r = Object.assign(baseVide(), d || {});
  r.parametres = Object.assign(baseVide().parametres, (d && d.parametres) || {});
  r.enfants = Array.isArray(r.enfants) ? r.enfants : [];
  r.taches  = Array.isArray(r.taches)  ? r.taches  : [];
  r.enfants.forEach(e => {
    e.relances   = Array.isArray(e.relances)   ? e.relances   : [];
    e.historique = Array.isArray(e.historique) ? e.historique : [];
    e.rapports   = Array.isArray(e.rapports)   ? e.rapports   : [];
    e.visites    = Array.isArray(e.visites)    ? e.visites    : [];
    e.visites.forEach(v => { v.rencontres = Array.isArray(v.rencontres) ? v.rencontres : []; });
  });
  return r;
}

function charger(){
  try{
    const brut = localStorage.getItem(CLE);
    if(brut){ DB = normaliser(JSON.parse(brut)); return; }
  }catch(e){ console.warn("Lecture impossible :", e); }
  DB = donneesInitiales();
  sauver();
}
function sauver(){
  DB.modifieLe = new Date().toISOString();
  try{ localStorage.setItem(CLE, JSON.stringify(DB)); }
  catch(e){ console.warn("Copie navigateur impossible :", e); }
  fsPlanifierEcriture();
}
function maj(){ DB.initial = false; sauver(); rendre(); }

const enfantParId = id => DB.enfants.find(e => e.id === id);
const nomComplet  = e => e ? ((e.prenom||"") + " " + (e.nom||"")).trim() : "";
const parNom = (a,b) => nomComplet(a).localeCompare(nomComplet(b), "fr");

/* =========================================================================
   3. ENREGISTREMENT DANS UN VRAI FICHIER SUR LE DISQUE
   ========================================================================= */

const NOM_FICHIER    = "donnees-dossiers.json";
const DOSSIER_SAUV   = "sauvegardes";
const NB_SAUVEGARDES = 60;

/* Deux modes :
   — NATIF : le programme est installé, il écrit directement sur le disque ;
   — navigateur : la page demande l'accès à un dossier (Chrome / Edge). */
const NATIF = !!(window.programme && window.programme.natif);

const FS = {
  natif: NATIF,
  dispo: NATIF || typeof window.showDirectoryPicker === "function",
  dossier:null, enAttente:null, nom:"", chemin:"", dernier:null, erreur:"",
  enCours:false, aRefaire:false, dernierBackup:0
};

function idbOuvrir(){
  return new Promise((res, rej) => {
    const q = indexedDB.open("fa-dossiers-config", 1);
    q.onupgradeneeded = () => q.result.createObjectStore("cfg");
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
function idbEcrire(cle, valeur){
  return idbOuvrir().then(d => new Promise((res, rej) => {
    const t = d.transaction("cfg","readwrite");
    t.objectStore("cfg").put(valeur, cle);
    t.oncomplete = () => { d.close(); res(); };
    t.onerror = () => { d.close(); rej(t.error); };
  }));
}
function idbLire(cle){
  return idbOuvrir().then(d => new Promise((res, rej) => {
    const t = d.transaction("cfg","readonly");
    const q = t.objectStore("cfg").get(cle);
    q.onsuccess = () => { d.close(); res(q.result || null); };
    q.onerror = () => { d.close(); rej(q.error); };
  }));
}
function idbEffacer(cle){
  return idbOuvrir().then(d => new Promise(res => {
    const t = d.transaction("cfg","readwrite");
    t.objectStore("cfg").delete(cle);
    t.oncomplete = () => { d.close(); res(); };
    t.onerror = () => { d.close(); res(); };
  }));
}

const heureCourte = d => String(d.getHours()).padStart(2,"0") + "h" + String(d.getMinutes()).padStart(2,"0");
const nomDeChemin = c => String(c||"").replace(/[\\/]+$/,"").split(/[\\/]/).pop() || c;

/* ------------------------------ mode programme installé ------------------ */

async function natifDemarrer(){
  const r = await window.programme.lire();
  FS.chemin = r.dossier || "";
  FS.nom = nomDeChemin(FS.chemin);
  FS.dossier = FS.chemin;
  if(!r.ok){
    FS.erreur = r.erreur || "lecture impossible";
  }else if(r.contenu){
    try{
      const d = JSON.parse(r.contenu);
      if(!d || !Array.isArray(d.enfants)) throw new Error("contenu inattendu");
      DB = normaliser(d);
      try{ localStorage.setItem(CLE, JSON.stringify(DB)); }catch(e){}
    }catch(e){ FS.erreur = "Fichier illisible (" + e.message + ")"; }
  }else{
    await fsEcrire();          // premier lancement : on crée le fichier
  }
  rendre();
}
async function natifChangerDossier(){
  const r = await window.programme.changerDossier();
  FS.chemin = r.dossier || "";
  FS.nom = nomDeChemin(FS.chemin);
  FS.dossier = FS.chemin;
  if(r.ok) await fsEcrire();   // on dépose les données dans le nouveau dossier
  rendre();
}
async function natifRelire(){
  const r = await window.programme.lire();
  if(r.ok && r.contenu){
    try{
      const d = JSON.parse(r.contenu);
      if(d && Array.isArray(d.enfants)){
        DB = normaliser(d);
        try{ localStorage.setItem(CLE, JSON.stringify(DB)); }catch(e){}
      }
    }catch(e){ alert("Fichier illisible : " + e.message); }
  }
  rendre();
}

/* ------------------------------ mode navigateur -------------------------- */

async function fsReconnecter(silencieux){
  if(!FS.dispo || NATIF) return;
  let h = null;
  try{ h = await idbLire("dossier"); }catch(e){ return; }
  if(!h) return;
  FS.nom = h.name;
  let droit = "prompt";
  try{
    droit = silencieux ? await h.queryPermission({ mode:"readwrite" })
                       : await h.requestPermission({ mode:"readwrite" });
  }catch(e){ droit = "prompt"; }
  if(droit === "granted"){
    FS.dossier = h; FS.enAttente = null; FS.erreur = "";
    await fsLire();
  }else{
    FS.enAttente = h;
  }
  majEtatStockage();
}

async function fsChoisir(){
  if(!FS.dispo) return;
  let h;
  try{ h = await window.showDirectoryPicker({ id:"dossiers-fa", mode:"readwrite", startIn:"documents" }); }
  catch(e){ return; }
  FS.dossier = h; FS.enAttente = null; FS.nom = h.name; FS.erreur = "";
  try{ await idbEcrire("dossier", h); }catch(e){}
  const trouve = await fsLire();
  if(!trouve) await fsEcrire();
  majEtatStockage();
  alert(trouve
    ? "Dossier connecté. Les données du fichier « " + NOM_FICHIER + " » ont été chargées."
    : "Dossier connecté. Vos données sont enregistrées dans « " + NOM_FICHIER +
      " », automatiquement, à chaque modification.");
}

async function fsLire(){
  if(!FS.dossier) return false;
  let fh;
  try{ fh = await FS.dossier.getFileHandle(NOM_FICHIER); }catch(e){ return false; }
  try{
    const d = JSON.parse(await (await fh.getFile()).text());
    if(!d || !Array.isArray(d.enfants)) throw new Error("contenu inattendu");
    const localPlusRecent = DB && !DB.initial && DB.modifieLe &&
                            (!d.modifieLe || DB.modifieLe > d.modifieLe);
    if(localPlusRecent){
      await fsEcrire();
    }else{
      DB = normaliser(d);
      try{ localStorage.setItem(CLE, JSON.stringify(DB)); }catch(e){}
      rendre();
    }
    return true;
  }catch(e){
    FS.erreur = "Fichier illisible (" + e.message + ")";
    return true;
  }
}

let minuteurEcriture = null;
function fsPlanifierEcriture(){
  if(!FS.dossier) return;
  clearTimeout(minuteurEcriture);
  minuteurEcriture = setTimeout(fsEcrire, 300);
}
async function fsEcrire(){
  if(!FS.dossier) return;
  if(FS.enCours){ FS.aRefaire = true; return; }
  FS.enCours = true;
  const contenu = JSON.stringify(DB, null, 2);
  if(NATIF){
    const r = await window.programme.ecrire(contenu);
    if(r.ok){
      FS.dernier = new Date(r.heure);
      FS.erreur = "";
      FS.chemin = r.dossier; FS.nom = nomDeChemin(r.dossier); FS.dossier = r.dossier;
    }else{
      FS.erreur = r.erreur || "écriture impossible";
    }
  }else{
    try{
      const fh = await FS.dossier.getFileHandle(NOM_FICHIER, { create:true });
      const flux = await fh.createWritable();
      await flux.write(contenu);
      await flux.close();
      FS.dernier = new Date();
      FS.erreur = "";
      await fsSauvegardeDuJour(contenu);
    }catch(e){ FS.erreur = e.message || "écriture impossible"; }
  }
  FS.enCours = false;
  majEtatStockage();
  if(FS.aRefaire){ FS.aRefaire = false; fsPlanifierEcriture(); }
}
async function fsSauvegardeDuJour(contenu, forcer){
  if(NATIF){ await window.programme.sauvegarder(contenu || JSON.stringify(DB,null,2)); return; }
  if(!forcer && Date.now() - FS.dernierBackup < 120000) return;
  FS.dernierBackup = Date.now();
  try{
    const dir = await FS.dossier.getDirectoryHandle(DOSSIER_SAUV, { create:true });
    const fh = await dir.getFileHandle("donnees-" + aujourdHui() + ".json", { create:true });
    const flux = await fh.createWritable();
    await flux.write(contenu);
    await flux.close();
    const noms = [];
    for await (const nom of dir.keys()){
      if(/^donnees-\d{4}-\d{2}-\d{2}\.json$/.test(nom)) noms.push(nom);
    }
    noms.sort();
    for(const n of noms.slice(0, Math.max(0, noms.length - NB_SAUVEGARDES))) await dir.removeEntry(n);
  }catch(e){ /* la copie de secours ne bloque jamais l'enregistrement principal */ }
}

/* =========================================================================
   4. ÉCHÉANCES : notifications, rapports, droits de visite
   ========================================================================= */

const ORDRE_STATUT = { rouge:0, orange:1, suspendu:2, gris:3, vert:4 };

function statutEcheance(date, seuil){
  if(!estISO(date)) return { code:"gris", label:"Date à encoder", jours:null };
  const s = seuil == null ? DB.parametres.seuilAlerteJours : seuil;
  const j = joursEntre(aujourdHui(), date);
  if(j < 0)   return { code:"rouge",  label:"En retard de " + pluriel(-j,"jour"), jours:j };
  if(j === 0) return { code:"orange", label:"Aujourd'hui", jours:0 };
  if(j <= s)  return { code:"orange", label:"Dans " + pluriel(j,"jour"), jours:j };
  return { code:"vert", label:"Dans " + pluriel(j,"jour"), jours:j };
}

/* --- Notification de prise en charge --- */
const statutNotif = e => statutEcheance(e.notifFin);

/* --- Rapports : l'annuel tombe à la date de formalisation,
       le semestriel exactement six mois plus tôt. --- */
function dateBaseRapport(e, type){
  if(!estISO(e.notifFin)) return null;
  return type === "annuel" ? e.notifFin : decalerMois(e.notifFin, -6);
}
const rapportEnvoye = (e, type, echeance) =>
  (e.rapports || []).some(r => r.type === type && r.echeance === echeance && r.envoyeLe);

/** Nombre de jours pendant lesquels un rapport dépassé reste signalé. */
const RATTRAPAGE_RAPPORT = 60;

/** Prochaine échéance non encore envoyée, en gardant les retards récents. */
function echeanceRapport(e, type){
  const base = dateBaseRapport(e, type);
  if(!base) return null;
  let d = base;
  const limite = decalerJours(aujourdHui(), -RATTRAPAGE_RAPPORT);
  let garde = 0;
  while(d < limite && garde++ < 50) d = decalerAns(d, 1);   // les cycles révolus sont passés
  garde = 0;
  while(rapportEnvoye(e, type, d) && garde++ < 20) d = decalerAns(d, 1);
  return d;
}
function statutRapport(e, type){
  const d = echeanceRapport(e, type);
  if(!d) return { code:"gris", label:"Sans date de formalisation", date:null };
  const st = statutEcheance(d, DB.parametres.seuilRapportJours);
  st.date = d;
  return st;
}

/* --- Droits de visite (un bloc par parent) --- */
function statutVisite(v){
  if(v.suspendu) return { code:"suspendu",
    label:"Suspendu" + (estISO(v.suspenduDepuis) ? " depuis le " + fmtFR(v.suspenduDepuis) : "") };
  if(!estISO(v.dateFin)) return { code:"gris", label:"Sans date de fin" };
  return statutEcheance(v.dateFin);
}
function toutesVisites(){
  const l = [];
  DB.enfants.forEach(e => (e.visites||[]).forEach(v => l.push({ enfant:e, visite:v })));
  return l;
}
function toutesRencontres(){
  const l = [];
  DB.enfants.forEach(e => (e.visites||[]).forEach(v => (v.rencontres||[]).forEach(r =>
    l.push({ enfant:e, visite:v, rencontre:r }))));
  l.sort((a,b) => String(b.rencontre.date).localeCompare(String(a.rencontre.date)));
  return l;
}
const libelleParent = v => v.parent && v.parent.trim() ? v.parent.trim() : "Parent à préciser";
const PRESENCES = {
  venu:    { label:"Parent venu",       court:"Venu",     code:"vert"   },
  absent:  { label:"Parent absent",     court:"Absent",   code:"rouge"  },
  annulee: { label:"Rencontre annulée", court:"Annulée",  code:"gris"   }
};
const presenceDe = r => PRESENCES[r.presence] || PRESENCES.venu;

/* --- Alertes globales --- */
function alertes(){
  const notifs = DB.enfants
    .map(e => ({ enfant:e, st:statutNotif(e) }))
    .filter(o => o.st.code !== "vert")
    .sort((a,b) => ORDRE_STATUT[a.st.code] - ORDRE_STATUT[b.st.code] ||
                   String(a.enfant.notifFin||"9").localeCompare(String(b.enfant.notifFin||"9")));

  const rapports = [];
  DB.enfants.forEach(e => ["semestriel","annuel"].forEach(t => {
    const st = statutRapport(e, t);
    if(st.code === "rouge" || st.code === "orange") rapports.push({ enfant:e, type:t, st });
  }));
  rapports.sort((a,b) => String(a.st.date).localeCompare(String(b.st.date)));

  const visites = toutesVisites()
    .map(o => Object.assign({ st:statutVisite(o.visite) }, o))
    .filter(o => o.st.code !== "vert")
    .sort((a,b) => ORDRE_STATUT[a.st.code] - ORDRE_STATUT[b.st.code] ||
                   String(a.visite.dateFin||"9").localeCompare(String(b.visite.dateFin||"9")));

  return { notifs, rapports, visites };
}
function tachesEnCours(){
  const auj = aujourdHui();
  return DB.taches.filter(t => !t.fait)
    .sort((a,b) => String(a.echeance||"9999").localeCompare(String(b.echeance||"9999")) ||
                   String(a.texte).localeCompare(String(b.texte)))
    .map(t => Object.assign({}, t, {
      enRetard: estISO(t.echeance) && t.echeance < auj,
      pourAuj:  t.echeance === auj
    }));
}

          <button class="b primaire" data-action="reconduire" data-id="${e.id}">Reconduire d'un an</button>
          <button class="b" data-action="relance" data-id="${e.id}">Noter une relance aujourd'hui</button>
          <button class="b" data-action="enfant-modifier" data-id="${e.id}">Modifier la date</button>
        </div>
        ${(e.relances||[]).length ? `
          <div style="margin-top:10px"><h3>Relances</h3>
          <ul class="liste">${e.relances.slice().reverse().map(r => `<li>
            <span style="flex:1">${ech(fmtLong(r))}</span>
            <button class="b mini danger" data-action="relance-suppr" data-id="${e.id}"
                    data-date="${ech(r)}">✕</button></li>`).join("")}</ul></div>` : ""}
        ${(e.historique||[]).length ? `
          <p class="aide">Échéances précédentes : ${e.historique.map(h => ech(fmtFR(h))).join(" · ")}</p>` : ""}
      </div>
    </div>`;

  const carteRapport = (type, s) => `
    <div class="bloc">
      <div class="chapeau">
        <span class="t">Rapport ${type === "annuel" ? "annuel" : "semestriel"}</span>
        <span class="et ${s.code}">${ech(s.label)}</span>
      </div>
      <div class="pt">À rendre pour le <b>${ech(fmtFR(s.date))}</b>
        ${s.date ? '<span class="doux">(' + ech(fmtMoisAnnee(s.date)) + ")</span>" : ""}</div>
      <p class="aide">${type === "annuel"
        ? "Tombe à la date de formalisation."
        : "Tombe six mois avant la formalisation."}</p>
      ${s.date ? `<div class="actions" style="margin-top:8px">
        <button class="b" data-action="rapport-envoye" data-id="${e.id}" data-type="${type}">
          Marquer comme envoyé</button></div>` : ""}
    </div>`;

  const blocRapports = `
    <div class="carte">
      <h2>Rapports d'évolution</h2>
      <div class="deux-col">${carteRapport("semestriel", sem)}${carteRapport("annuel", an)}</div>
      ${envoyes.length ? `<h3 style="margin-top:12px">Rapports déjà envoyés</h3>
        <ul class="liste">${envoyes.map(r => `<li>
          <span style="flex:1"><b>${r.type === "annuel" ? "Annuel" : "Semestriel"}</b>
            <span class="doux pt">· échéance ${ech(fmtFR(r.echeance))} · envoyé le ${ech(fmtFR(r.envoyeLe))}</span></span>
          <button class="b mini danger" data-action="rapport-annuler" data-id="${e.id}"
                  data-rid="${r.id}">Annuler</button></li>`).join("")}</ul>` : ""}
    </div>`;

  const blocVisites = `
    <div class="carte">
      <h2>Droits de visite et rencontres
        <button class="b mini" data-action="visite-nouvelle" data-id="${e.id}">+ Ajouter un droit de visite</button>
        ${(e.visites||[]).length ? '<button class="b mini" data-action="word-enfant" data-id="' + e.id +
          '">Exporter les notes en Word</button>' : ""}</h2>
      ${(e.visites||[]).length ? e.visites.map(v => blocUneVisite(e,v)).join("")
        : `<p class="doux">Aucun droit de visite encodé. Ajoutez-en un par parent :
           un pour le papa, un pour la maman, s'ils voient l'enfant séparément.</p>`}
    </div>`;

  return `
  <div class="carte">
    <div class="barre-outils">
      <button class="b" data-action="retour-enfants">← Tous les enfants</button>
      <span class="pousse"></span>
      <button class="b" data-action="enfant-modifier" data-id="${e.id}">Modifier la fiche</button>
      <button class="b danger" data-action="enfant-supprimer" data-id="${e.id}">Supprimer</button>
      <button class="b" onclick="window.print()">Imprimer</button>
    </div>
    <div class="entete-fiche">
      <div>
        <div class="nom">${ech(nomComplet(e))}</div>
        <div class="doux pt">
          ${e.service ? ech(e.service) : "Service à préciser"}
          ${estISO(e.naissance) ? " · né(e) le " + ech(fmtFR(e.naissance)) : ""}
        </div>
      </div>
    </div>
    ${e.notes ? '<p class="pt" style="margin:10px 0 0;white-space:pre-wrap">' + ech(e.notes) + "</p>" : ""}
  </div>
  ${blocNotif}${blocRapports}${blocVisites}`;
}

function blocUneVisite(e, v){
  const s = statutVisite(v);
  const renc = (v.rencontres||[]).slice().sort((a,b) => String(b.date).localeCompare(String(a.date)));
  const venus = renc.filter(r => r.presence === "venu").length;
  const absents = renc.filter(r => r.presence === "absent").length;
  const annulees = renc.filter(r => r.presence === "annulee").length;

  return `<div class="bloc">
    <div class="chapeau">
      <span class="t">${ech(libelleParent(v))}</span>
      ${v.frequence ? '<span class="et info">' + ech(v.frequence) + "</span>" : ""}
      <span class="et ${s.code}">${ech(s.label)}</span>
      <span class="pousse" style="margin-left:auto"></span>
      <span class="actions">
        <button class="b mini" data-action="rencontre-nouvelle" data-id="${e.id}" data-vid="${v.id}">+ Rencontre</button>
        <button class="b mini" data-action="visite-modifier" data-id="${e.id}" data-vid="${v.id}">Modifier</button>
        <button class="b mini danger" data-action="visite-supprimer" data-id="${e.id}" data-vid="${v.id}">✕</button>
      </span>
    </div>
    <div class="pt doux">
      ${estISO(v.dateFin) ? "Droit valable jusqu'au " + ech(fmtFR(v.dateFin)) + " · " : ""}
      ${renc.length ? pluriel(renc.length,"rencontre") + " encodée(s) : " +
        venus + " honorée(s), " + absents + " manquée(s)" + (annulees ? ", " + annulees + " annulée(s)" : "")
        : "aucune rencontre encodée"}
      ${v.lieu ? " · lieu : " + ech(v.lieu) : ""}
    </div>
    ${v.notes ? '<p class="pt" style="margin:6px 0 0;white-space:pre-wrap">' + ech(v.notes) + "</p>" : ""}
    ${renc.length ? '<div style="margin-top:8px">' + renc.map(r => {
      const p = presenceDe(r);
      return `<div class="rencontre">
        <span class="d">${ech(fmtFR(r.date))}</span>
        <span class="et ${p.code}" style="min-width:76px;text-align:center">${ech(p.court)}</span>
        <span class="n">${r.note ? ech(r.note) : '<span class="doux">Pas de note</span>'}</span>
        <span class="actions">
          <button class="b mini" data-action="rencontre-modifier" data-id="${e.id}" data-vid="${v.id}"
                  data-rid="${r.id}">Modifier</button>
          <button class="b mini danger" data-action="rencontre-supprimer" data-id="${e.id}" data-vid="${v.id}"
                  data-rid="${r.id}">✕</button>
        </span></div>`;
    }).join("") + "</div>" : ""}
  </div>`;
}

/* =========================================================================
   9. VUE — Rapports (calendrier des douze prochains mois)
   ========================================================================= */

function vueRapports(){
  const dep = new Date();
  const debut = new Date(dep.getFullYear(), dep.getMonth() + etat.anneeRapports*12, 1);

  const mois = [];
  for(let i = 0; i < 12; i++){
    const d = new Date(debut.getFullYear(), debut.getMonth()+i, 1);
    mois.push({ annee:d.getFullYear(), mois:d.getMonth(), annuels:[], semestriels:[] });
  }
  const place = (type, e, date) => {
    if(!date) return;
    const d = parseISO(date);
    const c = mois.find(m => m.annee === d.getFullYear() && m.mois === d.getMonth());
    if(c) c[type].push({ enfant:e, date });
  };
  DB.enfants.forEach(e => {
    place("annuels",     e, echeanceRapport(e,"annuel"));
    place("semestriels", e, echeanceRapport(e,"semestriel"));
  });

  const item = o => {
    const st = statutEcheance(o.date, DB.parametres.seuilRapportJours);
    return '<div class="item"><span class="puce ' + st.code + '"></span>' +
      '<span class="cliquable" data-action="fiche" data-id="' + o.enfant.id + '">' +
      ech(nomComplet(o.enfant)) + "</span>" +
      (o.enfant.service ? ' <span class="doux">· ' + ech(o.enfant.service) + "</span>" : "") +
      ' <span class="doux">· ' + ech(fmtFR(o.date).slice(0,5)) + "</span></div>";
  };

  const auj = new Date();
  const cases = mois.map(m => {
    const courant = m.annee === auj.getFullYear() && m.mois === auj.getMonth();
    const tri = l => l.sort((a,b) => a.date.localeCompare(b.date));
    tri(m.annuels); tri(m.semestriels);
    return `<div class="mois">
      <div class="tete ${courant?"courant":""}">
        <span>${MOIS[m.mois].charAt(0).toUpperCase() + MOIS[m.mois].slice(1)}</span>
        <span class="doux">${m.annee}</span>
      </div>
      ${m.annuels.length ? '<div class="part"><div class="lib">Formalisations — rapport annuel</div>' +
        m.annuels.map(item).join("") + "</div>" : ""}
      ${m.semestriels.length ? '<div class="part"><div class="lib">Rapports d\'évolution — semestriel</div>' +
        m.semestriels.map(item).join("") + "</div>" : ""}
      ${(!m.annuels.length && !m.semestriels.length) ? '<div class="rien">Rien de prévu</div>' : ""}
    </div>`;
  }).join("");

  const al = alertes().rapports;
  const aPreparer = al.length ? `
    <div class="carte">
      <h2>À préparer maintenant <span class="et orange">${al.length}</span></h2>
      <div class="tableau-enveloppe"><table>
        <thead><tr><th>Enfant</th><th>Service</th><th>Type</th><th class="num">Échéance</th><th>Statut</th><th></th></tr></thead>
        <tbody>${al.map(o => `<tr class="l-${o.st.code}">
          <td>${lienEnfant(o.enfant)}</td>
          <td>${o.enfant.service ? '<span class="et info">' + ech(o.enfant.service) + "</span>" : "—"}</td>
          <td>${o.type === "annuel" ? "Annuel" : "Semestriel"}</td>
          <td class="num">${ech(fmtFR(o.st.date))}</td>
          <td><span class="et ${o.st.code}">${ech(o.st.label)}</span></td>
          <td><button class="b mini" data-action="rapport-envoye" data-id="${o.enfant.id}"
                      data-type="${o.type}">Marquer envoyé</button></td>
        </tr>`).join("")}</tbody>
      </table></div>
    </div>` : "";

  const sansDate = DB.enfants.filter(e => !estISO(e.notifFin));

  return `
  <div class="carte">
    <div class="barre-outils">
      <button class="b" data-action="annee" data-delta="-1">← 12 mois avant</button>
      <button class="b" data-action="annee" data-delta="0">Aujourd'hui</button>
      <button class="b" data-action="annee" data-delta="1">12 mois après →</button>
      <b style="margin-left:6px">De ${ech(MOIS[debut.getMonth()])} ${debut.getFullYear()}
         à ${ech(MOIS[mois[11].mois])} ${mois[11].annee}</b>
      <span class="pousse"></span>
      <button class="b" onclick="window.print()">Imprimer</button>
    </div>
    <p class="pt doux" style="margin:-4px 0 12px">
      Le <b>rapport annuel</b> tombe à la date de formalisation, le <b>rapport d'évolution semestriel</b>
      six mois plus tôt. Les deux sont recalculés automatiquement à chaque reconduction.</p>
    <div class="mois-grille">${cases}</div>
    ${sansDate.length ? '<div class="encadre attention" style="margin-top:14px">' +
      '<div class="titre">' + pluriel(sansDate.length,"enfant") + " sans date de formalisation</div>" +
      "Impossible de calculer leurs rapports : " +
      sansDate.map(e => '<span class="cliquable" data-action="fiche" data-id="' + e.id + '">' +
        ech(nomComplet(e)) + "</span>").join(", ") + ".</div>" : ""}
  </div>
  ${aPreparer}`;
}

/* =========================================================================
   10. VUE — Visites
   ========================================================================= */

function vueVisites(){
  const liste = toutesVisites().sort((a,b) => {
    const sa = statutVisite(a.visite), sb = statutVisite(b.visite);
    return ORDRE_STATUT[sa.code] - ORDRE_STATUT[sb.code] || parNom(a.enfant, b.enfant);
  });

  const lignes = liste.map(o => {
    const s = statutVisite(o.visite);
    const renc = (o.visite.rencontres||[]).slice().sort((a,b) => String(b.date).localeCompare(String(a.date)));
    const derniere = renc[0];
    return `<tr class="l-${s.code}">
      <td>${lienEnfant(o.enfant)}</td>
      <td>${ech(libelleParent(o.visite))}</td>
      <td>${ech(o.visite.frequence || "—")}</td>
      <td class="num">${o.visite.suspendu ? "—" : ech(fmtFR(o.visite.dateFin))}</td>
      <td><span class="et ${s.code}">${ech(s.label)}</span></td>
      <td class="num">${renc.length}</td>
      <td class="pt">${derniere
        ? ech(fmtFR(derniere.date)) + ' <span class="et ' + presenceDe(derniere).code + '">' +
          ech(presenceDe(derniere).court) + "</span>"
        : '<span class="doux">—</span>'}</td>
      <td><div class="actions">
        <button class="b mini primaire" data-action="rencontre-nouvelle" data-id="${o.enfant.id}"
                data-vid="${o.visite.id}">+ Rencontre</button>
      </div></td>
    </tr>`;
  }).join("");

  const recentes = toutesRencontres().slice(0, 25);

  return `
  <div class="carte">
    <div class="barre-outils">
      <button class="b primaire" data-action="word-tous">Exporter les notes en Word</button>
      <span class="pousse doux pt">${pluriel(liste.length,"droit")} de visite ·
        ${pluriel(toutesRencontres().length,"rencontre")} encodée(s)</span>
      <button class="b" onclick="window.print()">Imprimer</button>
    </div>
    <p class="pt doux" style="margin:-4px 0 12px">
      Un droit de visite par parent : si l'enfant voit son papa et sa maman séparément, encodez-en deux.</p>
    <div class="tableau-enveloppe">
      <table>
        <thead><tr>
          <th>Enfant</th><th>Rencontre avec</th><th>Fréquence</th><th class="num">Fin du droit</th>
          <th>Statut</th><th class="num">Rencontres</th><th>Dernière</th><th></th>
        </tr></thead>
        <tbody>${lignes || '<tr><td colspan="8" class="vide">Aucun droit de visite encodé.</td></tr>'}</tbody>
      </table>
    </div>
  </div>

  <div class="carte">
    <h2>Dernières rencontres</h2>
    ${recentes.length ? '<ul class="liste">' + recentes.map(o => {
      const p = presenceDe(o.rencontre);
      return `<li>
        <span class="d nowrap" style="min-width:104px;font-weight:600;font-size:13px">${ech(fmtFR(o.rencontre.date))}</span>
        <span class="et ${p.code}" style="min-width:76px;text-align:center">${ech(p.court)}</span>
        <span style="flex:1">
          ${lienEnfant(o.enfant)} <span class="doux pt">· ${ech(libelleParent(o.visite))}</span>
          ${o.rencontre.note ? '<br><span class="pt" style="white-space:pre-wrap">' + ech(o.rencontre.note) + "</span>"
                             : '<br><span class="pt doux">Pas de note</span>'}
        </span>
        <button class="b mini" data-action="rencontre-modifier" data-id="${o.enfant.id}"
                data-vid="${o.visite.id}" data-rid="${o.rencontre.id}">Modifier</button>
      </li>`;
    }).join("") + "</ul>" : '<p class="doux">Aucune rencontre encodée pour le moment.</p>'}
  </div>`;
}

   11. VUE — Tâches
   ========================================================================= */

function ligneTache(t){
  const cls = t.enRetard ? "rouge" : (t.pourAuj ? "orange" : "gris");
  return `<li>
    <input type="checkbox" data-action="tache-bascule" data-id="${t.id}" ${t.fait?"checked":""}
           style="width:auto;margin-top:3px" aria-label="Terminer">
    <div style="flex:1">
      <span class="${t.fait?"tache-faite":""}">${ech(t.texte)}</span>
      ${t.enfantId && enfantParId(t.enfantId)
        ? '<span class="doux pt"> · ' + ech(nomComplet(enfantParId(t.enfantId))) + "</span>" : ""}
      ${estISO(t.echeance) && !t.fait
        ? '<br><span class="et ' + cls + '">' +
          (t.enRetard ? "En retard — " : (t.pourAuj ? "Aujourd'hui — " : "")) + ech(fmtFR(t.echeance)) + "</span>" : ""}
    </div>
    <div class="actions">
      <button class="b mini" data-action="tache-modifier" data-id="${t.id}">Modifier</button>
      <button class="b mini danger" data-action="tache-supprimer" data-id="${t.id}">✕</button>
    </div>
  </li>`;
}

function vueTaches(){
  const enCours = tachesEnCours();
  const faites = DB.taches.filter(t => t.fait)
    .sort((a,b) => String(b.faitLe||"").localeCompare(String(a.faitLe||"")));
  const groupes = [
    ["En retard",   enCours.filter(t => t.enRetard)],
    ["Aujourd'hui", enCours.filter(t => t.pourAuj)],
    ["À venir",     enCours.filter(t => estISO(t.echeance) && t.echeance > aujourdHui())],
    ["Sans date",   enCours.filter(t => !estISO(t.echeance))]
  ];
  return `
  <div class="carte">
    <div class="barre-outils">
      <button class="b primaire" data-action="tache-nouvelle">+ Nouvelle tâche</button>
      <span class="pousse doux pt">${pluriel(enCours.length,"tâche")} en cours · ${faites.length} terminée(s)</span>
      <button class="b" data-action="taches-basculer-faites">${etat.tachesFaites?"Masquer":"Afficher"} les tâches faites</button>
      <button class="b" onclick="window.print()">Imprimer</button>
    </div>
    ${groupes.map(([t,l]) => l.length
      ? '<h3 style="margin-top:14px">' + t + " (" + l.length + ')</h3><ul class="liste">' +
        l.map(ligneTache).join("") + "</ul>" : "").join("")
      || '<p class="doux">Aucune tâche en cours.</p>'}
    ${etat.tachesFaites && faites.length
      ? '<h3 style="margin-top:18px">Terminées</h3><ul class="liste">' + faites.map(ligneTache).join("") +
        '</ul><button class="b danger" style="margin-top:10px" data-action="taches-purger">Supprimer les tâches terminées</button>'
      : ""}
  </div>`;
}

  if(NATIF){
    if(FS.erreur) return `<div class="encadre souci">
      <div class="titre">L'enregistrement ne fonctionne pas</div>
      ${ech(FS.erreur)}<br>Dossier visé : <code>${ech(FS.chemin)}</code><br>

      <div class="actions" style="margin-top:10px">
        <button class="b primaire" data-action="fs-choisir">Changer de dossier</button>
        <button class="b" data-action="fs-maintenant">Réessayer</button></div></div>`;
    return `<div class="encadre ok">
      <div class="titre">✓ Enregistrement automatique</div>
      Chaque modification est écrite immédiatement dans :<br>
      <code>${ech(FS.chemin)}\\${NOM_FICHIER}</code><br>
      ${FS.dernier ? "Dernier enregistrement à " + heureCourte(FS.dernier) + "."
                   : "Aucune modification depuis l'ouverture."}
      Une copie datée est déposée chaque jour dans <code>${DOSSIER_SAUV}</code>
      (${NB_SAUVEGARDES} derniers jours conservés).
      <div class="actions" style="margin-top:10px">
        <button class="b" data-action="fs-ouvrir">Ouvrir le dossier</button>
        <button class="b" data-action="fs-maintenant">Enregistrer maintenant</button>
        <button class="b" data-action="fs-relire">Recharger depuis le fichier</button>
        <button class="b" data-action="fs-choisir">Changer de dossier</button>
      </div></div>`;
  }
  if(!FS.dispo) return `<div class="encadre attention">
    <div class="titre">Ce navigateur n'écrit pas sur le disque</div>
    Vos données sont conservées dans le navigateur uniquement. Pour un enregistrement dans un vrai
    fichier, ouvrez ce programme avec <b>Google Chrome</b> ou <b>Microsoft Edge</b>. En attendant,
    exportez une sauvegarde régulièrement.</div>`;
  if(FS.erreur) return `<div class="encadre souci">
    <div class="titre">L'enregistrement dans le fichier ne fonctionne plus</div>
    ${ech(FS.erreur)}<br>Le dossier a peut-être été déplacé, renommé ou supprimé. Vos données sont
    toujours dans le navigateur : choisissez à nouveau un dossier.
    <div class="actions" style="margin-top:10px">
      <button class="b primaire" data-action="fs-choisir">Choisir un dossier</button></div></div>`;
  if(FS.dossier) return `<div class="encadre ok">
    <div class="titre">✓ Enregistrement automatique sur le disque</div>
    Dossier : <b>${ech(FS.nom)}</b> · fichier <code>${NOM_FICHIER}</code><br>
    ${FS.dernier ? "Dernier enregistrement à " + heureCourte(FS.dernier) + "."
                 : "Aucune modification depuis l'ouverture."}
    Une copie datée est déposée chaque jour dans le sous-dossier <code>${DOSSIER_SAUV}</code>
    (${NB_SAUVEGARDES} derniers jours conservés).
    <div class="actions" style="margin-top:10px">
      <button class="b" data-action="fs-maintenant">Enregistrer maintenant</button>
      <button class="b" data-action="fs-relire">Recharger depuis le fichier</button>
      <button class="b" data-action="fs-choisir">Changer de dossier</button>
      <button class="b" data-action="fs-oublier">Se déconnecter</button>
    </div></div>`;
  if(FS.enAttente) return `<div class="encadre attention">
    <div class="titre">Dossier à reconnecter</div>
    Le dossier <b>${ech(FS.nom)}</b> a déjà été utilisé. Pour des raisons de sécurité, le navigateur
    demande votre accord à chaque nouvelle ouverture.
    <div class="actions" style="margin-top:10px">
      <button class="b primaire" data-action="fs-reconnecter">Reconnecter ce dossier</button>
      <button class="b" data-action="fs-choisir">Choisir un autre dossier</button></div></div>`;

let soumission = null, annulation = null;

function ouvrirModale(titre, corps, onValider, largeur, onAnnuler){
  soumission = onValider;
  annulation = onAnnuler || null;
  document.getElementById("zone-modale").innerHTML = `
    <div class="voile" data-fermer="1">
      <form class="modale" id="form-modale" ${largeur ? 'style="max-width:'+largeur+'px"' : ""}>
        <header><h2>${ech(titre)}</h2></header>
        <div class="corps">${corps}</div>
        <div class="pied">
          <button type="button" class="b" data-fermer="1">Annuler</button>
          <button type="submit" class="b primaire">Enregistrer</button>
        </div>
      </form>
    </div>`;
  const f = document.getElementById("form-modale");
  f.addEventListener("submit", ev => {
    ev.preventDefault();
    if(soumission && soumission(f) !== false){ annulation = null; fermerModale(); }
  });
  const prem = f.querySelector("input,select,textarea");
  if(prem) prem.focus();
}
function fermerModale(){
  const retour = annulation;
  soumission = null; annulation = null;
  document.getElementById("zone-modale").innerHTML = "";
  if(retour) retour();
}

const coche = (f,n) => { const e = f.elements[n]; return !!(e && e.checked); };

/* =========================================================================
   14. EXPORT WORD (.docx écrit à la main : un .docx est un fichier ZIP)
   ========================================================================= */

const TABLE_CRC = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){
    let c = n;
    for(let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i = 0; i < u8.length; i++) c = TABLE_CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
/** Archive ZIP sans compression — suffisant et lisible par Word. */
function zipCreer(entrees){
  const enc = new TextEncoder();
  const morceaux = [], central = [];
  let position = 0;
  entrees.forEach(e => {
    const nom = enc.encode(e.nom);
    const data = e.contenu;
    const crc = crc32(data);
    const entete = new Uint8Array(30 + nom.length);
    const v = new DataView(entete.buffer);
    v.setUint32(0, 0x04034b50, true); v.setUint16(4, 20, true); v.setUint16(6, 0, true);
    v.setUint16(8, 0, true); v.setUint16(10, 0, true); v.setUint16(12, 0x21, true);
    v.setUint32(14, crc, true); v.setUint32(18, data.length, true); v.setUint32(22, data.length, true);
    v.setUint16(26, nom.length, true); v.setUint16(28, 0, true);
    entete.set(nom, 30);

    const fiche = new Uint8Array(46 + nom.length);
    const c = new DataView(fiche.buffer);
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true);
    c.setUint16(8, 0, true); c.setUint16(10, 0, true); c.setUint16(12, 0, true); c.setUint16(14, 0x21, true);
    c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
    c.setUint16(28, nom.length, true); c.setUint32(42, position, true);
    fiche.set(nom, 46);

    morceaux.push(entete, data); central.push(fiche);
    position += entete.length + data.length;
  });
  const tailleCentral = central.reduce((s,x) => s + x.length, 0);
  const fin = new Uint8Array(22);
  const f = new DataView(fin.buffer);
  f.setUint32(0, 0x06054b50, true);
  f.setUint16(8, entrees.length, true); f.setUint16(10, entrees.length, true);
  f.setUint32(12, tailleCentral, true); f.setUint32(16, position, true);

  const total = morceaux.concat(central, [fin]);
  const taille = total.reduce((s,x) => s + x.length, 0);
  const sortie = new Uint8Array(taille);
  let o = 0;
  total.forEach(x => { sortie.set(x, o); o += x.length; });
  return sortie;
}

const xml = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;").replace(/'/g,"&apos;")
  .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");   // caractères de contrôle interdits en XML

/** Un paragraphe Word ; le texte est coupé aux retours à la ligne. */
function par(texte, opts){
  const o = opts || {};
  const taille = o.taille || 22;                       // demi-points
  const rpr = "<w:rPr>" + (o.gras ? "<w:b/>" : "") + (o.italique ? "<w:i/>" : "") +
              '<w:sz w:val="' + taille + '"/><w:szCs w:val="' + taille + '"/>' +
              (o.couleur ? '<w:color w:val="' + o.couleur + '"/>' : "") + "</w:rPr>";
  const lignes = String(texte == null ? "" : texte).split(/\r?\n/);
  const runs = lignes.map((l,i) =>
    "<w:r>" + rpr + (i ? "<w:br/>" : "") + '<w:t xml:space="preserve">' + xml(l) + "</w:t></w:r>").join("");
  const ppr = "<w:pPr>" +
    '<w:spacing w:before="' + (o.avant || 0) + '" w:after="' + (o.apres == null ? 100 : o.apres) + '"/>' +
    (o.bordure ? '<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="2" w:color="AAAAAA"/></w:pBdr>' : "") +
    (o.retrait ? '<w:ind w:left="' + o.retrait + '"/>' : "") + "</w:pPr>";
  return "<w:p>" + ppr + runs + "</w:p>";
}

function docxCreer(corpsXml, titre){
  const enc = new TextEncoder();
  const maintenant = new Date().toISOString().replace(/\.\d+Z$/, "Z");
  const NS = "http://schemas.openxmlformats.org/";

  const types = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Types xmlns="' + NS + 'package/2006/content-types">' +
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
    '<Default Extension="xml" ContentType="application/xml"/>' +
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
    '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>' +
    "</Types>";

  const rels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="' + NS + 'package/2006/relationships">' +
    '<Relationship Id="rId1" Type="' + NS + 'officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
    '<Relationship Id="rId2" Type="' + NS + 'package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>' +
    "</Relationships>";

  const relsDoc = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<Relationships xmlns="' + NS + 'package/2006/relationships"/>';

  const props = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<cp:coreProperties xmlns:cp="' + NS + 'package/2006/metadata/core-properties"' +
    ' xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/"' +
    ' xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">' +
    "<dc:title>" + xml(titre || "Notes de visites") + "</dc:title>" +
    "<dc:creator>Gestion de mes dossiers</dc:creator>" +
    "<cp:lastModifiedBy>Gestion de mes dossiers</cp:lastModifiedBy>" +
    '<dcterms:created xsi:type="dcterms:W3CDTF">' + maintenant + "</dcterms:created>" +
    '<dcterms:modified xsi:type="dcterms:W3CDTF">' + maintenant + "</dcterms:modified>" +
    "</cp:coreProperties>";

  const doc = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
    '<w:document xmlns:w="' + NS + 'wordprocessingml/2006/main"><w:body>' +
    corpsXml +
    '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>' +
    '<w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="709" w:footer="709"/>' +
    "</w:sectPr></w:body></w:document>";

  return zipCreer([
    { nom:"[Content_Types].xml",           contenu:enc.encode(types)   },
    { nom:"_rels/.rels",                   contenu:enc.encode(rels)    },
    { nom:"docProps/core.xml",             contenu:enc.encode(props)   },
    { nom:"word/_rels/document.xml.rels",  contenu:enc.encode(relsDoc) },
    { nom:"word/document.xml",             contenu:enc.encode(doc)     }
  ]);
}

/** Construit le document des notes de visite. */
function docxVisites(enfants, du, au, toutInclure){
  const dans = d => (!du || d >= du) && (!au || d <= au);
  if(!toutInclure){
    enfants = enfants.filter(e =>
      (e.visites||[]).some(v => (v.rencontres||[]).some(r => dans(r.date))));
  }
  let corps = "";
  corps += par("Notes de visites", { gras:true, taille:34, apres:40 });
  corps += par("Document généré le " + fmtLong(aujourdHui()) +
               (du || au ? " — période du " + (du ? fmtFR(du) : "début") + " au " + (au ? fmtFR(au) : "aujourd'hui") : ""),
               { italique:true, taille:18, couleur:"666666", apres:220, bordure:true });

  let total = 0;
  enfants.slice().sort(parNom).forEach(e => {
    const visites = (e.visites||[]).filter(v => (v.rencontres||[]).some(r => dans(r.date)));
    corps += par(nomComplet(e) + (e.service ? "  —  " + e.service : ""),
                 { gras:true, taille:28, avant:240, apres:60, bordure:true });
    if(!visites.length){
      corps += par("Aucune rencontre encodée sur la période.", { italique:true, taille:20, couleur:"666666" });
      return;
    }
    visites.forEach(v => {
      const renc = (v.rencontres||[]).filter(r => dans(r.date))
        .sort((a,b) => String(a.date).localeCompare(String(b.date)));
      const venus = renc.filter(r => r.presence === "venu").length;
      const absents = renc.filter(r => r.presence === "absent").length;
      const annulees = renc.filter(r => r.presence === "annulee").length;
      corps += par("Rencontres avec " + libelleParent(v) +
                   (v.frequence ? "  (" + v.frequence + ")" : ""),
                   { gras:true, taille:24, avant:160, apres:40 });
      corps += par(pluriel(renc.length,"rencontre") + " : " + venus + " honorée(s), " +
                   absents + " manquée(s)" + (annulees ? ", " + annulees + " annulée(s)" : "") +
                   (v.suspendu ? " — droit suspendu" + (estISO(v.suspenduDepuis) ? " depuis le " +
                     fmtFR(v.suspenduDepuis) : "") : ""),
                   { italique:true, taille:19, couleur:"666666", apres:80 });
      renc.forEach(r => {
        total++;
        corps += par(fmtLong(r.date) + "  —  " + presenceDe(r).label,
                     { gras:true, taille:20, avant:80, apres:20 });
        corps += par(r.note || "(pas de note)", { taille:21, retrait:283, apres:60 });
      });
    });
  });
  if(!total) corps += par("Aucune rencontre ne correspond à la période choisie.",
                          { italique:true, couleur:"666666" });
  return docxCreer(corps, "Notes de visites" +
    (enfants.length === 1 ? " — " + nomComplet(enfants[0]) : ""));
}

function formExportWord(enfantUnique){
  const corps = `
    <p class="pt doux" style="margin-top:0">
      ${enfantUnique ? "Notes de visite de <b>" + ech(nomComplet(enfantUnique)) + "</b>."
                     : "Notes de visite de tous les enfants, un chapitre par enfant."}</p>
    <div class="ligne c2">
      <label class="champ"><span>À partir du (facultatif)</span><input type="date" name="du"></label>
      <label class="champ"><span>Jusqu'au (facultatif)</span><input type="date" name="au"></label>
    </div>
    <p class="aide">Laissez vide pour reprendre toutes les rencontres encodées.</p>
    ${enfantUnique ? "" : `<label class="champ" style="display:flex;gap:8px;align-items:center;margin-top:8px">
      <input type="checkbox" name="tous" style="width:auto">
      <span style="margin:0">Inclure aussi les enfants sans rencontre sur la période</span></label>`}`;
  ouvrirModale("Exporter les notes en Word", corps, f => {
    const du = val(f,"du"), au = val(f,"au");
    const enfants = enfantUnique ? [enfantUnique] : DB.enfants;
    const data = docxVisites(enfants, du, au, enfantUnique ? true : coche(f,"tous"));
    const nom = "notes-visites-" + (enfantUnique
      ? nomComplet(enfantUnique).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")
      : "tous") + "-" + aujourdHui() + ".docx";
    telecharger(nom, data,
      "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
      "Document Word");
  }, 520);
}

/* =========================================================================

function telecharger(nom, contenu, type, description){
  if(NATIF){
    window.programme.enregistrerSous(nom, contenu, description).then(r => {
      if(r && r.erreur) alert("Enregistrement impossible : " + r.erreur);
    });
    return;
  }
  const blob = new Blob([contenu], { type: type || "application/json;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/** Applique une sauvegarde relue depuis un fichier. */
function appliquerImport(texte){
  try{
    const d = JSON.parse(texte);
    if(!d || !Array.isArray(d.enfants)) throw new Error("fichier non reconnu");
    if(!confirm("Remplacer toutes les données actuelles par celles du fichier ?")) return;
    DB = normaliser(d);
    maj();
    alert("Sauvegarde restaurée." + (FS.dossier ? " Le fichier de travail a été mis à jour." : ""));
  }catch(e){ alert("Fichier illisible : " + e.message); }
}
function importerSauvegarde(){
  if(NATIF){
    window.programme.choisirFichier().then(r => { if(r && r.ok) appliquerImport(r.contenu); });
    return;
  }
  document.getElementById("fichier-import").click();
}
function csv(lignes){
  const e = v => '"' + String(v == null ? "" : v).replace(/"/g,'""') + '"';
  // ﻿ = marque d'ordre d'octets : Excel reconnait alors l'UTF-8 (accents corrects)
  return "﻿" + lignes.map(l => l.map(e).join(";")).join("\r\n");
}
const dt = s => estISO(s) ? fmtFR(s) : "";

function exportCsvEnfants(){
  const l = [["Prénom","Nom","Service","Naissance","Formalisation","Statut notification","Relances",
              "Rapport semestriel","Rapport annuel","Droits de visite","Notes"]];
  DB.enfants.slice().sort(parNom).forEach(e => l.push([
    e.prenom, e.nom, e.service, dt(e.naissance), dt(e.notifFin), statutNotif(e).label,
    (e.relances||[]).map(fmtFR).join(" / "),
    dt(echeanceRapport(e,"semestriel")), dt(echeanceRapport(e,"annuel")),
    (e.visites||[]).map(v => libelleParent(v) + (v.frequence ? " : " + v.frequence : "") +
      (estISO(v.dateFin) ? " jusqu'au " + fmtFR(v.dateFin) : "") + (v.suspendu ? " (suspendu)" : "")).join(" / "),
    e.notes]));
  telecharger("dossiers-" + aujourdHui() + ".csv", csv(l), "text/csv;charset=utf-8", "Tableur CSV");
}
function exportCsvRapports(){
  const l = [["Échéance","Mois","Type","Enfant","Service"]];
  const lignes = [];
  DB.enfants.forEach(e => ["annuel","semestriel"].forEach(t => {
    const d = echeanceRapport(e,t);
    if(d) lignes.push([d, fmtMoisAnnee(d), t === "annuel" ? "Formalisation / annuel" : "Évolution / semestriel",
                       nomComplet(e), e.service]);
  }));
  lignes.sort((a,b) => a[0].localeCompare(b[0]));
  lignes.forEach(x => l.push([fmtFR(x[0]), x[1], x[2], x[3], x[4]]));
  telecharger("rapports-" + aujourdHui() + ".csv", csv(l), "text/csv;charset=utf-8", "Tableur CSV");
}

document.getElementById("fichier-import").addEventListener("change", function(){
  const f = this.files && this.files[0];
  if(!f) return;
  const lect = new FileReader();
  lect.onload = () => appliquerImport(lect.result);
  lect.readAsText(f);
  this.value = "";
});

document.getElementById("vue").addEventListener("click", ev => {
  const b = ev.target.closest("[data-action]");
  if(!b) return;
  const id = b.dataset.id, vid = b.dataset.vid, rid = b.dataset.rid;
  const e = id ? enfantParId(id) : null;
  const v = (e && vid) ? (e.visites||[]).find(x => x.id === vid) : null;

  switch(b.dataset.action){
    /* --- navigation --- */
    case "fiche": etat.ficheId = id; onglet = "fiche"; rendre(); break;
    case "retour-enfants": onglet = "enfants"; rendre(); break;
    case "annee":
      etat.anneeRapports = b.dataset.delta === "0" ? 0 : etat.anneeRapports + Number(b.dataset.delta);
      rendre();
      break;

    /* --- enfants --- */
    case "enfant-nouveau":  formEnfant(null); break;
    case "enfant-modifier": formEnfant(e); break;
    case "enfant-supprimer":
      if(confirm("Supprimer définitivement le dossier de " + nomComplet(e) +
                 " , ses rencontres et ses notes ?")){
        DB.enfants = DB.enfants.filter(x => x.id !== id);
        DB.taches.forEach(t => { if(t.enfantId === id) t.enfantId = ""; });
        onglet = "enfants";
        maj();
      }
      break;

    /* --- notification --- */
    case "relance": {
      const auj = aujourdHui();
      e.relances = e.relances || [];
      if(e.relances.includes(auj)){ alert("Une relance est déjà notée pour aujourd'hui."); break; }
      e.relances.push(auj); e.relances.sort();
      maj();
      break;
    }
    case "relance-suppr":
      e.relances = (e.relances||[]).filter(d => d !== b.dataset.date);
      maj();
      break;
    case "reconduire": {
      if(!estISO(e.notifFin)){
        alert("Encodez d'abord une date de formalisation pour " + nomComplet(e) + ".");
        break;
      }
      const nouvelle = decalerAns(e.notifFin, 1);
      if(!confirm("Reconduire la notification de " + nomComplet(e) + " du " + fmtFR(e.notifFin) +
                  " au " + fmtFR(nouvelle) + " ?")) break;
      e.historique = e.historique || [];
      e.historique.push(e.notifFin);
      e.notifFin = nouvelle;
      e.relances = [];
      maj();
      break;
    }

    /* --- rapports --- */
    case "rapport-envoye": {
      const type = b.dataset.type;
      const d = echeanceRapport(e, type);
      if(!d) break;
      if(!confirm("Noter le rapport " + (type === "annuel" ? "annuel" : "semestriel") + " de " +
                  nomComplet(e) + " (échéance " + fmtFR(d) + ") comme envoyé aujourd'hui ?")) break;
      e.rapports = e.rapports || [];
      e.rapports.push({ id:uid(), type, echeance:d, envoyeLe:aujourdHui() });
      maj();
      break;
    }
    case "rapport-annuler":
      e.rapports = (e.rapports||[]).filter(r => r.id !== rid);
      maj();
      break;

    /* --- droits de visite --- */
    case "visite-nouvelle":  formVisite(e, null); break;
    case "visite-modifier":  formVisite(e, v); break;
    case "visite-supprimer":
      if(confirm("Supprimer le droit de visite « " + libelleParent(v) + " » de " + nomComplet(e) +
                 " et ses " + pluriel((v.rencontres||[]).length,"rencontre") + " ?")){
        e.visites = e.visites.filter(x => x.id !== vid);
        maj();
      }
      break;

    /* --- rencontres --- */
    case "rencontre-nouvelle": formRencontre(e, v, null); break;
    case "rencontre-modifier": formRencontre(e, v, (v.rencontres||[]).find(x => x.id === rid)); break;
    case "rencontre-supprimer":
      if(confirm("Supprimer cette rencontre et sa note ?")){
        v.rencontres = v.rencontres.filter(x => x.id !== rid);
        maj();
      }
      break;

    /* --- Word --- */
    case "word-enfant": formExportWord(e); break;
    case "word-tous":   formExportWord(null); break;

    /* --- tâches --- */
    case "tache-nouvelle": formTache(null); break;
    case "tache-modifier": formTache(DB.taches.find(t => t.id === id)); break;
    case "tache-supprimer": DB.taches = DB.taches.filter(t => t.id !== id); maj(); break;
    case "tache-bascule": {
      const t = DB.taches.find(x => x.id === id);
      t.fait = !t.fait; t.faitLe = t.fait ? aujourdHui() : "";
      maj();
      break;
    }
    case "taches-basculer-faites": etat.tachesFaites = !etat.tachesFaites; rendre(); break;
    case "taches-purger":
      if(confirm("Supprimer toutes les tâches terminées ?")){
        DB.taches = DB.taches.filter(t => !t.fait); maj();
      }
      break;

    /* --- enregistrement disque --- */
    case "fs-choisir":
      (NATIF ? natifChangerDossier() : fsChoisir().then(rendre));
      break;
    case "fs-ouvrir":      window.programme.ouvrirDossier(); break;
    case "fs-reconnecter": fsReconnecter(false).then(rendre); break;
    case "fs-maintenant":
      fsEcrire().then(() => fsSauvegardeDuJour(JSON.stringify(DB,null,2), true)).then(rendre);
      break;
    case "fs-relire":
      if(confirm("Recharger les données depuis le fichier du disque ? Les modifications non " +
                 "encore enregistrées seront perdues.")){
        if(NATIF){ natifRelire(); }
        else { DB.initial = true; fsLire().then(rendre); }
      }
      break;
    case "fs-oublier":
      if(confirm("Ne plus enregistrer dans ce dossier ? Le fichier existant n'est pas supprimé.")){
        FS.dossier = null; FS.enAttente = null; FS.nom = ""; FS.dernier = null; FS.erreur = "";
        idbEffacer("dossier").then(rendre);
      }
      break;

    /* --- données --- */
    case "params-enregistrer": {
      const s = Number(document.getElementById("p-seuil").value);
      const r = Number(document.getElementById("p-rapport").value);
      DB.parametres.seuilAlerteJours  = (s > 0 && s < 400) ? s : 30;
      DB.parametres.seuilRapportJours = (r > 0 && r < 400) ? r : 45;
      maj();
      alert("Paramètres enregistrés.");
      break;
    }
    case "export-json":
      telecharger("sauvegarde-dossiers-" + aujourdHui() + ".json", JSON.stringify(DB,null,2),
                  null, "Sauvegarde");
      break;
    case "import-json": importerSauvegarde(); break;
    case "export-csv-enfants":  exportCsvEnfants(); break;
    case "export-csv-rapports": exportCsvRapports(); break;
    case "tout-effacer":
      if(confirm("Effacer TOUTES les données ? Exportez d'abord une sauvegarde si nécessaire.") &&
         confirm("Confirmez-vous définitivement l'effacement ?")){
        DB = baseVide(); onglet = "enfants"; maj();
      }
      break;
    case "recharger-exemple":
      if(confirm("Remplacer les données actuelles par les données de départ (vos deux tableaux Excel) ?")){
        DB = donneesInitiales(); onglet = "tableau"; maj();
      }
      break;
  }
});
