<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion des dossiers</title>
<style>
:root{
  /* Les couleurs du logo du Service Familles d'Accueil. Le prune du sol et
     du mot « Service » est la couleur d'action : boutons, liens, sélection,
     titre de page. Le jaune et l'orange du toit et du soleil réchauffent le
     fond et la barre latérale, sans jamais servir d'alerte. Le gris de
     « Familles d'Accueil » est celui des textes secondaires. Le rouge,
     l'orange et le vert restent réservés à l'état des dossiers : une couleur
     de la marque ne doit pas pouvoir passer pour une alerte. */
  --fond:#f8f5f1; --carte:#ffffff; --texte:#2b2a2c; --doux:#636366; --bord:#e6dfd6;
  --accent:#9c1c5b; --accent-doux:#f7e8ef;
  --cote:#fcf3e8; --cote-actif:#ffffff; --cote-bord:#eedcc5;
  /* bord d'un champ de saisie : 3:1 au moins, sinon on ne voit pas où taper */
  --bord-champ:#8f8a84; --bord-bouton:#d3cbc1;
  --vert:#1c7a4b; --vert-f:#e6f2eb;
  /* Orange assombri : sur l'ancien, « Renouvellement proche » tombait à
     4,0:1, sous le seuil AA. */
  --orange:#a8590b; --orange-f:#fdf3e8;
  --rouge:#b3312c; --rouge-f:#fbeae9;
  --gris:#636366; --gris-f:#f2eee9;
  --violet:#6a4ba8; --violet-f:#efeaf8;
  /* catégories d'intervenant : le rose de la porte pour Maman, distinct du
     prune des boutons */
  --papa:#2f6db5; --maman:#d2426f; --maman-f:#fbe9ef;
  /* Encre posée sur un aplat de couleur (bouton plein, étiquette active).
     En thème clair les aplats sont sombres, en thème sombre ils sont clairs :
     le blanc ne convient pas aux deux. */
  --sur-aplat:#ffffff;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root{
    --fond:#191718; --carte:#221f21; --texte:#edeaeb; --doux:#aba6a9; --bord:#38323a;
    --accent:#e58ab4; --accent-doux:#3a2230;
    --cote:#1e1a1c; --cote-actif:#2c272a; --cote-bord:#38323a;
    --bord-champ:#776f75; --bord-bouton:#4a434a;
    --vert:#6ad39a; --vert-f:#172f22;
    --orange:#e8ac62; --orange-f:#33291a;
    --rouge:#ef8e87; --rouge-f:#341f1e;
    --gris:#aba6a9; --gris-f:#2c272a;
    --violet:#b7a0e8; --violet-f:#272040;
    --papa:#86b3e8; --maman:#f08fb0; --maman-f:#3a2029;
    --sur-aplat:#1a0f14;
  }
}
*{box-sizing:border-box}
/* La police de Windows, celle de tous les autres programmes du poste.
   Chiffres de largeur fixe : les dates s'alignent d'une ligne à l'autre.
   (« font-variant-numeric » après le raccourci « font », qui le remet à zéro.) */
body{margin:0;background:var(--fond);color:var(--texte);
  font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums}
h1{font-size:21px;font-weight:600;margin:0;line-height:1.25;color:var(--accent)}
h2{font-size:15px;font-weight:600;margin:0 0 12px;line-height:1.3}
h3{font-size:13px;font-weight:600;color:var(--doux);margin:0 0 6px}
svg{flex:none}

/* ---------- Ossature ---------- */
.appli{display:flex;min-height:100vh}
/* Barre de navigation claire, comme le volet de l'Explorateur ou d'Outlook :
   elle se fait oublier, l'œil va au contenu. */
.cote{width:220px;flex:none;background:var(--cote);color:var(--texte);border-right:1px solid var(--cote-bord);
  display:flex;flex-direction:column;padding:16px 10px;position:sticky;top:0;height:100vh}
/* L'en-tête reprend le mot-symbole du logo : « Service » en prune, au-dessus
   du nom, en gris. */
.marque{padding:2px 10px 16px}
.marque .service{display:block;font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.marque .nom{display:block;font-weight:600;font-size:14.5px;color:var(--texte);line-height:1.25}
.marque .role{display:block;font-size:12px;color:var(--doux)}
.cote nav{display:flex;flex-direction:column;gap:2px}
.cote nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:none;border:1px solid transparent;color:var(--texte);font:inherit;font-size:14px;
  padding:7px 10px;border-radius:var(--r);cursor:pointer}
.cote nav button svg{color:var(--doux)}
.cote nav button:hover{background:rgba(120,70,20,.06)}
.cote nav button.actif{background:var(--cote-actif);border-color:var(--cote-bord);font-weight:600;color:var(--accent)}
.cote nav button.actif svg{color:var(--accent)}
.cote nav .compte{margin-left:auto;background:var(--rouge);color:var(--sur-aplat);font-size:11px;
  font-weight:700;min-width:18px;padding:0 5px;line-height:18px;text-align:center;border-radius:9px}
.cote .bas{margin-top:auto;padding-top:10px;border-top:1px solid var(--cote-bord)}
.date-cote{display:block;padding:0 10px 8px;font-size:12px;color:var(--doux)}

.principal{flex:1;min-width:0;display:flex;flex-direction:column}
.entete{padding:18px 28px 6px;display:flex;justify-content:space-between;align-items:center;
  gap:16px;flex-wrap:wrap}
.entete p{margin:4px 0 0;color:var(--doux);font-size:13.5px}
.entete p:empty{display:none}
.entete-droite{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.stockage{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--doux)}
.stockage b{color:var(--texte);font-weight:600}
main{padding:10px 28px 28px;flex:1}

@media(max-width:900px){
  .appli{flex-direction:column}
  .cote{width:auto;height:auto;position:static;flex-direction:row;align-items:center;
    gap:10px;padding:8px 10px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bord)}
  .marque{padding:0 6px}
  .marque .role,.date-cote{display:none}
  .cote nav{flex-direction:row;gap:2px}
  .cote nav button span.lib{display:none}
  .cote .bas{margin:0 0 0 auto;padding:0;border:0}
  .entete,main{padding-left:16px;padding-right:16px}
}

/* ---------- Panneaux ---------- */
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:var(--r);padding:16px}
.carte + .carte{margin-top:14px}
/* dans une grille, c'est l'espacement de la grille qui compte : sans ceci,
   le deuxième et le troisième panneau descendaient de 14 px */
.grille > .carte + .carte{margin-top:0}
.carte .tete{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.carte .tete h2{margin:0;flex:1}
.grille{display:grid;gap:14px;align-items:start}
/* Accueil : sur une fenêtre courte, c'est la liste d'un panneau qui défile,
   pas la page — l'aperçu du jour reste entier sous les yeux. */
@media(max-height:820px){
  .grille.g3 > .carte > ul.liste{max-height:calc(100vh - 330px);overflow-y:auto}
}
@media(min-width:1000px){
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
}

/* ---------- Barre de chiffres ----------
   Une seule bande, des cases séparées par un filet : on y lit des nombres,
   pas des cartes. Le chiffre ne prend de la couleur que s'il y a quelque
   chose à faire (rouge, orange) ; sinon il reste à l'encre normale. La case
   choisie comme filtre est soulignée, comme un onglet. */
.tuiles{display:flex;flex-wrap:wrap;background:var(--carte);border:1px solid var(--bord);
  border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.tuile{flex:1 1 160px;display:flex;align-items:baseline;gap:8px;background:none;border:0;
  border-left:1px solid var(--bord);padding:10px 14px;cursor:pointer;
  font:inherit;color:inherit;text-align:left;min-width:0}
.tuile:first-child{border-left:0}
.tuile:hover{background:var(--fond)}
.tuile.actif{background:var(--accent-doux);box-shadow:inset 0 -2px 0 var(--accent)}
.tuile .n{font-size:20px;font-weight:600;line-height:1.2}
.tuile .n.rouge{color:var(--rouge)} .tuile .n.orange{color:var(--orange)}
.tuile .n.zero{color:var(--doux);font-weight:400}
.tuile .t{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Listes ---------- */
ul.liste{list-style:none;margin:0;padding:0}
ul.liste li{padding:8px 0;border-top:1px solid var(--bord);display:flex;gap:10px;align-items:center}
ul.liste li:first-child{border-top:0;padding-top:0}
ul.liste li:last-child{padding-bottom:0}
input.coche{width:auto;margin:0}
label.coche-ligne{display:flex;gap:9px;align-items:flex-start}
label.coche-ligne>span{margin:0;font-size:14px;color:var(--texte)}
input.coche-tache{width:auto;margin:0}
select.tri-court{width:auto;margin-left:5px}
.pousse{margin-left:auto}
.lien{background:none;border:0;color:var(--accent);font:inherit;font-size:13.5px;cursor:pointer;
  padding:10px 0 0;display:inline-block}
.lien:hover{text-decoration:underline}
.rien{color:var(--doux);font-size:13.5px;padding:6px 0;margin:0}
.nom-enfant{font-weight:600}

/* ---------- Tableaux ----------
   En-têtes en casse normale : les capitales espacées sont une manie de
   tableau de bord, et se lisent moins vite. */
.tableau-enveloppe{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12.5px;font-weight:600;color:var(--doux);
  padding:7px 10px;border-bottom:1px solid var(--bord);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--bord);vertical-align:middle}
tbody tr:hover{background:var(--fond)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
.vide{padding:24px 10px;text-align:center;color:var(--doux)}

/* ---------- États ----------
   Un mot en couleur, sans pastille de fond : la couleur suffit à attirer
   l'œil sur ce qui presse, le mot dit de quoi il s'agit. */
.et{display:inline;font-size:13px;font-weight:600;white-space:nowrap}
.et.vert{color:var(--vert)} .et.orange{color:var(--orange)} .et.rouge{color:var(--rouge)}
.et.gris,.et.info{color:var(--doux);font-weight:400}
.puce{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.puce.vert{background:var(--vert)} .puce.orange{background:var(--orange)}
.puce.rouge{background:var(--rouge)} .puce.gris{background:var(--gris)}
.puce.info{background:var(--accent)}
.puce.papa{background:var(--papa)} .puce.maman{background:var(--maman)}
.puce.fratrie{background:var(--violet)} .puce.autre{background:var(--gris)}

/* ---------- Boutons ---------- */
button.b{display:inline-flex;align-items:center;gap:6px;background:var(--carte);color:var(--texte);
  border:1px solid var(--bord-bouton);border-radius:var(--r);padding:6px 12px;font:inherit;font-size:13.5px;cursor:pointer}
button.b:hover{background:var(--fond)}
button.b.primaire{background:var(--accent);border-color:var(--accent);color:var(--sur-aplat)}
button.b.primaire:hover{filter:brightness(1.1)}
button.b.danger{color:var(--rouge)}
button.b.danger:hover{background:var(--rouge-f)}
button.b.mini{padding:3px 9px;font-size:13px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
td .actions{flex-wrap:nowrap;justify-content:flex-end}
td:last-child{white-space:nowrap}
.barre{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}

/* ---------- Formulaires ---------- */
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{
  font:inherit;font-size:14px;padding:6px 9px;border:1px solid var(--bord-champ);border-radius:var(--r);
  background:var(--carte);color:var(--texte);width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
label.champ{display:block;margin-bottom:12px}
label.champ>span{display:block;font-size:12.5px;color:var(--doux);margin-bottom:4px}
.ligne{display:grid;gap:12px}
@media(min-width:560px){.ligne.c2{grid-template-columns:1fr 1fr}.ligne.c3{grid-template-columns:1fr 1fr 1fr}}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:6px;border:1px solid var(--bord);border-radius:var(--r);
  padding:7px 12px;cursor:pointer;font-size:13.5px}
.radios input{width:auto;margin:0}
.aide{font-size:12.5px;color:var(--doux);margin:5px 0 0}

/* ---------- Modale ---------- */
.voile{position:fixed;inset:0;background:rgba(20,22,25,.45);display:flex;align-items:flex-start;
  justify-content:center;padding:26px 14px;overflow:auto;z-index:100}
.modale{background:var(--carte);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.22);
  width:100%;max-width:620px;border:1px solid var(--bord)}
.modale header{padding:18px 20px 0}
.modale header h2{margin:0}
.modale .corps{padding:14px 20px}
.modale .pied{padding:14px 20px;border-top:1px solid var(--bord);display:flex;gap:8px;justify-content:flex-end}

/* ---------- Notifications ---------- */
/* Filtres : un sélecteur d'un seul tenant, comme dans les logiciels de
   bureau, plutôt qu'une rangée de pastilles arrondies. */
.filtres{display:inline-flex;flex-wrap:wrap;border:1px solid var(--bord-bouton);border-radius:var(--r);overflow:hidden}
.filtres button{border:0;border-left:1px solid var(--bord);background:var(--carte);color:var(--texte);
  padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.filtres button:first-child{border-left:0}
.filtres button:hover{background:var(--fond)}
.filtres button.actif{background:var(--accent-doux);color:var(--accent);font-weight:600}
.filtres .n{color:var(--doux);margin-left:3px}
.filtres button.actif .n{color:inherit}
/* État de la notification, dans sa colonne du tableau des dossiers */
.col-notif{min-width:212px}
.notif-etat{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.notif-etat.deux-lignes{display:flex}
.notif-etat.vert{color:var(--vert)} .notif-etat.orange{color:var(--orange)}
.notif-etat.rouge{color:var(--rouge)} .notif-etat.gris{color:var(--gris)}
.notif-etat .marque-etat{font-size:14px;line-height:1}
.col-notif .actions{justify-content:flex-start;flex-wrap:wrap}

/* Toutes les lignes à la même hauteur, quel que soit l'état du dossier : sans
   ce calage, une ligne « à réclamer » portait trois boutons et mesurait 105 px
   quand une ligne « en ordre » en mesurait 75. L'œil n'avait aucun repère. */
.tab-dossiers tbody tr{height:54px}
.tab-dossiers tbody td{padding-top:6px;padding-bottom:6px}
/* Largeurs posées à la main : sans elles, un détail de notification un peu
   long vole la place du nom, qui passe alors sur deux lignes et casse le
   rythme qu'on vient d'établir. */
.tab-dossiers{table-layout:fixed}
.tab-dossiers .col-enfant{width:24%}
.tab-dossiers .col-autorite{width:88px}
.tab-dossiers .col-notif{width:30%;min-width:0}
.tab-dossiers .col-echeance{width:132px}
/* Colonne d'actions de largeur fixe : ouvrir le menu « ⋯ » ne doit pas
   déplacer les colonnes de gauche. */
.tab-dossiers .col-actions{width:158px}
/* Deux lignes, jamais trois : au-delà, c'est l'info-bulle qui prend le relais. */
.deux-lignes{display:block;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.deux-lignes + .deux-lignes{margin-top:2px}

/* Une seule action pleine par ligne ; le reste sous « ⋯ ». Un <details> plutôt
   qu'un menu maison : le clavier y arrive sans rien ajouter. Échap, le clic
   ailleurs et « un seul ouvert à la fois » sont gérés en JS, plus bas. */
.plus{display:inline-block}
.plus>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;
  justify-content:center;min-width:30px;height:27px;border:1px solid var(--bord-bouton);
  border-radius:var(--r);background:var(--carte);color:var(--texte);font-size:15px;line-height:1}
.plus>summary::-webkit-details-marker{display:none}
.plus>summary::marker{content:""}
.plus>summary:hover{background:var(--fond)}
.plus[open]>summary{background:var(--accent-doux)}
/* Le menu ouvert : une liste de commandes, comme un menu Windows, pas une
   pile de boutons encadrés. */
.plus .menu{display:flex;flex-direction:column;margin-top:4px;padding:3px;min-width:170px;
  border:1px solid var(--bord-bouton);border-radius:var(--r);background:var(--carte);text-align:left}
.plus .menu button.b{justify-content:flex-start;width:100%;border:0;background:none;
  padding:5px 9px;border-radius:4px}
.plus .menu button.b:hover{background:var(--fond)}


/* ---------- Rapports : l'année civile ----------
   Deux tableaux côte à côte, janvier–juin et juillet–décembre, mois par mois.
   Un rapport envoyé reste à sa place avec sa date d'envoi : on voit d'un
   coup d'œil ce qui est fait dans l'année. */
.annee{display:grid;gap:22px;grid-template-columns:1fr;align-items:start}
@media(min-width:1100px){.annee{grid-template-columns:1fr 1fr}}
.tab-annee{table-layout:fixed}
.tab-annee th.case,.tab-annee td.case{width:30px;padding-right:0}
.tab-annee th.num,.tab-annee td.num{width:58px}
.tab-annee th:nth-child(4){width:90px}
.tab-annee th:nth-child(5){width:118px}
.tab-annee td{padding-top:5px;padding-bottom:5px}
.tab-annee td input{margin:0;width:auto}
.tab-annee .nom-rapport{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-annee tbody tr:last-child td{border-bottom:1px solid var(--bord)}
.tab-annee tr.mois-tete th{padding:12px 10px 5px;font-size:13.5px;color:var(--texte);
  border-bottom:1px solid var(--bord-champ)}
.tab-annee tbody:first-of-type tr.mois-tete th{padding-top:6px}
.tab-annee tr.mois-tete.courant th{color:var(--accent)}
.tab-annee tr.mois-tete:hover{background:none}
.tab-annee tr.mois-vide td{color:var(--doux);font-size:13px}
.tab-annee tr.avant td{color:var(--doux)}
.bilan{font-size:13.5px}

/* ---------- Droits de visite ---------- */
/* La liste des enfants à gauche, le dossier de celui qu'on a choisi à droite.
   La liste reste en place quand on fait défiler le dossier : on ne la perd
   plus de vue en descendant dans les rencontres. */
@media(min-width:1050px){
  .grille.dv{grid-template-columns:380px minmax(0,1fr);align-items:start}
  .dv-liste{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow-y:auto}
}
.dv-liste{padding:0}
.tab-enfants{table-layout:fixed;width:100%}
.tab-enfants th:nth-child(1){width:57%}
.tab-enfants td.num{font-size:13px}
.tab-enfants th{position:sticky;top:0;background:var(--carte);z-index:1}
.tab-enfants tbody tr{height:50px}
.tab-enfants td{padding:5px 10px}
.tab-enfants th{padding:8px 10px}
.tab-enfants tr.le{cursor:pointer}
.tab-enfants tr.le.actif,.tab-enfants tr.le.actif:hover{background:var(--accent-doux)}
.tab-enfants tr.le.actif .nom-enfant{color:var(--accent)}
.tab-enfants tr.le:focus{outline:2px solid var(--accent);outline-offset:-2px}
.lien-nom{background:none;border:0;padding:0;font:inherit;color:var(--accent);
  cursor:pointer;text-align:left}
.lien-nom:hover{text-decoration:underline}

.dv-tete{flex-wrap:wrap}
/* plus spécifique que « .carte .tete h2 », sinon le titre s'étire
   et pousse les boutons à la ligne */
.carte .tete.dv-tete h2{flex:0 1 auto;white-space:nowrap;font-size:17px}

/* Le bandeau de faits : ce qu'on veut savoir sans avoir à chercher. */
.faits{display:flex;flex-wrap:wrap;border:1px solid var(--bord);border-radius:var(--r);margin:0 0 4px}
.fait{flex:1 1 120px;padding:8px 12px;border-left:1px solid var(--bord)}
.fait:first-child{border-left:0}
.fait .l{display:block;font-size:12px;color:var(--doux)}
.fait .v{display:block;font-size:14px;font-weight:600}
.fait .s{display:block;font-size:12px;color:var(--doux)}

/* Titres de section dans le dossier : simples, alignés à gauche. */
h3.titre-section{font-size:14px;color:var(--texte);margin:18px 0 6px}
.tete-section{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0 8px}
.tete-section h3.titre-section{margin:0}
.tab-droits td{padding:6px 10px 6px 0;font-size:13.5px}
.tab-droits tbody tr:last-child td{border-bottom:1px solid var(--bord)}
.tab-droits tbody tr:hover{background:none}

/* Les rencontres : resserrées pour que tout entre sans barre horizontale. */
.tab-suivi td,.tab-suivi th{padding:7px 7px}
/* Le repère du jour sépare ce qui est à venir de ce qui est passé. */
.tab-suivi tr.repere-jour td{padding:5px 7px;font-size:12.5px;font-weight:600;color:var(--accent);
  border-top:2px solid var(--accent);border-bottom:1px solid var(--bord);background:var(--accent-doux)}
.tab-suivi tr.repere-jour:hover{background:none}

/* ---------- Schéma de récurrence ---------- */
.schema{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:620px){.schema{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.schema{grid-template-columns:repeat(5,1fr)}}
.sem{border:1px solid var(--bord);border-radius:var(--r);padding:10px 12px}

.bascule{display:inline-flex;border:1px solid var(--bord-bouton);border-radius:var(--r);overflow:hidden}
.bascule button{border:0;background:var(--carte);color:var(--texte);font:inherit;font-size:13px;
  padding:3px 9px;cursor:pointer;white-space:nowrap}
.bascule button + button{border-left:1px solid var(--bord-bouton)}
.bascule .oui:hover{background:var(--vert-f);color:var(--vert)}
.bascule .non:hover{background:var(--rouge-f);color:var(--rouge)}
.bascule .oui.actif{background:var(--vert);color:var(--sur-aplat);font-weight:600}
.bascule .non.actif{background:var(--rouge);color:var(--sur-aplat);font-weight:600}
.note-vive{font-size:13px;padding:7px 9px;border:1px solid transparent;border-radius:var(--r);
  min-height:34px;white-space:pre-wrap;cursor:text;line-height:1.45}
/* Une note de synthèse peut faire une page : au repos, on n'en montre que
   le début, sinon une seule ligne du tableau occupe tout l'écran. Le texte
   entier reste lisible dans la zone de saisie, qui défile. */
/* Hauteur calée au pixel : trois lignes de 18 px, plus 14 px de marge
   intérieure et 2 px de bordure (box-sizing: border-box). Sans ce calage,
   une quatrième ligne dépassait sous les points de suspension. */
/* Trois lignes, coupées net. « overflow:hidden » découpe au bord de la marge
   intérieure : la hauteur vaut donc 7 px de marge haute + 3 lignes de 18 px
   + 2 px de bordure. Avec les 7 px du bas en plus, le haut d'une quatrième
   ligne dépassait sous le texte. */
div.note-vive{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden;line-height:18px;max-height:63px}
.note-vive:hover{border-color:var(--bord);background:var(--fond)}
.note-vive:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea.note-vive{border-color:var(--bord);background:var(--carte);width:100%;
  min-height:74px;max-height:40vh}

/* ---------- Divers ---------- */
.doux{color:var(--doux)} .pt{font-size:12.5px} .nowrap{white-space:nowrap}
.tache-faite{text-decoration:line-through;color:var(--doux)}

code{background:var(--gris-f);padding:1px 5px;border-radius:4px;font-size:12.5px}

/* ---------- Reprise d'un fichier illisible ---------- */
.reprise{max-width:860px}

/* ---------- Utilitaires de mise en page ---------- */
/* Un intitulé que seul le lecteur d'écran entend : la colonne d'actions n'a
   pas de titre visible, mais elle en a besoin d'un. */
.hors-ecran{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}

  body{background:#fff}
  .appli{display:block}
  main,.entete{padding:0}

  /* Les compteurs résument la page : ils restent. */

  /* Présence et onglet actif sont portés par des boutons : sans ces règles,

  /* Sur papier, la note doit être entière : on lève la coupure à trois lignes. */
  div.note-vive{display:block !important;overflow:visible !important;
    -webkit-line-clamp:none !important;max-height:none !important}
  .bascule{border:0}

<script>
"use strict";

/* =========================================================================
   1. OUTILS GÉNÉRAUX
   ========================================================================= */

const JOURS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const MOIS  = ["janvier","février","mars","avril","mai","juin","juillet","août",
               "septembre","octobre","novembre","décembre"];

const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);

function ech(v){
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* --- Dates : chaînes ISO "AAAA-MM-JJ", calculs en heure locale --- */
function dISO(d){
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function parseISO(s){
  const [a,m,j] = String(s).split("-").map(Number);
  return new Date(a, m-1, j);
}
const aujourdHui = () => dISO(new Date());
const estISO = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ""));

function fmtFR(s){
  if(!estISO(s)) return "—";
  const [a,m,j] = s.split("-");
  return j + "/" + m + "/" + a;
}
function fmtLong(s){
  if(!estISO(s)) return "—";
  const d = parseISO(s);
  return JOURS[(d.getDay()+6)%7] + " " + d.getDate() + " " + MOIS[d.getMonth()] + " " + d.getFullYear();
}
function joursEntre(a,b){ return Math.round((parseISO(b) - parseISO(a)) / 86400000); }

/** Décale une date de n mois, en ramenant au dernier jour du mois si besoin. */
function decalerMois(iso, n){
  const d = parseISO(iso);
  const jour = d.getDate();
  const cible = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const dernier = new Date(cible.getFullYear(), cible.getMonth()+1, 0).getDate();
  cible.setDate(Math.min(jour, dernier));
  return dISO(cible);
}
const decalerAns = (iso, n) => decalerMois(iso, 12*n);
function decalerJours(iso, n){ const d = parseISO(iso); d.setDate(d.getDate()+n); return dISO(d); }
function pluriel(n, mot, plur){ return n + " " + (Math.abs(n) > 1 ? (plur || mot+"s") : mot); }

/* =========================================================================
   2. DONNÉES
   ========================================================================= */

const CLE = "fa-dossiers-v2";
let DB = null;
let onglet = "accueil";
let etat = { recherche:"", tri:"nom", tachesFaites:false, anneeRapports:0,
             filtreNotif:"tout", filtreVisite:"tout", ouvertes:{},
             enfantVisite:"", filtreDossier:"tout", tachesToutes:false, vueDV:"enfant" };

function baseVide(){
  return {
    version: 2,
    parametres: { seuilAlerteJours:30, seuilRapportJours:45,
                  utilisateur:{ nom:"Cédric P.", fonction:"Intervenant SAAF" } },
    enfants: [], taches: []
  };
}
function normaliser(d){
  const r = Object.assign(baseVide(), d || {});
  r.parametres = Object.assign(baseVide().parametres, (d && d.parametres) || {});
  r.parametres.utilisateur = Object.assign(
    { nom:"Cédric P.", fonction:"Intervenant SAAF" }, r.parametres.utilisateur || {});
  r.enfants = Array.isArray(r.enfants) ? r.enfants : [];
  r.taches  = Array.isArray(r.taches)  ? r.taches  : [];
  r.enfants.forEach(e => {
    e.relances   = Array.isArray(e.relances)   ? e.relances   : [];
    e.historique = Array.isArray(e.historique) ? e.historique : [];
    e.rapports   = Array.isArray(e.rapports)   ? e.rapports   : [];
    e.visites    = Array.isArray(e.visites)    ? e.visites    : [];
    if(e.notifRecue === undefined) e.notifRecue = true;
    e.visites.forEach(v => {
      v.rencontres = Array.isArray(v.rencontres) ? v.rencontres : [];
      v.creneaux    = Array.isArray(v.creneaux)    ? v.creneaux    : [];
      v.partageAvec = Array.isArray(v.partageAvec) ? v.partageAvec : [];
      v.sansEncadrement = !!v.sansEncadrement;
      v.rencontres.forEach(r => { if(!PRESENCES[r.presence]) r.presence = "prevue"; });
    });
  });
  return r;
}

function charger(){
  let brut = null;
  try{
    brut = localStorage.getItem(CLE);
    if(brut){ DB = normaliser(JSON.parse(brut)); return; }
  }catch(e){
    console.warn("Lecture impossible :", e);
    // la copie abîmée est gardée à part avant d'être remplacée
    try{ if(brut) localStorage.setItem(CLE + "-illisible", brut); }catch(e2){}
  }
  DB = donneesInitiales();
  sauver();
}
function sauver(){
  // Fichier illisible, reprise pas encore choisie : rien n'est gardé, ni sur
  // le disque ni dans la copie interne. Sinon, des exemples retouchés
  // passeraient au lancement suivant pour « la copie la plus récente ».
  if(FS.verrou) return;
  DB.modifieLe = new Date().toISOString();
  try{ localStorage.setItem(CLE, JSON.stringify(DB)); }
  catch(e){ console.warn("Copie navigateur impossible :", e); }
  fsPlanifierEcriture();
}
function maj(){ DB.initial = false; sauver(); rendre(); }

/* Redessin groupé : plusieurs clics rapprochés ne provoquent qu'un seul
   redessin, une fois l'utilisateur arrêté.

   Un redessin remplace tout le contenu de l'écran — donc la note en cours
   d'écriture et ce qu'elle contient déjà. Tant qu'une note est ouverte, le
   redessin attend : il repartira quand elle sera refermée, puisque la
   fermeture le redemande elle-même. */
let minuteurRendu = null;
const noteEnCoursDeSaisie = () => !!document.querySelector("textarea.note-vive");

function rendreBientot(){
  clearTimeout(minuteurRendu);
  minuteurRendu = setTimeout(() => {
    minuteurRendu = null;
    if(noteEnCoursDeSaisie()){ rendreBientot(); return; }
    rendre();
  }, 350);
}

const enfantParId = id => DB.enfants.find(e => e.id === id);
const nomComplet  = e => e ? ((e.nom||"") + " " + (e.prenom||"")).trim() : "";
/** Classement par nom de famille, puis par prénom. */
const parNom = (a,b) => nomComplet(a).localeCompare(nomComplet(b), "fr");

/* =========================================================================
   3. ENREGISTREMENT DANS UN VRAI FICHIER SUR LE DISQUE
   ========================================================================= */

const NOM_FICHIER    = "donnees-dossiers.json";
const DOSSIER_SAUV   = "sauvegardes";
const NB_SAUVEGARDES = 60;

/* Deux modes :
   — NATIF : le programme est installé, il écrit directement sur le disque ;
   — navigateur : la page demande l'accès à un dossier (Chrome / Edge). */
const NATIF = !!(window.programme && window.programme.natif);

const FS = {
  natif: NATIF,
  dispo: NATIF || typeof window.showDirectoryPicker === "function",
  dossier:null, enAttente:null, nom:"", chemin:"", fichier:"", dernier:null, erreur:"",
  enCours:false, aRefaire:false, dernierBackup:0,
  // Posé quand le fichier n'a pas pu être lu : bloque toute écriture et
  // remplace l'écran par le choix des données à reprendre.
  verrou:null
};

function idbOuvrir(){
  return new Promise((res, rej) => {
    const q = indexedDB.open("fa-dossiers-config", 1);
    q.onupgradeneeded = () => q.result.createObjectStore("cfg");
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
function idbEcrire(cle, valeur){
  return idbOuvrir().then(d => new Promise((res, rej) => {
    const t = d.transaction("cfg","readwrite");
    t.objectStore("cfg").put(valeur, cle);
    t.oncomplete = () => { d.close(); res(); };
    t.onerror = () => { d.close(); rej(t.error); };
  }));
}
function idbLire(cle){
  return idbOuvrir().then(d => new Promise((res, rej) => {
    const t = d.transaction("cfg","readonly");
    const q = t.objectStore("cfg").get(cle);
    q.onsuccess = () => { d.close(); res(q.result || null); };
    q.onerror = () => { d.close(); rej(q.error); };
  }));
}
function idbEffacer(cle){
  return idbOuvrir().then(d => new Promise(res => {
    const t = d.transaction("cfg","readwrite");
    t.objectStore("cfg").delete(cle);
    t.oncomplete = () => { d.close(); res(); };
    t.onerror = () => { d.close(); res(); };
  }));
}

const heureCourte = d => String(d.getHours()).padStart(2,"0") + "h" + String(d.getMinutes()).padStart(2,"0");
const nomDeChemin = c => String(c||"").replace(/[\\/]+$/,"").split(/[\\/]/).pop() || c;

/* ------------------------------ mode programme installé ------------------ */

/** Lit le fichier de données du dossier en cours.

    S'il existe mais ne se lit pas, plus rien n'est écrit dessus tant qu'on
    n'a pas choisi quoi reprendre. Avant, le programme le signalait d'une
    pastille et continuait d'enregistrer : au premier clic, le fichier abîmé
    — souvent récupérable aux deux tiers — était remplacé par ce qui était à
    l'écran, c'est-à-dire les exemples sur un ordinateur neuf. */
async function natifCharger(){
  const r = await window.programme.lire();
  natifRetenir(r);
  if(!r.ok){ await verrouiller("Le fichier n'a pas pu être ouvert.", r.erreur || ""); return; }
  if(r.contenu === null){ await fsEcrire(); return; }   // premier lancement : on crée le fichier
  try{
    const d = JSON.parse(r.contenu);
    if(!d || !Array.isArray(d.enfants)) throw new Error("contenu inattendu");
    DB = normaliser(d);
    FS.verrou = null; FS.erreur = "";
    try{ localStorage.setItem(CLE, JSON.stringify(DB)); }catch(e){}
  }catch(e){
    await verrouiller(r.contenu.trim()
      ? "Le fichier est incomplet ou abîmé — le plus souvent, une copie ou une synchronisation interrompue."
      : "Le fichier est vide — le plus souvent, une copie ou une synchronisation interrompue.",
      r.contenu.trim() ? e.message : "");
  }
}
async function natifDemarrer(){
  await natifCharger();
  rendre();
}

/** Bloque l'enregistrement et prépare l'écran de reprise : une copie du
    fichier tel qu'il est, les sauvegardes qui se lisent, et la copie interne
    du programme si elle contient autre chose que les exemples. */
async function verrouiller(raison, detail){
  FS.erreur = raison;
  FS.verrou = { raison, detail:detail || "", copie:"", sauvegardes:[], totalSauvegardes:0,
                interne: DB && !DB.initial
                  ? { nb:DB.enfants.length, modifieLe:DB.modifieLe || "" } : null };
  if(!NATIF) return;
  const c = await window.programme.mettreDeCote().catch(() => null);
  if(c && c.ok) FS.verrou.copie = c.nom;
  const s = await window.programme.sauvegardes().catch(() => null);
  if(s && s.ok){ FS.verrou.sauvegardes = s.liste; FS.verrou.totalSauvegardes = s.total; }
}

/** Reprise choisie à l'écran : on lève le verrou, puis on enregistre. */
async function reprendre(source, nom){
  if(source === "sauvegarde"){
    const r = await window.programme.lireSauvegarde(nom);
    let d = null;
    try{ d = r.ok ? JSON.parse(r.contenu) : null; }catch(e){}
    if(!d || !Array.isArray(d.enfants)){
      alert("Cette sauvegarde ne se lit pas non plus" + (r.erreur ? " (" + r.erreur + ")" : "") + ".");
      return;
    }
    DB = normaliser(d);
  }
  FS.verrou = null; FS.erreur = "";
  try{ localStorage.setItem(CLE, JSON.stringify(DB)); }catch(e){}
  await fsEcrire();
  remonterEnHaut = true;
  rendre();
}
function natifRetenir(r){
  if(!r) return;
  FS.chemin  = r.dossier || FS.chemin;
  FS.fichier = r.fichier || FS.fichier;
  FS.nom     = nomDeChemin(FS.chemin);
  FS.dossier = FS.chemin;
}
/** Le programme principal demande, si le dossier choisi a déjà des données,
    lesquelles garder ; ici on applique sa réponse. */
async function natifChangerDossier(){
  const r = await window.programme.changerDossier({ nb:DB.enfants.length, exemple:!!DB.initial });
  if(!r.ok){ rendre(); return; }
  natifRetenir(r);
  if(r.mode === "ouvrir") await natifCharger();   // les données de ce dossier
  else{ FS.verrou = null; FS.erreur = ""; await fsEcrire(); }   // dossier vide, ou remplacement voulu
  remonterEnHaut = true;
  rendre();
}
async function natifRelire(){
  await natifCharger();
  rendre();
}

/* ------------------------------ mode navigateur -------------------------- */

async function fsReconnecter(silencieux){
  if(!FS.dispo || NATIF) return;
  let h = null;
  try{ h = await idbLire("dossier"); }catch(e){ return; }
  if(!h) return;
  FS.nom = h.name;
  let droit = "prompt";
  try{
    droit = silencieux ? await h.queryPermission({ mode:"readwrite" })
                       : await h.requestPermission({ mode:"readwrite" });
  }catch(e){ droit = "prompt"; }
  if(droit === "granted"){
    FS.dossier = h; FS.enAttente = null; FS.erreur = "";
    await fsLire();
  }else{
    FS.enAttente = h;
  }
  majEtatStockage();
}

async function fsChoisir(){
  if(!FS.dispo) return;
  let h;
  try{ h = await window.showDirectoryPicker({ id:"dossiers-fa", mode:"readwrite", startIn:"documents" }); }
  catch(e){ return; }
  FS.dossier = h; FS.enAttente = null; FS.nom = h.name; FS.erreur = "";
  try{ await idbEcrire("dossier", h); }catch(e){}
  const trouve = await fsLire();
  if(!trouve) await fsEcrire();
  majEtatStockage();
  alert(trouve
    ? "Dossier connecté. Les données du fichier « " + NOM_FICHIER + " » ont été chargées."
    : "Dossier connecté. Vos données sont enregistrées dans « " + NOM_FICHIER +
      " », automatiquement, à chaque modification.");
}

async function fsLire(){
  if(!FS.dossier) return false;
  let fh;
  try{ fh = await FS.dossier.getFileHandle(NOM_FICHIER); }catch(e){ return false; }
  try{
    const d = JSON.parse(await (await fh.getFile()).text());
    if(!d || !Array.isArray(d.enfants)) throw new Error("contenu inattendu");
    FS.verrou = null; FS.erreur = "";
    const localPlusRecent = DB && !DB.initial && DB.modifieLe &&
                            (!d.modifieLe || DB.modifieLe > d.modifieLe);
    if(localPlusRecent){
      await fsEcrire();
    }else{
      DB = normaliser(d);
      try{ localStorage.setItem(CLE, JSON.stringify(DB)); }catch(e){}
      rendre();
    }
    return true;
  }catch(e){
    // même règle qu'avec le programme installé : on n'écrit plus sur un
    // fichier qu'on n'a pas su lire
    await verrouiller("Le fichier est incomplet ou abîmé — le plus souvent, une copie ou une " +
                      "synchronisation interrompue.", e.message);
    rendre();
    return true;
  }
}

let minuteurEcriture = null;
function fsPlanifierEcriture(){
  if(!FS.dossier) return;
  clearTimeout(minuteurEcriture);
  minuteurEcriture = setTimeout(fsEcrire, 300);
}
async function fsEcrire(){
  // fichier illisible au chargement : rien n'est écrit avant la reprise
  if(!FS.dossier || FS.verrou) return;
  if(FS.enCours){ FS.aRefaire = true; return; }
  FS.enCours = true;
  const contenu = JSON.stringify(DB, null, 2);
  if(NATIF){
    const r = await window.programme.ecrire(contenu);
    if(r.ok){
      FS.dernier = new Date(r.heure);
      FS.erreur = "";
      natifRetenir(r);
    }else{
      FS.erreur = r.erreur || "écriture impossible";
    }
  }else{
    try{
      const fh = await FS.dossier.getFileHandle(NOM_FICHIER, { create:true });
      const flux = await fh.createWritable();
      await flux.write(contenu);
      await flux.close();
      FS.dernier = new Date();
      FS.erreur = "";
      await fsSauvegardeDuJour(contenu);
    }catch(e){ FS.erreur = e.message || "écriture impossible"; }
  }
  FS.enCours = false;
  majEtatStockage();
  if(FS.aRefaire){ FS.aRefaire = false; fsPlanifierEcriture(); }
}
async function fsSauvegardeDuJour(contenu, forcer){
  if(NATIF){ await window.programme.sauvegarder(contenu || JSON.stringify(DB,null,2)); return; }
  if(!forcer && Date.now() - FS.dernierBackup < 120000) return;
  FS.dernierBackup = Date.now();
  try{
    const dir = await FS.dossier.getDirectoryHandle(DOSSIER_SAUV, { create:true });
    const fh = await dir.getFileHandle("donnees-" + aujourdHui() + ".json", { create:true });
    const flux = await fh.createWritable();
    await flux.write(contenu);
    await flux.close();
    const noms = [];
    for await (const nom of dir.keys()){
      if(/^donnees-\d{4}-\d{2}-\d{2}\.json$/.test(nom)) noms.push(nom);
    }
    noms.sort();
    for(const n of noms.slice(0, Math.max(0, noms.length - NB_SAUVEGARDES))) await dir.removeEntry(n);
  }catch(e){ /* la copie de secours ne bloque jamais l'enregistrement principal */ }
}

function majEtatStockage(){
  const n = document.getElementById("etat-stockage");
  if(!n) return;
  let couleur, texte, bouton = "";
  if(NATIF){
    if(FS.erreur){
      couleur = "rouge"; texte = "Enregistrement bloqué";
      bouton = '<button class="b mini" data-fs="aide">Voir</button>';
    }else{
      couleur = "vert";
      texte = "<b>" + ech(FS.nom) + "</b>" + (FS.dernier ? " · enregistré à " + heureCourte(FS.dernier) : "");
      bouton = '<button class="b mini" data-fs="ouvrir">Ouvrir le dossier</button>';
    }
    n.innerHTML = '<span class="puce ' + couleur + '"></span><span>' + texte + "</span>" + bouton;
    return;
  }
  if(!FS.dispo){
    couleur = "orange"; texte = "Enregistré dans le navigateur";
    bouton = '<button class="b mini" data-fs="aide">Pourquoi ?</button>';
  }else if(FS.erreur){
    couleur = "rouge"; texte = "Enregistrement bloqué";
    bouton = '<button class="b mini" data-fs="choisir">Corriger</button>';
  }else if(FS.dossier){
    couleur = "vert";
    texte = "<b>" + ech(FS.nom) + "</b>" + (FS.dernier ? " · enregistré à " + heureCourte(FS.dernier) : "");
  }else if(FS.enAttente){
    couleur = "orange"; texte = "<b>" + ech(FS.nom) + "</b> à reconnecter";
    bouton = '<button class="b mini" data-fs="reconnecter">Reconnecter</button>';

  }
  n.innerHTML = '<span class="puce ' + couleur + '"></span><span>' + texte + "</span>" + bouton;
}

function age(naissance){
  if(!estISO(naissance)) return null;
  const n = parseISO(naissance), a = new Date();
  let x = a.getFullYear() - n.getFullYear();
  const m = a.getMonth() - n.getMonth();
  if(m < 0 || (m === 0 && a.getDate() < n.getDate())) x--;
  return x >= 0 ? x : null;
}
const ageTexte = e => { const a = age(e.naissance); return a == null ? "âge à compléter" : a + " ans"; };

/** « Vendredi 16/05 » — repère court pour les visites à venir. */
function jourCourt(iso){
  const d = parseISO(iso);
  const p = n => String(n).padStart(2,"0");
  return JOURS[(d.getDay()+6)%7] + " " + p(d.getDate()) + "/" + p(d.getMonth()+1);
}

const ORDRE_STATUT = { rouge:0, orange:1, gris:2, vert:3 };

function statutEcheance(date, seuil){
  if(!estISO(date)) return { code:"gris", label:"Date à encoder", jours:null };
  const s = seuil == null ? DB.parametres.seuilAlerteJours : seuil;
  const j = joursEntre(aujourdHui(), date);
  if(j < 0)   return { code:"rouge",  label:"En retard de " + pluriel(-j,"jour"), jours:j };
  if(j === 0) return { code:"orange", label:"Aujourd'hui", jours:0 };
  if(j <= s)  return { code:"orange", label:"Dans " + pluriel(j,"jour"), jours:j };
  return { code:"vert", label:"Dans " + pluriel(j,"jour"), jours:j };
}

/* --- Notification de prise en charge --- */
function statutNotif(e){
  if(!estISO(e.notifFin))
    return { code:"gris", marque:"?", titre:"Pas de date encodée",
             detail:"Complétez la fiche dans l'onglet Enfants." };
  const j = joursEntre(aujourdHui(), e.notifFin);
  if(j < 0)
    return { code:"rouge", marque:"✕", titre:"Notification à réclamer",
             detail:"Échéance dépassée depuis " + pluriel(-j,"jour") + ".", jours:j };
  if(e.notifRecue === false)
    return { code:"rouge", marque:"✕", titre:"Pas encore reçue",
             detail:"Attendue pour le " + fmtFR(e.notifFin) + ".", jours:j };
  if(j <= DB.parametres.seuilAlerteJours)
    return { code:"orange", marque:"!", titre:"Renouvellement proche",
             detail:"Valable encore " + pluriel(j,"jour") + ".", jours:j };
  return { code:"vert", marque:"✓", titre:"Reçue",
           detail:"Valable jusqu'au " + fmtFR(e.notifFin) + ".", jours:j };
}

/* --- Rapports : l'annuel à la date de formalisation, le semestriel six mois plus tôt --- */
const RATTRAPAGE_RAPPORT = 60;

/** Date de reference du rapport annuel : celle fixee a la main si elle existe,
    sinon la date de notification de prise en charge. */
const baseRapport = e => estISO(e.rapportAnnuel) ? e.rapportAnnuel
                       : (estISO(e.notifFin) ? e.notifFin : null);

/** Ce rapport a-t-il été coché comme envoyé pour cette échéance ? */
const rapportEnvoye = (e, type, echeance) =>
  (e.rapports||[]).some(r => r.type === type && r.echeance === echeance && estISO(r.envoyeLe));

/** k-ième échéance d'un rapport, comptée depuis la date de base (k = 0 :
    celle de l'année de la base, k = 1 : l'année suivante, k = -1 : la
    précédente). Toujours depuis la base, jamais d'une échéance à la
    suivante : en passant par un 28 février, on ne retrouvait plus le 29
    des années bissextiles, et le calendrier ne tombait plus le même jour que
    la liste « à rendre ». */
const echeanceN = (base, type, k) => decalerMois(base, 12*k - (type === "annuel" ? 0 : 6));

/** Toutes les échéances d'un rapport comprises dans une période. */
function occurrencesRapport(e, type, debut, fin){
  const base = baseRapport(e);
  if(!base) return [];
  const an = s => parseISO(s).getFullYear();
  const l = [];
  // une année de marge de chaque côté : le semestriel tombe six mois plus tôt
  for(let k = an(debut) - an(base) - 1; k <= an(fin) - an(base) + 1; k++){
    const d = echeanceN(base, type, k);
    if(d >= debut && d <= fin) l.push(d);
  }
  return l;
}

/** Date à partir de laquelle un rapport non coché est réclamé : la plus
    ancienne entre « il y a RATTRAPAGE_RAPPORT jours » et le premier rapport
    coché de ce type, sans remonter au-delà de cinq ans. Avant, c'est
    l'époque d'avant le programme : rien n'est réclamé. Partagée par la liste
    « à rendre » et le calendrier, qui disent ainsi la même chose. */
function debutSuivi(e, type){
  const coches = (e.rapports||[]).filter(r => r.type === type && estISO(r.echeance))
                                 .map(r => r.echeance).sort();
  const rattrapage = decalerJours(aujourdHui(), -RATTRAPAGE_RAPPORT);
  let limite = coches.length && coches[0] < rattrapage ? coches[0] : rattrapage;
  const auPlusTot = decalerAns(aujourdHui(), -5);
  return limite < auPlusTot ? auPlusTot : limite;
}

/** Échéance en cours : la première qui n'a pas été cochée comme envoyée.

    On ne réclame pas les rapports d'avant le suivi : ceux de plus de
    RATTRAPAGE_RAPPORT jours, et ceux qui précèdent le premier rapport coché
    de ce type. Avant, cocher un premier rapport levait cette marge d'un coup
    et faisait remonter cinq ans d'anniversaires jamais cochés — avec une
    date de rapport annuel fixée en 2019, cocher celui de 2027 réclamait
    aussitôt celui de 2022, « en retard ». */
function echeanceRapport(e, type){
  const base = baseRapport(e);
  if(!base) return null;
  let k = 0, d = echeanceN(base, type, 0);
  const limite = debutSuivi(e, type);
  let garde = 0;
  while(d < limite && garde++ < 80) d = echeanceN(base, type, ++k);
  garde = 0;
  while(rapportEnvoye(e, type, d) && garde++ < 40) d = echeanceN(base, type, ++k);
  return d;
}
/** Rapports en cours, non cochés, dont l'échéance tombe d'ici « jours ».
    Sans argument : tous, y compris ceux qui sont en retard. */
function rapportsDus(jours){
  const limite = jours == null ? null : decalerJours(aujourdHui(), jours);
  const l = [];
  DB.enfants.forEach(e => ["semestriel","annuel"].forEach(type => {
    const d = echeanceRapport(e, type);
    if(!d || (limite && d > limite)) return;
    l.push({ enfant:e, type, date:d, st:statutEcheance(d, DB.parametres.seuilRapportJours) });
  }));
  return l.sort((a,b) => a.date.localeCompare(b.date));
}
const rapportsAPreparer = () => rapportsDus(DB.parametres.seuilRapportJours);
const rapportsEnRetard  = () => rapportsDus(null).filter(o => o.date < aujourdHui());
const nomRapport = t => t === "annuel" ? "Rapport annuel" : "Rapport semestriel";

/** Ligne cochable, utilisée dans « À faire » comme dans l'onglet Rapports. */

let remonterEnHaut = false;   // vrai uniquement quand on change d'écran

/* La position de défilement est suivie au fil de l'eau : la lire pendant un
   redessin obligerait le navigateur à recalculer toute la mise en page. */
let positionPage = 0;
window.addEventListener("scroll", () => { positionPage = window.scrollY; }, { passive:true });

function rendre(){
  const positionAvant = positionPage;
  const aReclamer = DB.enfants.filter(e => statutNotif(e).code === "rouge").length;
  const u = DB.parametres.utilisateur;

  document.getElementById("role-marque").textContent = u.fonction || "";

  document.getElementById("nav").innerHTML = ONGLETS.map(o => {
    let p = "";
    if(o.id === "enfants" && aReclamer && !FS.verrou) p = '<span class="compte">' + aReclamer + "</span>";
    return '<button data-onglet="' + o.id + '" class="' + (onglet === o.id ? "actif" : "") +
           '" title="' + ech(o.titre) + '">' + ic(o.icone) +
           '<span class="lib">' + ech(o.titre) + "</span>" + p + "</button>";
  }).join("");
  document.getElementById("bouton-reglages").innerHTML =
    ic("reglages") + '<span class="lib">Paramètres</span>';

  /* Pas de formule d'accueil ni de phrase sous le titre : l'accueil porte
     la date du jour, les autres écrans leur nom, et c'est tout. */
  const o = ONGLETS.find(x => x.id === onglet) || ONGLETS[0];
  const jour = fmtLong(aujourdHui());
  document.getElementById("titre").textContent = onglet === "accueil" ? jour : o.titre;
  document.getElementById("sous-titre").textContent = "";
  document.getElementById("date-jour").textContent = onglet === "accueil" ? "" : jour;
  if(FS.verrou){
    document.getElementById("titre").textContent = "Reprise des données";
    document.getElementById("sous-titre").textContent =
      "Rien n'est enregistré tant que vous n'avez pas choisi quelles données reprendre.";
  }

  const vues = { accueil:vueAccueil, enfants:vueEnfants,
                 rapports:vueRapports, visites:vueVisites };
  // Fichier illisible : aucun écran habituel. Ils montreraient les exemples
  // ou une copie ancienne comme si c'étaient les dossiers du jour.
  document.getElementById("vue").innerHTML = FS.verrou ? vueReprise()
                                                       : (vues[onglet] || vueAccueil)();
  majEtatStockage();
  // Le repositionnement force un recalcul complet de la mise en page : on le
  // repousse après l'affichage, et on ne le fait que s'il est nécessaire.
  requestAnimationFrame(() => {
    if(remonterEnHaut){ remonterEnHaut = false; positionPage = 0; window.scrollTo(0, 0); }
    else if(Math.abs(window.scrollY - positionAvant) > 1) window.scrollTo(0, positionAvant);
  });
}

/** Écran de reprise, à la place des écrans habituels quand le fichier de
    données n'a pas pu être lu. Il dit ce qui s'est passé, que rien n'est
    perdu, et propose les copies lisibles — la plus récente en premier choix. */
function vueReprise(){
  const v = FS.verrou;
  const modif = iso => {
    const d = iso ? new Date(iso) : null;
    return d && !isNaN(d) ? ", modifiée le " +
      d.toLocaleString("fr-BE", { dateStyle:"long", timeStyle:"short" }) : "";
  };
  const choix = [];
  if(v.interne) choix.push({ quand:v.interne.modifieLe, html:
    "<b>Copie gardée par le programme</b>" +
    '<div class="pt doux">' + pluriel(v.interne.nb, "enfant") + ech(modif(v.interne.modifieLe)) +
    " — l'état de votre dernière séance sur cet ordinateur</div>",
    bouton:'data-action="reprise" data-source="interne">Reprendre' });
  v.sauvegardes.forEach(s => choix.push({ quand:s.modifieLe || s.jour, html:
    "<b>Sauvegarde du " + ech(fmtLong(s.jour).replace(/^./, c => c.toLowerCase())) + "</b>" +
    '<div class="pt doux">' + pluriel(s.nb, "enfant") + ech(modif(s.modifieLe)) + "</div>",
    bouton:'data-action="reprise" data-source="sauvegarde" data-nom="' + ech(s.nom) + '">Restaurer' }));
  // le premier choix proposé : la copie la plus récente
  const recente = choix.reduce((m, c) => !m || String(c.quand) > String(m.quand) ? c : m, null);

  const lignes = choix.map(c =>
    '<li><div class="extensible">' + c.html + "</div>" +
    '<button class="b' + (c === recente ? " primaire" : "") + '" ' + c.bouton +
    (c === recente ? " — la plus récente" : "") + "</button></li>").join("");
  const autres = v.totalSauvegardes - v.sauvegardes.length;

  return `<div class="carte reprise">
    <div class="tete">${ic("cadenas", 20)}<h2>Le fichier de données n'a pas pu être lu</h2></div>
    <p class="reprise-raison">${ech(v.raison)}</p>
    <p class="pt doux reprise-detail">${ech(FS.fichier || "")}${v.detail
      ? "<br>Détail technique : " + ech(v.detail) : ""}</p>
    <div class="encadre ok">
      <div class="titre">Rien n'est perdu, rien n'est écrasé.</div>
      <span class="pt">Le programme n'enregistre plus rien tant que vous n'avez pas choisi
      ci-dessous.${v.copie ? " Le fichier tel qu'il est a été copié à côté de lui, sous le nom <code>" +
      ech(v.copie) + "</code> : il reste récupérable." : ""}</span>
    </div>
    ${choix.length ? `<h3 class="titre-section">Quelles données reprendre ?</h3>
      <ul class="liste">${lignes}</ul>
      ${autres > 0 ? '<p class="aide">' + pluriel(autres, "sauvegarde plus ancienne",
        "sauvegardes plus anciennes") + " dans le sous-dossier <code>sauvegardes</code>.</p>" : ""}`
    : `<div class="encadre souci"><div class="titre">Aucune copie lisible n'a été trouvée.</div>
      <span class="pt">Ouvrez le dossier des données : le fichier abîmé et ses copies y sont.
      Si le dossier se synchronise (OneDrive…), attendez la fin de la synchronisation,
      puis relisez le fichier.</span></div>`}
    <div class="barre haut-marge">
      ${NATIF ? '<button class="b" data-action="fs-ouvrir">Ouvrir le dossier des données</button>' : ""}
      <button class="b" data-action="reprise-relire">Relire le fichier</button>
    </div>
    <p class="aide">« Relire le fichier » sert quand la cause est passagère : une synchronisation
      OneDrive en cours, une clé USB rebranchée, un fichier réparé à la main.</p>
  </div>`;
}

function vueAccueil(){
  const auj      = aujourdHui();
  const taches   = tachesEnCours();
  const rapports = rapportsAPreparer();
  const visites  = rencontresAVenir();
  const aRemplir = toutesRencontres().filter(o => aCompleter(o.rencontre));
  const notifs   = DB.enfants.filter(e => statutNotif(e).code === "rouge").length;

  /* Tout doit tenir sur un écran : chaque carte s'arrête à cinq lignes et
     renvoie vers son onglet pour la suite. */
  const MAX = 4;

  const s = (n, un, plusieurs) => n > 1 ? plusieurs : un;
  const tuiles = `<div class="tuiles">
    ${tuileCompte({onglet:"rapports", n:rapports.length,
      titre:s(rapports.length, "rapport à préparer", "rapports à préparer"),
      alerte: rapports.some(o => o.date < auj) ? "rouge" : "orange"})}
    ${tuileCompte({action:"taches-toutes", f:"", n:taches.length,
      titre:s(taches.length, "tâche à faire", "tâches à faire"),
      alerte: taches.some(t => t.enRetard) ? "rouge" : ""})}
    ${tuileCompte({onglet:"enfants", n:notifs,
      titre:s(notifs, "notification à réclamer", "notifications à réclamer"), alerte:"rouge"})}
    ${tuileCompte({onglet:"visites", n:visites.length,
      titre:s(visites.length, "rencontre à venir", "rencontres à venir")})}
  </div>`;

  const dujour = taches.filter(t => t.enRetard || t.pourAuj || t.demain).slice(0, MAX);
  /* La to do vit ici, repliée sur le jour même. Dépliée, elle prend toute la
     largeur : les tâches à venir, sans date et terminées apparaissent, avec
     de quoi les modifier et les supprimer. */
  const toutes = !!etat.tachesToutes;
  const faites = DB.taches.filter(t => t.fait)
    .sort((a,b) => String(b.faitLe||"").localeCompare(String(a.faitLe||"")));
  const groupes = [
    ["En retard",   taches.filter(t => t.enRetard)],
    ["Aujourd'hui", taches.filter(t => t.pourAuj)],
    ["À venir",     taches.filter(t => estISO(t.echeance) && t.echeance > auj)],
    ["Sans date",   taches.filter(t => !estISO(t.echeance))]
  ];

  const carteTaches = `
    <div class="carte">
      <div class="tete"><h2>${toutes ? "Mes tâches" : "À faire aujourd'hui"}</h2>
        ${toutes ? '<span class="doux pt">' + pluriel(taches.length,"tâche") + " en cours · " +
          faites.length + " terminée(s)</span>" : ""}
        <button class="b mini pousse" data-action="tache-nouvelle">Ajouter</button>
        ${toutes ? '<button class="b mini" data-action="taches-basculer">' +
          (etat.tachesFaites ? "Masquer" : "Afficher") + " les tâches faites</button>" : ""}</div>
      ${toutes
        ? (groupes.map(([titre,l]) => l.length
            ? '<h3 class="haut-marge">' + titre + " (" + l.length + ')</h3><ul class="liste">' +
              l.map(ligneTache).join("") + "</ul>" : "").join("")
           || '<p class="rien">Aucune tâche en cours.</p>') +
          (etat.tachesFaites && faites.length
            ? '<h3 class="haut-marge">Terminées</h3><ul class="liste">' +
              faites.map(ligneTache).join("") +
              '</ul><button class="b danger haut-marge" data-action="taches-purger">' +
              "Supprimer les tâches terminées</button>" : "")
        : (dujour.length ? '<ul class="liste">' + dujour.map(t => `<li>
            <input type="checkbox" data-action="tache-bascule" data-id="${t.id}"
                   class="coche-tache" aria-label="Terminer">
            <span class="extensible">${ech(t.texte)}</span>
            <span class="et ${t.enRetard?"rouge":(t.pourAuj?"orange":"gris")}">${
              t.enRetard ? "En retard" : (t.pourAuj ? "Aujourd'hui" : "Demain")}</span>
          </li>`).join("") + "</ul>" : '<p class="rien">Rien de prévu pour aujourd\'hui.</p>')}
      <button class="lien" data-action="taches-toutes">${toutes
        ? "Ne montrer que le jour même"
        : "Voir toutes mes tâches (" + taches.length + ")"}</button>
    </div>`;

  const carteRapports = `
    <div class="carte">
      <div class="tete"><h2>Rapports à rendre</h2></div>
      ${rapports.length ? '<ul class="liste">' + rapports.slice(0, MAX).map(o => {
        const retard = o.date < aujourdHui();
        return `<li>
          <input type="checkbox" data-action="rapport-envoye" data-id="${o.enfant.id}"
                 data-type="${o.type}" data-date="${o.date}" class="coche"
                 aria-label="Marquer le rapport comme envoyé">
          <span class="extensible"><span class="nom-enfant">${ech(nomComplet(o.enfant))}</span>
            <br><span class="doux pt">${ech(nomRapport(o.type))} — ${ech(fmtFR(o.date))}</span></span>
          <span class="et ${retard ? "rouge" : o.st.code}">${retard
            ? "Retard " + pluriel(joursEntre(o.date, aujourdHui()),"j","j")
            : ech(o.st.label)}</span>
        </li>`; }).join("") + "</ul>"
        : '<p class="rien">Aucun rapport à rendre dans les prochaines semaines.</p>'}
      <button class="lien" data-onglet="rapports">Voir le calendrier des échéances</button>
    </div>`;

  const carteVisites = `
    <div class="carte">
      <div class="tete"><h2>Rencontres à venir</h2></div>
      ${visites.length ? '<ul class="liste">' + visites.slice(0, MAX).map(o => `<li>
        <span class="extensible"><span class="nom-enfant">${ech(libelleDroit(o.enfant, o.visite))}</span>
          <br><span class="doux pt">${ech(libelleParent(o.visite))}</span></span>
        <span class="nowrap pt droite">
          ${ech(jourCourt(o.rencontre.date))}
          ${heuresDe(o.rencontre) ? '<br><span class="doux">' + ech(heuresDe(o.rencontre)) + "</span>" : ""}
        </span></li>`).join("") + "</ul>"
        : '<p class="rien">Aucune rencontre programmée.</p>'}
      ${aRemplir.length ? '<p class="aide"><span class="et orange">' +
        pluriel(aRemplir.length,"rencontre") + " passée(s) sans compte rendu</span></p>" : ""}
      <button class="lien" data-onglet="visites">Voir tous les droits de visite</button>
    </div>`;

  return tuiles + (toutes
    ? carteTaches + '<div class="grille g2 haut-marge">' + carteRapports + carteVisites + "</div>"
    : '<div class="grille g3">' + carteTaches + carteRapports + carteVisites + "</div>");
}

/* =========================================================================
   8. LIGNE DE TÂCHE (utilisée par la to do de l'accueil)

function ligneTache(t){
  const cls = t.enRetard ? "rouge" : (t.pourAuj ? "orange" : "gris");
  return `<li>
    <input type="checkbox" data-action="tache-bascule" data-id="${t.id}" ${t.fait?"checked":""}
           class="coche-tache" aria-label="Terminer">
    <div class="extensible">
      <span class="${t.fait?"tache-faite":""}">${ech(t.texte)}</span>
      ${t.enfantId && enfantParId(t.enfantId)
        ? '<span class="doux pt"> · ' + ech(nomComplet(enfantParId(t.enfantId))) + "</span>" : ""}
      ${estISO(t.echeance) && !t.fait
        ? '<br><span class="et ' + cls + '">' +
          (t.enRetard ? "En retard — " : (t.pourAuj ? "Aujourd'hui — " : "")) + ech(fmtFR(t.echeance)) + "</span>"
        : ""}
    </div>
    <div class="actions">
      <button class="b mini" data-action="tache-modifier" data-id="${t.id}">Modifier</button>
      <button class="b mini danger" data-action="tache-supprimer" data-id="${t.id}">✕</button>
    </div>
  </li>`;
}
