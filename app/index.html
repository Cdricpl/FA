<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestion des dossiers</title>
<style>
:root{
  --fond:#f5f7fa; --carte:#ffffff; --texte:#16232f; --doux:#68788a; --bord:#e2e8f0;
  --accent:#2f6fb0; --accent-doux:#e9f1f9;
  --marine:#0e2c4f; --marine-clair:#17406e; --marine-texte:#c3d4e6;
  --vert:#1f8a4c; --vert-f:#e4f5ea;
  --orange:#c07a10; --orange-f:#fdf1dc;
  --rouge:#c02b2b; --rouge-f:#fce5e5;
  --gris:#6b7785; --gris-f:#eef1f5;
  --violet:#7143b8; --violet-f:#f0e9fb;
  --ombre:0 1px 2px rgba(16,24,40,.05),0 6px 16px rgba(16,24,40,.05);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --fond:#131a22; --carte:#1b232d; --texte:#e9eef4; --doux:#94a3b5; --bord:#2b3642;
    --accent:#6aa6e0; --accent-doux:#22303f;
    --marine:#0b1c30; --marine-clair:#1d456f; --marine-texte:#b7c7d9;
    --vert:#5fcf8e; --vert-f:#1b3327;
    --orange:#e8b055; --orange-f:#3a2e17;
    --rouge:#f08a8a; --rouge-f:#3a1f1f;
    --gris:#94a3b5; --gris-f:#232c36;
    --violet:#b39ae8; --violet-f:#2a2340;
    --ombre:none;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--texte);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
h1{font-size:25px;margin:0;line-height:1.2}
h2{font-size:16.5px;margin:0 0 14px;line-height:1.25}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--doux);margin:0 0 8px}
svg{flex:none}

/* ---------- Ossature ---------- */
.appli{display:flex;min-height:100vh}
.cote{width:236px;flex:none;background:var(--marine);color:var(--marine-texte);
  display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh}
.marque{display:flex;flex-direction:column;align-items:center;gap:7px;padding:6px 0 20px;text-align:center}
.marque .rond-logo{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;color:#fff}
.marque .nom{font-weight:700;font-size:14px;letter-spacing:.04em;color:#fff}
.marque .role{font-size:12px;color:var(--marine-texte);opacity:.8}
.cote nav{display:flex;flex-direction:column;gap:3px}
.cote nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  background:none;border:0;color:var(--marine-texte);font:inherit;font-size:14px;
  padding:10px 12px;border-radius:10px;cursor:pointer}
.cote nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.cote nav button.actif{background:var(--marine-clair);color:#fff;font-weight:600}
.cote nav .compte{margin-left:auto;background:var(--rouge);color:#fff;font-size:11px;font-weight:700;
  min-width:19px;padding:0 5px;line-height:19px;text-align:center;border-radius:10px}
.cote .bas{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}
.profil{display:flex;align-items:center;gap:10px;padding:8px 6px 0}
.profil .qui{min-width:0}
.profil .qui b{display:block;color:#fff;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profil .qui span{font-size:11.5px;opacity:.75}

.principal{flex:1;min-width:0;display:flex;flex-direction:column}
.entete{padding:24px 30px 4px;display:flex;justify-content:space-between;align-items:flex-start;
  gap:16px;flex-wrap:wrap}
.entete p{margin:5px 0 0;color:var(--doux);font-size:14px}
.entete-droite{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.date-jour{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--doux);white-space:nowrap}
.stockage{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--doux);
  padding:5px 11px;border:1px solid var(--bord);border-radius:20px;background:var(--carte)}
.stockage b{color:var(--texte);font-weight:600}
main{padding:16px 30px 26px;flex:1}
footer{padding:10px 30px 26px;font-size:12.5px;color:var(--doux);
  display:flex;align-items:center;justify-content:center;gap:8px}

@media(max-width:900px){
  .appli{flex-direction:column}
  .cote{width:auto;height:auto;position:static;flex-direction:row;align-items:center;
    gap:10px;padding:10px 12px;overflow-x:auto}
  .marque{flex-direction:row;padding:0;gap:9px}
  .marque .rond-logo{width:34px;height:34px}
  .marque .role{display:none}
  .cote nav{flex-direction:row;gap:2px}
  .cote nav button span.lib{display:none}
  .cote .bas{margin:0 0 0 auto;padding:0;border:0}
  .profil{display:none}
  .entete,main,footer{padding-left:16px;padding-right:16px}
}

/* ---------- Cartes ---------- */
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:var(--r);
  box-shadow:var(--ombre);padding:18px}
.carte + .carte{margin-top:16px}
.carte .tete{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.carte .tete h2{margin:0;flex:1}
.grille{display:grid;gap:16px}
@media(min-width:1000px){
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
}

/* ---------- Tuiles d'accueil ---------- */
.tuiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));margin-bottom:16px}
.tuile{display:flex;align-items:center;gap:13px;background:var(--carte);border:1px solid var(--bord);
  border-radius:var(--r);box-shadow:var(--ombre);padding:15px 16px;cursor:pointer;
  font:inherit;color:inherit;text-align:left;width:100%}
.tuile:hover{border-color:var(--accent)}
.tuile.actif{border-color:var(--accent);background:var(--accent-doux);box-shadow:none}
.tuile .rond.gris{background:var(--gris)}
.tuile .rond.rouge{background:var(--rouge)}
.tuile .rond{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;color:#fff;flex:none}
.tuile .rond.bleu{background:var(--accent)} .tuile .rond.vert{background:var(--vert)}
.tuile .rond.orange{background:#e08a1e} .tuile .rond.violet{background:var(--violet)}
.tuile .txt{flex:1;min-width:0}
.tuile .t{display:block;font-weight:600;font-size:14px}
.tuile .v{display:block;font-size:13px;color:var(--doux);margin-top:1px}
.tuile .v b{font-size:20px;color:var(--texte);margin-right:4px;vertical-align:-1px}
.tuile .fleche{color:var(--doux)}
/* Variante d'information : pas de chevron, donc pas cliquable, et le nombre
   prend toute la place parce que c'est lui qu'on vient lire. */
.tuile.stat{cursor:default}
.tuile.stat:hover{border-color:var(--bord)}
.tuile.stat .rond{font-size:19px;font-weight:700;line-height:1}
.tuile.stat .n{display:block;font-size:26px;font-weight:700;line-height:1.2;margin-top:1px}
.tuile.stat .n.bleu{color:var(--accent)} .tuile.stat .n.vert{color:var(--vert)}
.tuile.stat .n.rouge{color:var(--rouge)} .tuile.stat .n.orange{color:var(--orange)}
.tuile.stat .s{display:block;font-size:12px;color:var(--doux)}

/* ---------- Listes ---------- */
ul.liste{list-style:none;margin:0;padding:0}
ul.liste li{padding:11px 0;border-top:1px solid var(--bord);display:flex;gap:11px;align-items:center}
ul.liste li:first-child{border-top:0;padding-top:2px}
ul.liste li:last-child{padding-bottom:2px}
/* Deux tailles seulement : « ligne » dans un tableau ou une liste,
   « carte » en tête d'une fiche. La couleur, elle, dépend du nom. */
.avatar{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;font-weight:700;font-size:12px;color:#fff;flex:none;letter-spacing:.02em}
.avatar.carte-av{width:40px;height:40px;font-size:14px}
.ligne-nom{display:flex;align-items:center;gap:10px}
.decale{margin-left:5px}
input.coche{width:auto;margin-top:3px}
input.coche-tache{width:auto}
select.tri-court{width:auto;margin-left:5px}
.aide.chapeau{margin:-6px 0 14px}
.pousse{margin-left:auto}
.lien{background:none;border:0;color:var(--accent);font:inherit;font-size:13.5px;cursor:pointer;
  padding:12px 0 0;display:inline-block}
.lien:hover{text-decoration:underline}
.rien{color:var(--doux);font-size:13.5px;font-style:italic;padding:8px 0}

/* ---------- Accès rapides ---------- */
.rapides{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.rapide{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:16px 8px;
  cursor:pointer;font:inherit;font-size:13px;color:var(--texte);text-align:center}
.rapide:hover{border-color:var(--accent);background:var(--accent-doux)}
.rapide .ic{color:var(--accent)}
.rapide.vert .ic{color:var(--vert)} .rapide.orange .ic{color:#e08a1e}
.rapide.violet .ic{color:var(--violet)}

/* ---------- Tableaux ---------- */
.tableau-enveloppe{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--doux);
  padding:8px 10px;border-bottom:1px solid var(--bord);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--bord);vertical-align:middle}
tbody tr:hover{background:var(--accent-doux)}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.vide{padding:30px 10px;text-align:center;color:var(--doux);font-style:italic}

/* ---------- Étiquettes ---------- */
.et{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.et.vert{background:var(--vert-f);color:var(--vert)}
.et.orange{background:var(--orange-f);color:var(--orange)}
.et.rouge{background:var(--rouge-f);color:var(--rouge)}
.et.gris{background:var(--gris-f);color:var(--gris)}
.et.info{background:var(--accent-doux);color:var(--accent)}
.puce{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.puce.vert{background:var(--vert)} .puce.orange{background:#e08a1e}
.puce.rouge{background:var(--rouge)} .puce.gris{background:var(--gris)}
.puce.info{background:var(--accent)}

/* ---------- Boutons ---------- */
button.b{display:inline-flex;align-items:center;gap:6px;background:var(--carte);color:var(--texte);
  border:1px solid var(--bord);border-radius:9px;padding:7px 13px;font:inherit;font-size:13.5px;cursor:pointer}
button.b:hover{background:var(--accent-doux);border-color:var(--accent)}
button.b.primaire{background:var(--accent);border-color:var(--accent);color:#fff}
button.b.primaire:hover{filter:brightness(1.08)}
button.b.danger{color:var(--rouge)}
button.b.danger:hover{background:var(--rouge-f);border-color:var(--rouge)}
button.b.mini{padding:3px 9px;font-size:12.5px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
td .actions{flex-wrap:nowrap;justify-content:flex-end}
td:last-child{white-space:nowrap}
.barre{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}

/* ---------- Formulaires ---------- */
input[type=text],input[type=date],input[type=time],input[type=number],input[type=search],select,textarea{
  font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--bord);border-radius:9px;
  background:var(--carte);color:var(--texte);width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
label.champ{display:block;margin-bottom:12px}
label.champ>span{display:block;font-size:12.5px;color:var(--doux);margin-bottom:4px}
.ligne{display:grid;gap:12px}
@media(min-width:560px){.ligne.c2{grid-template-columns:1fr 1fr}.ligne.c3{grid-template-columns:1fr 1fr 1fr}}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{display:flex;align-items:center;gap:6px;border:1px solid var(--bord);border-radius:9px;
  padding:7px 12px;cursor:pointer;font-size:13.5px}
.radios input{width:auto;margin:0}
.aide{font-size:12.5px;color:var(--doux);margin:5px 0 0}

/* ---------- Modale ---------- */
.voile{position:fixed;inset:0;background:rgba(8,18,30,.55);display:flex;align-items:flex-start;
  justify-content:center;padding:26px 14px;overflow:auto;z-index:100}
.modale{background:var(--carte);border-radius:var(--r);box-shadow:0 20px 55px rgba(0,0,0,.32);
  width:100%;max-width:620px;border:1px solid var(--bord)}
.modale header{padding:18px 20px 0}
.modale header h2{margin:0}
.modale .corps{padding:14px 20px}
.modale .pied{padding:14px 20px;border-top:1px solid var(--bord);display:flex;gap:8px;justify-content:flex-end}

/* ---------- Notifications ---------- */
.filtres{display:flex;gap:6px;flex-wrap:wrap}
.filtres button{border:1px solid var(--bord);background:var(--carte);color:var(--doux);
  border-radius:20px;padding:5px 14px;font:inherit;font-size:13px;cursor:pointer}
.filtres button.actif{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.cartes{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.cartes{grid-template-columns:1fr 1fr}}
@media(min-width:1150px){.cartes{grid-template-columns:1fr 1fr 1fr}}
.fiche{border:1px solid var(--bord);border-left:5px solid var(--gris);border-radius:12px;
  background:var(--carte);padding:13px 15px}
.fiche.vert{border-left-color:var(--vert)} .fiche.orange{border-left-color:#e08a1e}
.fiche.rouge{border-left-color:var(--rouge)}
.fiche .haut{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.fiche .nom{font-weight:700;font-size:14.5px}
.fiche .etat{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:7px;margin-bottom:3px}
.fiche .etat.vert{color:var(--vert)} .fiche .etat.orange{color:var(--orange)}
.fiche .etat.rouge{color:var(--rouge)} .fiche .etat.gris{color:var(--gris)}
.fiche .marque-etat{font-size:16px;line-height:1}
.fiche .detail{font-size:12.5px;color:var(--doux);margin-bottom:10px}

/* ---------- Calendrier des rapports ---------- */
.mois-grille{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:720px){.mois-grille{grid-template-columns:1fr 1fr}}
@media(min-width:1100px){.mois-grille{grid-template-columns:repeat(3,1fr)}}
.mois{border:1px solid var(--bord);border-radius:12px;background:var(--carte);overflow:hidden}
.mois>.tete-mois{padding:8px 13px;background:var(--gris-f);font-weight:700;font-size:13.5px;
  display:flex;justify-content:space-between;align-items:baseline}
.mois>.tete-mois.courant{background:var(--accent-doux);color:var(--accent)}
.mois .part{padding:9px 13px;border-top:1px solid var(--bord)}
.mois .part .lib{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--doux);margin-bottom:4px}
.mois .part .item{font-size:13px;padding:3px 0;display:flex;align-items:center;gap:6px;cursor:pointer}
.mois .part .item input{width:auto;margin:0;flex:none}
.mois .part .item.envoye{color:var(--doux);text-decoration:line-through}
.mois .part .item.retard{color:var(--rouge);font-weight:600}
.mois .rien-mois{padding:10px 13px;color:var(--doux);font-size:12.5px;font-style:italic}

/* ---------- Droits de visite ---------- */
/* La liste des enfants à gauche, le dossier de celui qu'on a choisi à droite. */
@media(min-width:1050px){
  .grille.dv{grid-template-columns:288px minmax(0,1fr);align-items:start}
}
.liste-enfants{display:flex;flex-direction:column;max-height:520px;overflow-y:auto;margin:0 -4px}
.le{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;
  background:none;border:0;border-left:3px solid transparent;border-radius:10px;
  padding:9px 10px;cursor:pointer}
.le:hover{background:var(--fond)}
.le.actif{background:var(--accent-doux);border-left-color:var(--accent)}
.le-nom{display:block;font-weight:600;font-size:13.5px;line-height:1.25}
.le-sous{display:block;font-size:12px;color:var(--doux)}
.le-sous.orange{color:var(--orange)}
.lien-nom{background:none;border:0;padding:0;font:inherit;font-size:12.5px;color:var(--accent);
  cursor:pointer;text-decoration:underline}

.dv-tete{flex-wrap:wrap}
.dv-tete h2{flex:none}
.dv-droit{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--bord);
  font-size:13px}
.dv-droit:last-of-type{padding-bottom:14px}
.rond-parent{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;
  justify-content:center;flex:none;background:var(--gris-f);color:var(--doux)}
.rond-parent.papa{background:var(--accent-doux);color:var(--accent)}
.rond-parent.maman{background:#fdeaf0;color:#b03a5b}
.rond-parent.fratrie{background:var(--violet-f);color:var(--violet)}

/* Les onglets du dossier : le trait sous l'onglet actif, rien d'autre. */
.onglets-d{display:flex;gap:4px;border-bottom:1px solid var(--bord);margin-bottom:14px}
.onglets-d button{background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;
  font:inherit;font-size:13.5px;color:var(--doux);padding:9px 12px;cursor:pointer}
.onglets-d button:hover{color:var(--texte)}
.onglets-d button.actif{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

.rdv{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid var(--bord)}
.rdv:first-of-type{border-top:0}
.rdv-qui{font-weight:600;font-size:13.5px}

.schema{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:620px){.schema{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.schema{grid-template-columns:repeat(4,1fr)}}
.sem{border:1px solid var(--bord);border-radius:12px;overflow:hidden;background:var(--carte)}
.sem-tete{background:var(--marine);color:#fff;font-weight:600;font-size:13.5px;padding:9px 12px;text-align:center}
.sem-corps{padding:10px;display:flex;flex-direction:column;gap:9px;min-height:70px}
.sem-vide{color:var(--doux);font-size:12.5px;text-align:center;padding:12px 0}
.creneau{border-radius:10px;padding:10px 11px;border:1px solid transparent}
.creneau.papa{background:var(--accent-doux);border-color:rgba(47,111,176,.3)}
.creneau.maman{background:#fdeaf0;border-color:rgba(176,58,91,.28)}
.creneau.fratrie{background:var(--violet-f);border-color:rgba(113,67,184,.28)}
.creneau.autre{background:var(--gris-f);border-color:var(--bord)}
@media (prefers-color-scheme: dark){
  .creneau.maman{background:#3a2029;border-color:rgba(240,138,138,.3)}
  .rond-parent.maman{background:#3a2029;color:#f08a8a}
}
.creneau.barre{opacity:.72}
.cr-haut{display:flex;align-items:center;gap:7px}
.cr-nom{font-weight:700;font-size:13.5px}
.cr-h{font-size:13px;font-variant-numeric:tabular-nums;margin:3px 0 1px}
.cr-bas{font-size:12px;color:var(--doux);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.pastille-date{display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:46px;flex:none;background:var(--fond);border:1px solid var(--bord);border-radius:9px;padding:5px 0}
.pastille-date .j{font-size:9.5px;letter-spacing:.05em;color:var(--doux);font-weight:700}
.pastille-date .n{font-size:17px;font-weight:700;line-height:1.1}
.pastille-date .m{font-size:9.5px;letter-spacing:.05em;color:var(--doux);font-weight:700}
.choix-rapides{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.choix-rapides button{border:1px solid var(--bord);background:var(--carte);color:var(--doux);
  border-radius:20px;padding:5px 13px;font:inherit;font-size:13px;cursor:pointer}
.choix-rapides button:hover{background:var(--accent-doux);border-color:var(--accent);color:var(--accent)}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:2px;

<script>
"use strict";

/* =========================================================================
   1. OUTILS GÉNÉRAUX
   ========================================================================= */

const JOURS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const MOIS  = ["janvier","février","mars","avril","mai","juin","juillet","août",
               "septembre","octobre","novembre","décembre"];

const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);

function ech(v){
  return String(v == null ? "" : v)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* --- Dates : chaînes ISO "AAAA-MM-JJ", calculs en heure locale --- */
function dISO(d){
  const p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate());
}
function parseISO(s){
  const [a,m,j] = String(s).split("-").map(Number);
  return new Date(a, m-1, j);
}
const aujourdHui = () => dISO(new Date());
const estISO = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ""));

function fmtFR(s){
  if(!estISO(s)) return "—";
  const [a,m,j] = s.split("-");
  return j + "/" + m + "/" + a;
}
function fmtLong(s){
  if(!estISO(s)) return "—";
  const d = parseISO(s);
  return JOURS[(d.getDay()+6)%7] + " " + d.getDate() + " " + MOIS[d.getMonth()] + " " + d.getFullYear();
}
function joursEntre(a,b){ return Math.round((parseISO(b) - parseISO(a)) / 86400000); }

/** Décale une date de n mois, en ramenant au dernier jour du mois si besoin. */
function decalerMois(iso, n){
  const d = parseISO(iso);
  const jour = d.getDate();
  const cible = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const dernier = new Date(cible.getFullYear(), cible.getMonth()+1, 0).getDate();
  cible.setDate(Math.min(jour, dernier));
  return dISO(cible);
}
const decalerAns = (iso, n) => decalerMois(iso, 12*n);
function decalerJours(iso, n){ const d = parseISO(iso); d.setDate(d.getDate()+n); return dISO(d); }
function pluriel(n, mot, plur){ return n + " " + (Math.abs(n) > 1 ? (plur || mot+"s") : mot); }

/* =========================================================================
   2. DONNÉES
   ========================================================================= */

const CLE = "fa-dossiers-v2";
let DB = null;
let onglet = "accueil";
let etat = { recherche:"", tri:"nom", tachesFaites:false, anneeRapports:0,
             filtreNotif:"tout", filtreVisite:"tout", ouvertes:{},
             enfantVisite:"", ongletVisite:"prochaines" };

function baseVide(){
  return {
    version: 2,
    parametres: { seuilAlerteJours:30, seuilRapportJours:45,
                  utilisateur:{ nom:"Cédric P.", fonction:"Intervenant SAAF" } },
    enfants: [], taches: []
  };
}
function normaliser(d){
  const r = Object.assign(baseVide(), d || {});
  r.parametres = Object.assign(baseVide().parametres, (d && d.parametres) || {});
  r.parametres.utilisateur = Object.assign(
    { nom:"Cédric P.", fonction:"Intervenant SAAF" }, r.parametres.utilisateur || {});
  r.enfants = Array.isArray(r.enfants) ? r.enfants : [];
  r.taches  = Array.isArray(r.taches)  ? r.taches  : [];
  r.enfants.forEach(e => {
    e.relances   = Array.isArray(e.relances)   ? e.relances   : [];
    e.historique = Array.isArray(e.historique) ? e.historique : [];
    e.rapports   = Array.isArray(e.rapports)   ? e.rapports   : [];
    e.visites    = Array.isArray(e.visites)    ? e.visites    : [];
    if(e.notifRecue === undefined) e.notifRecue = true;
    e.visites.forEach(v => {
      v.rencontres = Array.isArray(v.rencontres) ? v.rencontres : [];
      v.creneaux    = Array.isArray(v.creneaux)    ? v.creneaux    : [];
      v.partageAvec = Array.isArray(v.partageAvec) ? v.partageAvec : [];
      v.sansEncadrement = !!v.sansEncadrement;
      v.rencontres.forEach(r => { if(!r.presence) r.presence = "venu"; });
    });
  });
  return r;
}

function charger(){
  try{
    const brut = localStorage.getItem(CLE);
    if(brut){ DB = normaliser(JSON.parse(brut)); return; }
  }catch(e){ console.warn("Lecture impossible :", e); }
  DB = donneesInitiales();
  sauver();
}
function sauver(){
  DB.modifieLe = new Date().toISOString();
  try{ localStorage.setItem(CLE, JSON.stringify(DB)); }
  catch(e){ console.warn("Copie navigateur impossible :", e); }
  fsPlanifierEcriture();
}
function maj(){ DB.initial = false; sauver(); rendre(); }

/* Redessin groupé : plusieurs clics rapprochés ne provoquent qu'un seul
   redessin, une fois l'utilisateur arrêté. */
let minuteurRendu = null;
function rendreBientot(){
  clearTimeout(minuteurRendu);
  minuteurRendu = setTimeout(() => { minuteurRendu = null; rendre(); }, 350);
}

const enfantParId = id => DB.enfants.find(e => e.id === id);
const nomComplet  = e => e ? ((e.nom||"") + " " + (e.prenom||"")).trim() : "";
/** Classement par nom de famille, puis par prénom. */
const parNom = (a,b) => nomComplet(a).localeCompare(nomComplet(b), "fr");

/* =========================================================================
   3. ENREGISTREMENT DANS UN VRAI FICHIER SUR LE DISQUE
   ========================================================================= */

const NOM_FICHIER    = "donnees-dossiers.json";
const DOSSIER_SAUV   = "sauvegardes";
const NB_SAUVEGARDES = 60;

/* Deux modes :
   — NATIF : le programme est installé, il écrit directement sur le disque ;
   — navigateur : la page demande l'accès à un dossier (Chrome / Edge). */
const NATIF = !!(window.programme && window.programme.natif);

const FS = {
  natif: NATIF,
  dispo: NATIF || typeof window.showDirectoryPicker === "function",
  dossier:null, enAttente:null, nom:"", chemin:"", fichier:"", dernier:null, erreur:"",
  enCours:false, aRefaire:false, dernierBackup:0
};

function idbOuvrir(){
  return new Promise((res, rej) => {
    const q = indexedDB.open("fa-dossiers-config", 1);
    q.onupgradeneeded = () => q.result.createObjectStore("cfg");
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
function idbEcrire(cle, valeur){
  return idbOuvrir().then(d => new Promise((res, rej) => {
    const t = d.transaction("cfg","readwrite");
    t.objectStore("cfg").put(valeur, cle);
    t.oncomplete = () => { d.close(); res(); };
    t.onerror = () => { d.close(); rej(t.error); };
  }));
}
function idbLire(cle){
  return idbOuvrir().then(d => new Promise((res, rej) => {
    const t = d.transaction("cfg","readonly");
    const q = t.objectStore("cfg").get(cle);
    q.onsuccess = () => { d.close(); res(q.result || null); };
    q.onerror = () => { d.close(); rej(q.error); };
  }));
}
function idbEffacer(cle){
  return idbOuvrir().then(d => new Promise(res => {
    const t = d.transaction("cfg","readwrite");
    t.objectStore("cfg").delete(cle);
    t.oncomplete = () => { d.close(); res(); };
    t.onerror = () => { d.close(); res(); };
  }));
}

const heureCourte = d => String(d.getHours()).padStart(2,"0") + "h" + String(d.getMinutes()).padStart(2,"0");
const nomDeChemin = c => String(c||"").replace(/[\\/]+$/,"").split(/[\\/]/).pop() || c;

/* ------------------------------ mode programme installé ------------------ */

async function natifDemarrer(){
  const r = await window.programme.lire();
  natifRetenir(r);
  if(!r.ok){
    FS.erreur = r.erreur || "lecture impossible";
  }else if(r.contenu){
    try{
      const d = JSON.parse(r.contenu);
      if(!d || !Array.isArray(d.enfants)) throw new Error("contenu inattendu");
      DB = normaliser(d);
      try{ localStorage.setItem(CLE, JSON.stringify(DB)); }catch(e){}
    }catch(e){ FS.erreur = "Fichier illisible (" + e.message + ")"; }
  }else{
    await fsEcrire();          // premier lancement : on crée le fichier
  }
  rendre();
}
function natifRetenir(r){
  if(!r) return;
  FS.chemin  = r.dossier || FS.chemin;
  FS.fichier = r.fichier || FS.fichier;
  FS.nom     = nomDeChemin(FS.chemin);
  FS.dossier = FS.chemin;
}
async function natifChangerDossier(){
  const r = await window.programme.changerDossier();
  natifRetenir(r);
  if(r.ok) await fsEcrire();   // on dépose les données dans le nouveau dossier
  rendre();
}
async function natifRelire(){
  const r = await window.programme.lire();
  if(r.ok && r.contenu){
    try{
      const d = JSON.parse(r.contenu);
      if(d && Array.isArray(d.enfants)){
        DB = normaliser(d);
        try{ localStorage.setItem(CLE, JSON.stringify(DB)); }catch(e){}
      }
    }catch(e){ alert("Fichier illisible : " + e.message); }
  }
  rendre();
}

/* ------------------------------ mode navigateur -------------------------- */

async function fsReconnecter(silencieux){
  if(!FS.dispo || NATIF) return;
  let h = null;
  try{ h = await idbLire("dossier"); }catch(e){ return; }
  if(!h) return;
  FS.nom = h.name;
  let droit = "prompt";
  try{
    droit = silencieux ? await h.queryPermission({ mode:"readwrite" })
                       : await h.requestPermission({ mode:"readwrite" });
  }catch(e){ droit = "prompt"; }
  if(droit === "granted"){
    FS.dossier = h; FS.enAttente = null; FS.erreur = "";
    await fsLire();
  }else{
    FS.enAttente = h;
  }
  majEtatStockage();
}

async function fsChoisir(){
  if(!FS.dispo) return;
  let h;
  try{ h = await window.showDirectoryPicker({ id:"dossiers-fa", mode:"readwrite", startIn:"documents" }); }
  catch(e){ return; }
  FS.dossier = h; FS.enAttente = null; FS.nom = h.name; FS.erreur = "";
  try{ await idbEcrire("dossier", h); }catch(e){}
  const trouve = await fsLire();
  if(!trouve) await fsEcrire();
  majEtatStockage();
  alert(trouve
    ? "Dossier connecté. Les données du fichier « " + NOM_FICHIER + " » ont été chargées."
    : "Dossier connecté. Vos données sont enregistrées dans « " + NOM_FICHIER +
      " », automatiquement, à chaque modification.");
}

async function fsLire(){
  if(!FS.dossier) return false;
  let fh;
  try{ fh = await FS.dossier.getFileHandle(NOM_FICHIER); }catch(e){ return false; }
  try{
    const d = JSON.parse(await (await fh.getFile()).text());
    if(!d || !Array.isArray(d.enfants)) throw new Error("contenu inattendu");
    const localPlusRecent = DB && !DB.initial && DB.modifieLe &&
                            (!d.modifieLe || DB.modifieLe > d.modifieLe);
    if(localPlusRecent){
      await fsEcrire();
    }else{
      DB = normaliser(d);
      try{ localStorage.setItem(CLE, JSON.stringify(DB)); }catch(e){}
      rendre();
    }
    return true;
  }catch(e){
    FS.erreur = "Fichier illisible (" + e.message + ")";
    return true;
  }
}

let minuteurEcriture = null;
function fsPlanifierEcriture(){
  if(!FS.dossier) return;
  clearTimeout(minuteurEcriture);
  minuteurEcriture = setTimeout(fsEcrire, 300);
}
async function fsEcrire(){
  if(!FS.dossier) return;
  if(FS.enCours){ FS.aRefaire = true; return; }
  FS.enCours = true;
  const contenu = JSON.stringify(DB, null, 2);
  if(NATIF){
    const r = await window.programme.ecrire(contenu);
    if(r.ok){
      FS.dernier = new Date(r.heure);
      FS.erreur = "";
      natifRetenir(r);
    }else{
      FS.erreur = r.erreur || "écriture impossible";
    }
  }else{
    try{
      const fh = await FS.dossier.getFileHandle(NOM_FICHIER, { create:true });
      const flux = await fh.createWritable();
      await flux.write(contenu);
      await flux.close();
      FS.dernier = new Date();
      FS.erreur = "";
      await fsSauvegardeDuJour(contenu);
    }catch(e){ FS.erreur = e.message || "écriture impossible"; }
  }
  FS.enCours = false;
  majEtatStockage();
  if(FS.aRefaire){ FS.aRefaire = false; fsPlanifierEcriture(); }
}
async function fsSauvegardeDuJour(contenu, forcer){
  if(NATIF){ await window.programme.sauvegarder(contenu || JSON.stringify(DB,null,2)); return; }
  if(!forcer && Date.now() - FS.dernierBackup < 120000) return;
  FS.dernierBackup = Date.now();
  try{
    const dir = await FS.dossier.getDirectoryHandle(DOSSIER_SAUV, { create:true });
    const fh = await dir.getFileHandle("donnees-" + aujourdHui() + ".json", { create:true });
    const flux = await fh.createWritable();
    await flux.write(contenu);
    await flux.close();
    const noms = [];
    for await (const nom of dir.keys()){
      if(/^donnees-\d{4}-\d{2}-\d{2}\.json$/.test(nom)) noms.push(nom);
    }
    noms.sort();
    for(const n of noms.slice(0, Math.max(0, noms.length - NB_SAUVEGARDES))) await dir.removeEntry(n);
  }catch(e){ /* la copie de secours ne bloque jamais l'enregistrement principal */ }
}

function majEtatStockage(){
  const n = document.getElementById("etat-stockage");
  if(!n) return;
  let couleur, texte, bouton = "";
  if(NATIF){
    if(FS.erreur){
      couleur = "rouge"; texte = "Enregistrement bloqué";
      bouton = '<button class="b mini" data-fs="aide">Voir</button>';
    }else{
      couleur = "vert";
      texte = "<b>" + ech(FS.nom) + "</b>" + (FS.dernier ? " · enregistré à " + heureCourte(FS.dernier) : "");
      bouton = '<button class="b mini" data-fs="ouvrir">Ouvrir le dossier</button>';
    }
    n.innerHTML = '<span class="puce ' + couleur + '"></span><span>' + texte + "</span>" + bouton;
    return;
  }
  if(!FS.dispo){
    couleur = "orange"; texte = "Enregistré dans le navigateur";
    bouton = '<button class="b mini" data-fs="aide">Pourquoi ?</button>';
  }else if(FS.erreur){
    couleur = "rouge"; texte = "Enregistrement bloqué";
    bouton = '<button class="b mini" data-fs="choisir">Corriger</button>';
  }else if(FS.dossier){
    couleur = "vert";
    texte = "<b>" + ech(FS.nom) + "</b>" + (FS.dernier ? " · enregistré à " + heureCourte(FS.dernier) : "");
  }else if(FS.enAttente){
    couleur = "orange"; texte = "<b>" + ech(FS.nom) + "</b> à reconnecter";
    bouton = '<button class="b mini" data-fs="reconnecter">Reconnecter</button>';
  }else{
    couleur = "orange"; texte = "Pas encore de fichier sur le disque";
    bouton = '<button class="b mini" data-fs="choisir">Choisir un dossier</button>';
  }
  n.innerHTML = '<span class="puce ' + couleur + '"></span><span>' + texte + "</span>" + bouton;
}

/* =========================================================================
   4. ICÔNES, AVATARS, ÂGES
   ========================================================================= */

const TRACES = {
  accueil:  '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',

  rapports: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/>',

  reglages: '<path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M1 14h6"/><path d="M9 8h6"/><path d="M17 16h6"/>',
  dossier:  '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  plus:     '<path d="M12 5v14"/><path d="M5 12h14"/>',
  fleche:   '<path d="M9 18l6-6-6-6"/>',
  cadenas:  '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  personne: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>',
  horloge:  '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'
};
function ic(nom, taille){
  const t = taille || 18;
  return '<svg viewBox="0 0 24 24" width="' + t + '" height="' + t + '" fill="none" ' +
    'stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' +
    (TRACES[nom] || "") + "</svg>";
}

const COULEURS = ["#2f6fb0","#1f8a4c","#b4632a","#7143b8","#0f7c8a","#b03a5b","#4a6480","#a06a12"];
/** format : "ligne" (défaut, dans un tableau ou une liste) ou "carte" (en tête de fiche). */
function avatar(e, format){
  const p = (e.prenom || "").trim(), n = (e.nom || "").trim();
  const ini = ((n[0] || "") + (p[0] || n[1] || "")).toUpperCase() || "?";
  const cle = nomComplet(e) || "?";
  let h = 0;
  for(let i = 0; i < cle.length; i++) h = (h * 31 + cle.charCodeAt(i)) >>> 0;
  return '<span class="avatar' + (format === "carte" ? " carte-av" : "") +
    '" style="background:' + COULEURS[h % COULEURS.length] + '">' + ech(ini) + "</span>";
}

function age(naissance){
  if(!estISO(naissance)) return null;
  const n = parseISO(naissance), a = new Date();
  let x = a.getFullYear() - n.getFullYear();
  const m = a.getMonth() - n.getMonth();
  if(m < 0 || (m === 0 && a.getDate() < n.getDate())) x--;
  return x >= 0 ? x : null;
}
const ageTexte = e => { const a = age(e.naissance); return a == null ? "âge à compléter" : a + " ans"; };

/** « Vendredi 16/05 » — repère court pour les visites à venir. */
function jourCourt(iso){
  const d = parseISO(iso);
  const p = n => String(n).padStart(2,"0");
  return JOURS[(d.getDay()+6)%7] + " " + p(d.getDate()) + "/" + p(d.getMonth()+1);
}

/* =========================================================================
   5. ÉCHÉANCES : notification, rapports, droits de visite
   ========================================================================= */

const ORDRE_STATUT = { rouge:0, orange:1, gris:2, vert:3 };

function statutEcheance(date, seuil){
  if(!estISO(date)) return { code:"gris", label:"Date à encoder", jours:null };
  const s = seuil == null ? DB.parametres.seuilAlerteJours : seuil;
  const j = joursEntre(aujourdHui(), date);
  if(j < 0)   return { code:"rouge",  label:"En retard de " + pluriel(-j,"jour"), jours:j };
  if(j === 0) return { code:"orange", label:"Aujourd'hui", jours:0 };
  if(j <= s)  return { code:"orange", label:"Dans " + pluriel(j,"jour"), jours:j };
  return { code:"vert", label:"Dans " + pluriel(j,"jour"), jours:j };
}

/* --- Notification de prise en charge --- */
function statutNotif(e){
  if(!estISO(e.notifFin))
    return { code:"gris", marque:"?", titre:"Pas de date encodée",
             detail:"Complétez la fiche dans l'onglet Enfants." };
  const j = joursEntre(aujourdHui(), e.notifFin);
  if(j < 0)
    return { code:"rouge", marque:"✕", titre:"Notification à réclamer",
             detail:"Échéance dépassée depuis " + pluriel(-j,"jour") + ".", jours:j };
  if(e.notifRecue === false)
    return { code:"rouge", marque:"✕", titre:"Pas encore reçue",
             detail:"Attendue pour le " + fmtFR(e.notifFin) + ".", jours:j };
  if(j <= DB.parametres.seuilAlerteJours)
    return { code:"orange", marque:"!", titre:"Renouvellement proche",
             detail:"Valable encore " + pluriel(j,"jour") + ".", jours:j };
  return { code:"vert", marque:"✓", titre:"Reçue",
           detail:"Valable jusqu'au " + fmtFR(e.notifFin) + ".", jours:j };
}

/* --- Rapports : l'annuel à la date de formalisation, le semestriel six mois plus tôt --- */
const RATTRAPAGE_RAPPORT = 60;

/** Date de reference du rapport annuel : celle fixee a la main si elle existe,
    sinon la date de notification de prise en charge. */
const baseRapport = e => estISO(e.rapportAnnuel) ? e.rapportAnnuel
                       : (estISO(e.notifFin) ? e.notifFin : null);

/** Ce rapport a-t-il été coché comme envoyé pour cette échéance ? */
const rapportEnvoye = (e, type, echeance) =>
  (e.rapports||[]).some(r => r.type === type && r.echeance === echeance && estISO(r.envoyeLe));

/** Toutes les échéances d'un rapport comprises dans une période. */
function occurrencesRapport(e, type, debut, fin){
  const base = baseRapport(e);
  if(!base) return [];
  let d = type === "annuel" ? base : decalerMois(base, -6);
  let garde = 0;
  while(d > debut && garde++ < 80) d = decalerAns(d, -1);
  const l = [];
  garde = 0;
  while(d <= fin && garde++ < 40){
    if(d >= debut) l.push(d);
    d = decalerAns(d, 1);
  }
  return l;
}

/** Échéance en cours : la première qui n'a pas été cochée comme envoyée.
    Tant que rien n'a jamais été coché pour cet enfant, on ne remonte pas
    au-delà de RATTRAPAGE_RAPPORT jours, pour ne pas réclamer d'anciens rapports. */
function echeanceRapport(e, type){
  const base = baseRapport(e);
  if(!base) return null;
  let d = type === "annuel" ? base : decalerMois(base, -6);
  const suivi = (e.rapports||[]).some(r => r.type === type);
  const limite = suivi ? decalerAns(aujourdHui(), -5)
                       : decalerJours(aujourdHui(), -RATTRAPAGE_RAPPORT);
  let garde = 0;
  while(d < limite && garde++ < 80) d = decalerAns(d, 1);
  garde = 0;
  while(rapportEnvoye(e, type, d) && garde++ < 40) d = decalerAns(d, 1);
  return d;
}
/** Rapports en cours, non cochés, dont l'échéance tombe d'ici « jours ».
    Sans argument : tous, y compris ceux qui sont en retard. */
function rapportsDus(jours){
  const limite = jours == null ? null : decalerJours(aujourdHui(), jours);
  const l = [];
  DB.enfants.forEach(e => ["semestriel","annuel"].forEach(type => {
    const d = echeanceRapport(e, type);
    if(!d || (limite && d > limite)) return;
    l.push({ enfant:e, type, date:d, st:statutEcheance(d, DB.parametres.seuilRapportJours) });
  }));
  return l.sort((a,b) => a.date.localeCompare(b.date));
}
const rapportsAPreparer = () => rapportsDus(DB.parametres.seuilRapportJours);
const rapportsEnRetard  = () => rapportsDus(null).filter(o => o.date < aujourdHui());
const nomRapport = t => t === "annuel" ? "Rapport annuel" : "Rapport semestriel";

/** Ligne cochable, utilisée dans « À faire » comme dans l'onglet Rapports. */
function ligneRapport(o){
  const retard = o.date < aujourdHui();
  return `<li>
    <input type="checkbox" data-action="rapport-envoye" data-id="${o.enfant.id}"
           data-type="${o.type}" data-date="${o.date}" class="coche"
           aria-label="Marquer le rapport comme envoyé">
    <div class="extensible">
      <b>${ech(nomComplet(o.enfant))}</b>
      <span class="doux pt">${o.enfant.service ? " · " + ech(o.enfant.service) : ""}</span><br>
      <span class="pt doux">${ech(nomRapport(o.type))} — à rendre pour le ${ech(fmtFR(o.date))}</span>
    </div>
    <span class="et ${retard ? "rouge" : o.st.code}">${
      retard ? "En retard de " + pluriel(joursEntre(o.date, aujourdHui()),"jour") : ech(o.st.label)}</span>
  </li>`;
}

/* --- Droits de visite --- */
const libelleParent = v => v.parent && v.parent.trim() ? v.parent.trim() : "Parent à préciser";
const PRESENCES = {
  prevue:  { label:"Rencontre prévue",  court:"Prévue",  code:"info"  },
  venu:    { label:"Parent venu",       court:"Venu",    code:"vert"  },
  absent:  { label:"Parent absent",     court:"Absent",  code:"rouge" },
  annulee: { label:"Rencontre annulée", court:"Annulée", code:"gris"  }
};
const presenceDe = r => PRESENCES[r.presence] || PRESENCES.venu;
const heuresDe = r => (r.debut ? r.debut + (r.fin ? " – " + r.fin : "") : "");
const aCompleter = r => r.presence === "prevue" && estISO(r.date) && r.date < aujourdHui();

function toutesRencontres(){
  const l = [];
  DB.enfants.forEach(e => (e.visites||[]).forEach(v => (v.rencontres||[]).forEach(r =>
    l.push({ enfant:e, visite:v, rencontre:r }))));
  return l;
}
const rencontresAVenir = () => toutesRencontres()
  .filter(o => estISO(o.rencontre.date) && o.rencontre.date >= aujourdHui() &&
               o.rencontre.presence === "prevue")
  .sort((a,b) => a.rencontre.date.localeCompare(b.rencontre.date) ||
                 String(a.rencontre.debut||"").localeCompare(String(b.rencontre.debut||"")));

function tachesEnCours(){
  const auj = aujourdHui();
  return DB.taches.filter(t => !t.fait)
    .sort((a,b) => String(a.echeance||"9999").localeCompare(String(b.echeance||"9999")) ||
                   String(a.texte).localeCompare(String(b.texte)))
    .map(t => Object.assign({}, t, {
      enRetard: estISO(t.echeance) && t.echeance < auj,
      pourAuj:  t.echeance === auj,
      demain:   t.echeance === decalerJours(auj, 1)
    }));
}

const prenomUtilisateur = () => (DB.parametres.utilisateur.nom || "").trim().split(" ")[0] || "";

let remonterEnHaut = false;   // vrai uniquement quand on change d'écran

/* La position de défilement est suivie au fil de l'eau : la lire pendant un
   redessin obligerait le navigateur à recalculer toute la mise en page. */
let positionPage = 0;
window.addEventListener("scroll", () => { positionPage = window.scrollY; }, { passive:true });

function rendre(){
  const positionAvant = positionPage;
  const aFaire = tachesEnCours().filter(t => t.enRetard || t.pourAuj).length;
  const aReclamer = DB.enfants.filter(e => statutNotif(e).code === "rouge").length;
  const u = DB.parametres.utilisateur;

  document.getElementById("logo").innerHTML = ic("enfants", 24);
  document.getElementById("role-marque").textContent = u.fonction || "";
  document.getElementById("profil").innerHTML =
    '<span class="avatar" style="background:var(--marine-clair);width:34px;height:34px">' +
    ic("personne", 17) + '</span><span class="qui"><b>' + ech(u.nom || "—") +
    "</b><span>" + ech(u.fonction || "") + "</span></span>";

  document.getElementById("nav").innerHTML = ONGLETS.map(o => {
    let p = "";
    if(o.id === "taches" && aFaire)    p = '<span class="compte">' + aFaire + "</span>";
    if(o.id === "notifs" && aReclamer) p = '<span class="compte">' + aReclamer + "</span>";
    return '<button data-onglet="' + o.id + '" class="' + (onglet === o.id ? "actif" : "") +
           '" title="' + ech(o.titre) + '">' + ic(o.icone) +
           '<span class="lib">' + ech(o.titre) + "</span>" + p + "</button>";
  }).join("");
  document.getElementById("bouton-reglages").innerHTML =
    ic("reglages") + '<span class="lib">Paramètres</span>';

  const o = ONGLETS.find(x => x.id === onglet) || ONGLETS[0];
  document.getElementById("titre").textContent = onglet === "accueil"
    ? "Bonjour " + (prenomUtilisateur() || "!") + ","
    : o.titre;
  document.getElementById("sous-titre").textContent = o.sous;
  document.getElementById("date-jour").innerHTML = ic("visites", 16) + " " + ech(fmtLong(aujourdHui()));

  const vues = { accueil:vueAccueil, taches:vueTaches, enfants:vueEnfants,
                 notifs:vueNotifs, rapports:vueRapports, visites:vueVisites };
  document.getElementById("vue").innerHTML = (vues[onglet] || vueAccueil)();
  document.getElementById("pied").innerHTML = ic("cadenas", 15) +
    " Données stockées localement — " + (FS.dossier
      ? "enregistrement automatique dans <b>" + ech(FS.nom) + "</b>"
      : "voir <b>Paramètres</b> pour choisir le dossier");
  majEtatStockage();
  // Le repositionnement force un recalcul complet de la mise en page : on le
  // repousse après l'affichage, et on ne le fait que s'il est nécessaire.
  requestAnimationFrame(() => {
    if(remonterEnHaut){ remonterEnHaut = false; positionPage = 0; window.scrollTo(0, 0); }
    else if(Math.abs(window.scrollY - positionAvant) > 1) window.scrollTo(0, positionAvant);
  });
}

/* =========================================================================
   11. VUE — Rapports (calendrier mois par mois)
   ========================================================================= */

function vueRapports(){
  const dep = new Date();
  const debut = new Date(dep.getFullYear(), dep.getMonth() + etat.anneeRapports*12, 1);

  const mois = [];
  for(let i = 0; i < 12; i++){
    const d = new Date(debut.getFullYear(), debut.getMonth()+i, 1);
    mois.push({ annee:d.getFullYear(), mois:d.getMonth(), annuels:[], semestriels:[] });
  }
  const premier = dISO(debut);
  const dernier = dISO(new Date(debut.getFullYear(), debut.getMonth()+12, 0));
  DB.enfants.forEach(e => [["annuels","annuel"],["semestriels","semestriel"]].forEach(([col,type]) => {
    occurrencesRapport(e, type, premier, dernier).forEach(date => {
      const d = parseISO(date);
      const c = mois.find(m => m.annee === d.getFullYear() && m.mois === d.getMonth());
      if(c) c[col].push({ enfant:e, date, type });
    });
  }));

  const item = o => {
    const envoye = rapportEnvoye(o.enfant, o.type, o.date);
    const st = envoye ? { code:"vert" } : statutEcheance(o.date, DB.parametres.seuilRapportJours);
    const retard = !envoye && o.date < aujourdHui();
    return '<label class="item' + (envoye ? " envoye" : (retard ? " retard" : "")) + '">' +
      '<input type="checkbox" data-action="rapport-envoye" data-id="' + o.enfant.id +
      '" data-type="' + o.type + '" data-date="' + o.date + '"' + (envoye ? " checked" : "") +
      ' title="Cocher quand le rapport est envoyé">' +
      '<span class="puce ' + (retard ? "rouge" : st.code) + '"></span>' +
      ech(nomComplet(o.enfant)) +
      (o.enfant.service ? ' <span class="doux">· ' + ech(o.enfant.service) + "</span>" : "") +
      ' <span class="doux">· ' + ech(fmtFR(o.date).slice(0,5)) + "</span></label>";
  };

  const auj = new Date();
  const cases = mois.map(m => {
    const courant = m.annee === auj.getFullYear() && m.mois === auj.getMonth();
    const tri = l => l.sort((a,b) => a.date.localeCompare(b.date));
    tri(m.annuels); tri(m.semestriels);
    return `<div class="mois">
      <div class="tete-mois ${courant?"courant":""}">
        <span>${MOIS[m.mois].charAt(0).toUpperCase() + MOIS[m.mois].slice(1)}</span>
        <span class="doux">${m.annee}</span>
      </div>
      ${m.annuels.length ? '<div class="part"><div class="lib">Formalisations — rapport annuel</div>' +
        m.annuels.map(item).join("") + "</div>" : ""}
      ${m.semestriels.length ? '<div class="part"><div class="lib">Rapports d\'évolution — semestriel</div>' +
        m.semestriels.map(item).join("") + "</div>" : ""}
      ${(!m.annuels.length && !m.semestriels.length) ? '<div class="rien-mois">Rien de prévu</div>' : ""}
    </div>`;
  }).join("");

  const sansDate = DB.enfants.filter(e => !baseRapport(e));

  const retards = rapportsEnRetard();
  const bandeau = retards.length ? `
    <div class="carte">
      <div class="tete">${ic("rapports",18)}<h2>Rapports en retard</h2>
        <span class="et rouge">${retards.length}</span></div>
      <ul class="liste">${retards.map(ligneRapport).join("")}</ul>
      <p class="aide">Cochez la case quand le rapport est envoyé.</p>
    </div>` : "";

  return bandeau + `
  <div class="carte">
    <div class="tete">${ic("visites",18)}<h2>Calendrier des échéances</h2>
      <span class="et info">De ${ech(MOIS[debut.getMonth()])} ${debut.getFullYear()}
        à ${ech(MOIS[mois[11].mois])} ${mois[11].annee}</span></div>
    <div class="barre">
      <button class="b" data-action="annee" data-delta="-1">← 12 mois avant</button>
      <button class="b" data-action="annee" data-delta="0">Aujourd'hui</button>
      <button class="b" data-action="annee" data-delta="1">12 mois après →</button>
      <button class="b pousse" onclick="window.print()">Imprimer</button>
    </div>
    <p class="aide chapeau">Le <b>rapport annuel</b> tombe à la date de
      formalisation, le <b>rapport d'évolution semestriel</b> six mois plus tôt. Les deux se
      recalculent à chaque renouvellement de la notification.</p>
    <div class="mois-grille">${cases}</div>
    ${sansDate.length ? '<div class="encadre attention haut-marge"><div class="titre">' +
      pluriel(sansDate.length,"enfant") + " sans date de notification</div><span class=\"pt\">" +
      "Impossible de calculer leurs rapports : " +
      sansDate.map(e => ech(nomComplet(e))).join(", ") + ".</span></div>" : ""}
  </div>`;
}

   12. VUE — Droits de visite
   ========================================================================= */

/* --- Catégorie de l'intervenant : donne sa couleur et son pictogramme --- */
const CATEGORIES = {
  papa:    { label:"Papa",    icone:"personne", classe:"papa"    },
  maman:   { label:"Maman",   icone:"personne", classe:"maman"   },
  fratrie: { label:"Fratrie", icone:"enfants",  classe:"fratrie" },
  autre:   { label:"Autre",   icone:"personne", classe:"autre"   }
};
function categorieParent(v){
  const t = (v.parent || "").toLowerCase();
  if(/papa|p[eè]re/.test(t))                return "papa";
  if(/maman|m[eè]re/.test(t))               return "maman";
  if(/fratrie|fr[eè]re|s(oe|œ)ur/.test(t))  return "fratrie";
  return "autre";
}

/** Dernière rencontre programmée pour un enfant, tous intervenants confondus. */
function derniereProgrammee(enf){
  const droits = visitesDe(enf);
  let d = "";
  droits.forEach(({v}) => (v.rencontres||[]).forEach(r => {
    if(estISO(r.date) && r.date > d) d = r.date;
  }));
  // c'est la rencontre la plus lointaine qui compte : elle dit jusqu'à quand
  // l'agenda est couvert, donc quand il faudra rappeler la famille.
  if(d >= aujourdHui())
    return { date:d, code:"vert", texte:"Programmé jusqu'au " + fmtFR(d),
             court:"Jusqu'au " + fmtFR(d) };
  // rien à organiser quand toutes les rencontres se passent sans encadrement
  if(droits.length && droits.every(({v}) => v.sansEncadrement))
    return { date:d, code:"vert", texte:"Sans encadrement", court:"Sans encadrement" };
  if(!d) return { date:"", code:"orange", texte:"Rien de programmé", court:"Rien de programmé" };
  return { date:d, code:"orange", texte:"Dernière le " + fmtFR(d) + " — à reprogrammer",
           court:"À reprogrammer depuis le " + fmtFR(d) };
}

/** Les enfants couverts par un droit de visite : le titulaire et ceux
    avec qui il est regroupé (fratrie placée dans la même famille d'accueil). */
function enfantsDuDroit(e, v){
  const l = [e];
  (v.partageAvec||[]).forEach(id => { const x = enfantParId(id); if(x) l.push(x); });
  return l;
}
/** « THEISMANN Célia + Lucas » quand le nom de famille est commun. */
function libelleDroit(e, v){
  const l = enfantsDuDroit(e, v);
  if(l.length === 1) return nomComplet(e);
  const memeNom = l.every(x => (x.nom||"") === (e.nom||""));
  return memeNom ? (e.nom + " " + l.map(x => x.prenom).join(" + "))
                 : l.map(nomComplet).join(" + ");
}
/** Droits qui concernent un enfant : les siens et ceux qui l'incluent. */
function visitesDe(enf){
  const l = (enf.visites||[]).map(v => ({ e:enf, v }));
  DB.enfants.forEach(e => {
    if(e.id === enf.id) return;
    (e.visites||[]).forEach(v => { if((v.partageAvec||[]).includes(enf.id)) l.push({ e, v }); });
  });
  return l;
}

/** Pastille de date « MAR / 20 / MAI ». */
function pastilleDate(iso){
  const d = parseISO(iso);
  return '<span class="pastille-date"><span class="j">' +
    JOURS[(d.getDay()+6)%7].slice(0,3).toUpperCase() + '</span><span class="n">' +
    d.getDate() + '</span><span class="m">' + MOIS[d.getMonth()].slice(0,3).toUpperCase() +
    "</span></span>";
}

function vueVisites(){
  const auj = aujourdHui();
  const q = etat.recherche.trim().toLowerCase();
  const total = toutesRencontres();

  const droits = [];
  DB.enfants.slice().sort(parNom).forEach(e => (e.visites||[]).forEach(v => droits.push({ e, v })));
  const avecDroit = DB.enfants.slice().sort(parNom).filter(e => visitesDe(e).length);

  /* ------------------------------------------------------ 1. les compteurs */
  const ceMois  = r => String(r.date || "").slice(0, 7) === auj.slice(0, 7);
  // un mois : les rencontres sont le plus souvent mensuelles, une quinzaine
  // afficherait zéro la moitié du temps.
  const horizon = decalerJours(auj, 30);
  const nAvenir = total.filter(o => estISO(o.rencontre.date) && o.rencontre.date >= auj &&
                                    o.rencontre.date <= horizon &&
                                    o.rencontre.presence === "prevue").length;
  const nVenus  = total.filter(o => ceMois(o.rencontre) && o.rencontre.presence === "venu").length;
  const nAbsent = total.filter(o => ceMois(o.rencontre) && o.rencontre.presence === "absent").length;
  const nMois   = total.filter(o => ceMois(o.rencontre)).length;

  /* Ces tuiles informent, elles ne mènent nulle part : pas de chevron,
     qui reste la marque des tuiles sur lesquelles on peut cliquer. */
  const stat = (couleur, marque, titre, n, sous) => `
    <div class="tuile stat">
      <span class="rond ${couleur}">${marque}</span>
      <span class="txt"><span class="t">${ech(titre)}</span>
        <span class="n ${couleur}">${n}</span>
        <span class="s">${ech(sous)}</span></span>
    </div>`;

  const compteurs = `<div class="tuiles">
    ${stat("bleu",   ic("visites",21),  "Rencontres à venir", nAvenir, "dans les 30 prochains jours")}
    ${stat("vert",   "✓",               "Honorées",           nVenus,  "ce mois")}
    ${stat("rouge",  "✕",               "Manquées",           nAbsent, "ce mois")}
    ${stat("orange", ic("rapports",21), "Rencontres au total", nMois,  "ce mois")}
  </div>`;

  /* ------------------------------------------- 2. la liste : choisir un enfant */
  const visibles = avecDroit.filter(e => !q || nomComplet(e).toLowerCase().includes(q));
  // pas d'écriture dans « etat » ici : une recherche qui masque l'enfant choisi
  // en montre un autre, et le retrouve dès que la recherche est effacée.
  const choisi = visibles.find(e => e.id === etat.enfantVisite) || visibles[0] || null;

  const ligneEnfant = e => {
    const p = derniereProgrammee(e);
    const n = visitesDe(e).reduce((s, {v}) => s + (v.rencontres||[]).filter(r =>
      estISO(r.date) && r.date >= auj && r.presence === "prevue").length, 0);
    return `<button class="le ${choisi && e.id === choisi.id ? "actif" : ""}"
        data-action="choisir-enfant" data-id="${e.id}">
      ${avatar(e)}
      <span class="extensible">
        <span class="le-nom">${ech(nomComplet(e))}</span>
        <span class="le-sous ${p.code}">${ech(p.court)}</span>
      </span>
      ${n ? '<span class="et info">' + n + "</span>" : ""}
    </button>`;
  };

  const carteListe = `
    <div class="carte">
      <div class="tete">${ic("enfants",18)}<h2>Choisir un enfant</h2>
        <span class="et info">${avecDroit.length}</span></div>
      <input type="search" id="recherche" placeholder="Rechercher un enfant…"
             class="bas-marge" value="${ech(etat.recherche)}">
      ${visibles.length ? '<div class="liste-enfants">' + visibles.map(ligneEnfant).join("") + "</div>"
        : '<p class="rien">' + (q ? "Aucun enfant à ce nom." : "Aucun droit de visite encodé.") + "</p>"}
      <button class="b pleine haut-marge" data-action="visite-nouvelle">${ic("plus",14)}
        Nouveau droit de visite</button>
    </div>`;

  /* ------------------------------------------------------ 3. le dossier choisi */
  const delai = iso => {
    const n = joursEntre(auj, iso);
    return n <= 0 ? "Aujourd'hui" : n === 1 ? "Demain" : "Dans " + n + " jours";
  };

  const f = etat.filtreVisite;
  const garde = r =>
    (f !== "completer" || aCompleter(r)) &&
    (f !== "venu"      || r.presence === "venu") &&
    (f !== "absent"    || r.presence === "absent");

  let carteDetail;
  if(!choisi){
    carteDetail = '<div class="carte"><p class="vide">Choisissez un enfant dans la liste.</p></div>';
  }else{
    const e = choisi;
    const p = derniereProgrammee(e);
    const mesDroits = visitesDe(e);

    const rencontres = [];
    mesDroits.forEach(({e:o, v}) => (v.rencontres||[]).forEach(r => rencontres.push({ o, v, r })));

    /* Les deux onglets se partagent les rencontres à la date du jour : celle
       d'aujourd'hui est à la fois la prochaine et celle qu'on vient noter. */
    const aVenir = rencontres
      .filter(x => estISO(x.r.date) && x.r.date >= auj)
      .sort((a,b) => a.r.date.localeCompare(b.r.date) ||
                     String(a.r.debut||"").localeCompare(String(b.r.debut||"")));
    const passees = rencontres.filter(x => !estISO(x.r.date) || x.r.date <= auj);

    const freq = mesDroits.map(({v}) => v.frequence).filter(Boolean).join(" · ");

    /* le rappel des droits : intervenant, fréquence, créneaux, et de quoi corriger */
    const lignesDroits = mesDroits.map(({e:o, v}) => {
      const cat = categorieParent(v);
      const cr = (v.creneaux||[]).map(c =>
        "semaine " + c.semaine + " " + (c.debut || "?") + "–" + (c.fin || "?")).join(", ");
      return `<div class="dv-droit">
        <span class="rond-parent ${CATEGORIES[cat].classe}">${ic(CATEGORIES[cat].icone, 16)}</span>
        <div class="extensible">
          <div><b>${ech(libelleParent(v))}</b>${v.frequence ? ' <span class="doux">· ' +
            ech(v.frequence) + "</span>" : ""}</div>
          <div class="pt doux">${cr ? ech(cr) : "aucun créneau encodé"}</div>
          ${v.sansEncadrement ? '<span class="ce-libre">rencontres sans encadrement</span>' : ""}
          ${(v.partageAvec||[]).length ? '<span class="ce-groupe">' + ic("enfants",12) +
            " regroupé : " + ech(libelleDroit(o, v)) + "</span>" : ""}
        </div>
        <div class="actions">
          <button class="b mini" data-action="visite-modifier" data-id="${o.id}"
                  data-vid="${v.id}" title="Modifier ce droit de visite">✎</button>
          <button class="b mini danger" data-action="visite-supprimer" data-id="${o.id}"
                  data-vid="${v.id}" title="Supprimer ce droit de visite">✕</button>
        </div>
      </div>`;
    }).join("");

    /* --- onglet « prochaines rencontres » --- */
    const boutonsRencontre = ({o,v,r}) => `<div class="actions">
      <button class="b mini" data-action="rencontre-modifier" data-id="${o.id}"
              data-vid="${v.id}" data-rid="${r.id}" title="Modifier">✎</button>
      <button class="b mini danger" data-action="rencontre-supprimer" data-id="${o.id}"
              data-vid="${v.id}" data-rid="${r.id}" title="Supprimer">🗑</button>
    </div>`;

    const vueProchaines = aVenir.length ? aVenir.slice(0, 8).map(x => {
      const cat = categorieParent(x.v);
      return `<div class="rdv">
        ${pastilleDate(x.r.date)}
        <span class="rond-parent ${CATEGORIES[cat].classe}">${ic(CATEGORIES[cat].icone, 17)}</span>
        <div class="extensible">
          <div class="rdv-qui">${ech(libelleParent(x.v))}</div>
          <div class="pt doux">${ech(heuresDe(x.r) || "heure à préciser")}</div>
        </div>
        <span class="et info nowrap">${ech(delai(x.r.date))}</span>
        ${boutonsRencontre(x)}
      </div>`;
    }).join("") + (aVenir.length > 8
        ? '<p class="aide">et ' + (aVenir.length - 8) +
          " autre(s) plus loin — elles figurent dans l'historique.</p>" : "")
      : '<p class="rien">Aucune rencontre programmée. ' +
        (p.code === "vert" ? "" : "C'est le moment de contacter la famille.") + "</p>";

    /* --- onglet « historique » --- */
    const compte = {
      tout:      passees.length,
      completer: passees.filter(x => aCompleter(x.r)).length,
      venu:      passees.filter(x => x.r.presence === "venu").length,
      absent:    passees.filter(x => x.r.presence === "absent").length
    };
    const puce = (id, texte, n) =>
      '<button data-action="filtre-visite" data-f="' + id + '" class="' +
      (f === id ? "actif" : "") + '">' + texte + " " + n + "</button>";

    const lignes = passees.filter(x => garde(x.r))
      .sort((a,b) => String(b.r.date||"").localeCompare(String(a.r.date||"")) ||
                     String(b.r.debut||"").localeCompare(String(a.r.debut||"")));
    const deplie = !!etat.ouvertes[e.id];
    const affichees = deplie ? lignes : lignes.slice(0, 10);

    const vueHistorique = `
      <div class="filtres bas-marge">
        ${puce("tout","Toutes", compte.tout)}${puce("completer","À compléter", compte.completer)}
        ${puce("venu","Honorées", compte.venu)}${puce("absent","Manquées", compte.absent)}
      </div>
      ${lignes.length ? `<div class="tableau-enveloppe"><table>
        <thead><tr><th class="num">Date</th><th>Intervenant</th><th class="num">Horaire</th>
          <th class="centre">Le parent</th><th class="col-note">Note</th><th></th></tr></thead>
        <tbody>${affichees.map(x => `<tr>
          <td class="num nowrap">${ech(fmtFR(x.r.date))}${
            aCompleter(x.r) ? '<br><span class="et orange">à compléter</span>' : ""}</td>
          <td>${ech(libelleParent(x.v))}${(x.v.partageAvec||[]).length
            ? '<br><span class="doux pt">avec ' + ech(libelleDroit(x.o, x.v)) + "</span>" : ""}</td>
          <td class="num nowrap">${ech(heuresDe(x.r) || "—")}</td>
          <td class="centre"><div class="bascule">
            <button class="oui ${x.r.presence === "venu" ? "actif" : ""}"
                    data-action="presence" data-p="venu" data-id="${x.o.id}" data-vid="${x.v.id}"
                    data-rid="${x.r.id}" title="Le parent est venu">✓ Présent</button>
            <button class="non ${x.r.presence === "absent" ? "actif" : ""}"
                    data-action="presence" data-p="absent" data-id="${x.o.id}" data-vid="${x.v.id}"
                    data-rid="${x.r.id}" title="Le parent n'est pas venu">✕ Absent</button>
          </div></td>
          <td class="col-note"><div class="note-vive" data-note="1"
              data-id="${x.o.id}" data-vid="${x.v.id}" data-rid="${x.r.id}" tabindex="0"
              title="Cliquez pour écrire">${x.r.note ? ech(x.r.note)
                : '<span class="doux">Note de synthèse…</span>'}</div></td>
          <td>${boutonsRencontre(x)}</td>
        </tr>`).join("")}</tbody></table></div>
        ${lignes.length > 10 ? '<button class="b pleine haut-marge" data-action="deplier" data-id="' +
          e.id + '">' + (deplie ? "Réduire" : "Voir les " + lignes.length + " rencontres") +
          "</button>" : ""}
        <p class="aide">La présence et la note se saisissent directement dans le tableau :
          un clic sur ✓ Présent ou ✕ Absent, et la note s'enregistre en quittant la case.</p>`
        : '<p class="rien">Aucune rencontre passée' +
          (f === "tout" ? " pour cet enfant." : " pour ce filtre.") + "</p>"}`;

    const ong = etat.ongletVisite === "historique" ? "historique" : "prochaines";
    const bouton = (id, texte) => '<button class="' + (ong === id ? "actif" : "") +
      '" data-action="onglet-visite" data-o="' + id + '">' + texte + "</button>";

    carteDetail = `
      <div class="carte">
        <div class="tete dv-tete">
          ${avatar(e, "carte")}
          <div class="extensible">
            <h2>${ech(nomComplet(e))}</h2>
            <div class="pt doux">${freq ? "Fréquence : " + ech(freq)
              : pluriel(mesDroits.length,"droit") + " de visite"}</div>
          </div>
          <span class="et ${p.code}">${ech(p.texte)}</span>
          <button class="b mini" data-action="enfant-modifier" data-id="${e.id}">Voir la fiche</button>
          <button class="b mini" data-action="rencontre-enfant" data-id="${e.id}">
            ${ic("plus",13)} Rencontre</button>
          <button class="b mini primaire" data-action="rencontres-enfant" data-id="${e.id}">
            ${ic("plus",13)} Plusieurs dates</button>
        </div>
        ${lignesDroits}
        <div class="onglets-d">
          ${bouton("prochaines", "Prochaines rencontres" + (aVenir.length ? " (" + aVenir.length + ")" : ""))}
          ${bouton("historique", "Historique des rencontres")}
        </div>
        ${ong === "prochaines" ? vueProchaines : vueHistorique}
      </div>`;
  }

  /* ------------------------------------------- 4. schéma de récurrence mensuel */
  const semaines = [1,2,3,4].map(n => {
    const items = [];
    droits.forEach(({e,v}) => (v.creneaux||[]).forEach(c => {
      if(c.semaine === n) items.push({ e, v, c });
    }));
    items.sort((a,b) => String(a.c.debut||"").localeCompare(String(b.c.debut||"")));
    return { n, items };
  });
  const sansSchema = droits.filter(({v}) => !(v.creneaux||[]).length);

  const colonnes = semaines.map(({n, items}) => `
    <div class="sem">
      <div class="sem-tete">Semaine ${n}</div>
      <div class="sem-corps">
        ${items.length ? items.map(({e,v,c}) => {
          const cat = categorieParent(v);
          return `<div class="creneau ${CATEGORIES[cat].classe}">
            <div class="cr-haut">${ic(CATEGORIES[cat].icone, 15)}
              <span class="cr-nom">${ech(e.nom)}</span></div>
            <div class="cr-prenom">${ech(enfantsDuDroit(e,v).map(x => x.prenom).join(" + "))}</div>
            <div class="cr-h">${ech((c.debut || "?") + " – " + (c.fin || "?"))}</div>
            <div class="cr-bas">${ech(libelleParent(v))}</div>
          </div>`;
        }).join("") : '<div class="sem-vide">—</div>'}
      </div>
    </div>`).join("");

  const aReprogrammer = avecDroit.filter(e => derniereProgrammee(e).code !== "vert");

  /* --------------------------------------------------------------- assemblage */
  return compteurs + `
  ${aReprogrammer.length ? '<div class="carte"><div class="tete">' + ic("horloge",18) +
    "<h2>Familles à recontacter</h2><span class='et orange'>" + aReprogrammer.length +
    "</span></div><p class='pt'>" +
    aReprogrammer.map(e => '<button class="lien-nom" data-action="choisir-enfant" data-id="' +
      e.id + '">' + ech(nomComplet(e)) + "</button>").join(", ") +
    " — aucune rencontre à venir n'est programmée.</p></div>" : ""}

  <div class="grille dv">
    ${carteListe}
    ${carteDetail}
  </div>

  <div class="carte">
    <div class="tete">${ic("visites",18)}<h2>Schéma de récurrence (mensuel)</h2></div>
    <div class="schema">${colonnes}</div>
    <div class="legende">
      ${["papa","maman","fratrie"].map(k =>
        '<span>' + ic(CATEGORIES[k].icone, 15) + " " + CATEGORIES[k].label + "</span>").join("")}
    </div>
    ${sansSchema.length ? '<p class="aide">Sans créneau encodé : ' +
      sansSchema.map(({e,v}) => ech(nomComplet(e))).join(", ") +
      ". Le ✎ à côté du droit de visite permet d'indiquer les semaines et les heures.</p>" : ""}
  </div>

  <div class="carte">
    <div class="tete">${ic("rapports",18)}<h2>Exporter les notes</h2></div>
    <p class="aide">Un document Word reprenant les notes des rencontres, un chapitre par enfant.
      Vous choisissez la période, les enfants et les rencontres à retenir : le document est
      directement utilisable dans vos rapports.</p>
    <div class="barre haut-marge">
      <button class="b primaire" data-action="word">${ic("rapports",15)} Exporter les notes</button>
      <button class="b pousse" onclick="window.print()">Imprimer</button>
    </div>
  </div>`;
}

/* =========================================================================
   13. FORMULAIRES
